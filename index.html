<style>
:root{
  --verde:#00a986; --verde-2:#58cada4; --grafite:#1d262d; --claro:#f6f6f6; --branco:#fff;
  --linha:#e2e6e8; --linha-2:#eef1f2; --texto-2:#5a6770; --texto-3:#8a959c;
  --ambar:#c9861a; --ambar-bg:#fdf3e1; --vermelho:#c0453b; --vermelho-bg:#fbeceb;
  --verde-bg:#e6f6f2; --azul:#2f6f9f; --azul-bg:#e8f1f8;
  --raio:10px; --raio-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Sora',system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--grafite);background:var(--claro)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde)}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:500}
.muted{color:var(--texto-2)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ===== Login ===== */
#tela-login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-marca{background:var(--verde);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-marca img{height:64px;filter:brightness(0) invert(1);align-self:flex-start}
.login-marca .faixa{position:absolute;right:-80px;bottom:-80px;width:360px;height:360px;border-radius:50%;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 10px,rgba(255,255,255,0) 10px 20px)}
.login-marca h1{font-size:34px;font-weight:300;max-width:420px;color:#fff}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.login-form form{width:100%;max-width:340px;display:grid;gap:16px}
.login-form h2{font-size:22px}

/* ===== Layout ===== */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.lateral{background:var(--grafite);color:#cfd6da;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.lateral .logo{padding:28px 24px 22px}
.lateral .logo img{height:40px;filter:brightness(0) invert(1)}
.menu{flex:1;overflow:auto;padding:6px 10px}
.menu .grupo{font-size:11px;color:#7f8b92;padding:14px 12px 6px}
.menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:var(--raio-s);color:#dde3e6;text-decoration:none;font-weight:400}
.menu a:hover{background:rgba(255,255,255,.06)}
.menu a.ativo{background:var(--verde);color:#fff;font-weight:500}
.menu a .cont{font-size:11px;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 8px}
.lateral .usuario{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.lateral .usuario b{display:block;color:#fff;font-weight:500}
.lateral .usuario button{background:none;border:0;color:var(--verde-2);padding:0;margin-top:6px;cursor:pointer}
.principal{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 32px 6px;flex-wrap:wrap}
.topo .acoes{display:flex;gap:8px;flex-wrap:wrap}
#conteudo{padding:16px 32px 48px}
.btn.btn-menu{display:none}

/* ===== Componentes ===== */
.painel{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:20px}
.painel + .painel{margin-top:16px}
.painel-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grade{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:var(--raio-s);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c9d0d4}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.prim:hover{background:#009675}
.btn.escuro{background:var(--grafite);border-color:var(--grafite);color:#fff}
.btn.perigo{color:var(--vermelho);border-color:#ecc9c6}
.btn.link{border:0;background:none;color:var(--verde);padding:4px 6px}
.btn.peq{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
label.campo{display:grid;gap:5px;font-size:12px;color:var(--texto-2);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;border:1px solid var(--linha);border-radius:var(--raio-s);padding:8px 10px;background:#fff;font-size:14px;color:var(--grafite)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--verde);outline:none}
.check{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.ocultar-status [data-col=status]{display:none}
.unit-calc{font-size:11px;color:var(--texto-3);margin-top:3px;white-space:nowrap}
.linha-form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.linha-form > *{flex:1;min-width:150px}

table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--texto-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--linha-2);vertical-align:top}
tr.clicavel{cursor:pointer} tr.clicavel:hover td{background:#fafbfb}
.tabela-wrap{overflow-x:auto}
.dir{text-align:right}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:20px;padding:3px 10px;white-space:nowrap;background:var(--linha-2);color:var(--grafite)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.b-cinza{background:#eef1f2;color:#56626a}
.b-azul{background:var(--azul-bg);color:var(--azul)}
.b-ambar{background:var(--ambar-bg);color:#9a6410}
.b-verde{background:var(--verde-bg);color:#007a61}
.b-escuro{background:var(--grafite);color:#fff}
.b-vermelho{background:var(--vermelho-bg);color:var(--vermelho)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.ativo{background:var(--grafite);color:#fff;border-color:var(--grafite)}

.vazio{text-align:center;padding:40px 16px;color:var(--texto-2)}
.alerta{border-radius:var(--raio-s);padding:10px 14px;font-size:13px;background:var(--ambar-bg);color:#7d520d}
.alerta.erro{background:var(--vermelho-bg);color:var(--vermelho)}

/* ===== Trilho de produção (elemento central) ===== */
.trilho{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-width:180px}
.trilho span{height:8px;border-radius:2px;background:#e3e8ea;position:relative}
.trilho span.feito{background:var(--verde)}
.trilho span.atual{background:var(--grafite)}
.trilho span i{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--texto-2);font-weight:500}
.trilho.cancelado span{background:#f1d4d1}
.trilho-grande{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.trilho-grande div{border-top:5px solid #e3e8ea;padding-top:8px;font-size:12px;color:var(--texto-3)}
.trilho-grande div.feito{border-color:var(--verde);color:var(--grafite)}
.trilho-grande div.atual{border-color:var(--grafite);color:var(--grafite);font-weight:700}
.trilho-grande small{display:block;color:var(--texto-2);font-weight:400}

/* ===== Início ===== */
.etapas{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:1px solid var(--linha);border-radius:var(--raio);background:#fff;overflow:hidden}
.etapas button{border:0;border-right:1px solid var(--linha);background:#fff;padding:18px 14px;text-align:left;cursor:pointer}
.etapas button:last-child{border-right:0}
.etapas button:hover{background:#fafbfb}
.etapas .n{font-size:32px;font-weight:300;display:block;line-height:1.1}
.etapas .t{font-size:12px;color:var(--texto-2)}
.etapas button.tem .n{color:var(--verde);font-weight:500}
.cartao-num{border:1px solid var(--linha);border-radius:var(--raio);background:#fff;padding:16px}
.cartao-num .n{font-size:24px;font-weight:500;display:block}
.cartao-num.alerta-num .n{color:var(--vermelho)}

/* ===== Modal / toast ===== */
.fundo-modal{position:fixed;inset:0;background:rgba(29,38,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:var(--raio);width:100%;max-width:640px;box-shadow:0 20px 60px rgba(29,38,45,.25)}
.modal.largo{max-width:920px}
.modal-cab{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--linha)}
.modal-corpo{padding:20px 22px;display:grid;gap:14px}
.modal-rodape{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--linha)}
.fechar{border:0;background:none;font-size:22px;cursor:pointer;color:var(--texto-2);line-height:1}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:60}
.toast{background:var(--grafite);color:#fff;padding:10px 16px;border-radius:var(--raio-s);font-size:13px;max-width:360px}
.toast.erro{background:var(--vermelho)}
.carregando{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--verde),var(--verde-2));z-index:70;animation:carr 1s linear infinite;background-size:200% 100%}
@keyframes carr{from{background-position:0 0}to{background-position:200% 0}}

/* ===== Busca de cliente ===== */
.busca-box{position:relative}
.busca-res{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--linha);border-radius:var(--raio-s);margin-top:4px;z-index:20;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(29,38,45,.12)}
.busca-res div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--linha-2)}
.busca-res div:hover{background:var(--verde-bg)}

/* ===== Linha do tempo ===== */
.tempo{display:grid;gap:12px}
.tempo div{border-left:2px solid var(--linha);padding-left:12px;font-size:13px}
.tempo div.obs{border-color:var(--verde-2)}
.tempo small{display:block;color:var(--texto-3);font-size:11px}

.barra-acao{position:sticky;bottom:0;background:var(--grafite);color:#fff;border-radius:var(--raio);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.barra-acao select{width:auto;min-width:220px}
.grupo-forn{margin-top:18px}
.grupo-forn:first-child{margin-top:0}
.grupo-forn h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.itens-editor td{padding:6px}
.itens-editor input,.itens-editor select{padding:6px 8px;font-size:13px}
.totais{display:grid;gap:4px;justify-content:end;text-align:right;margin-top:10px}
.totais b{font-size:18px}

#aviso-novidades{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--grafite);color:#fff;border-radius:30px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;z-index:45;box-shadow:0 8px 24px rgba(29,38,45,.25);font-size:13px}
#aviso-novidades[hidden]{display:none}
@media (max-width:960px){
  #app{grid-template-columns:1fr}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .lateral.aberta{transform:none}
  .btn.btn-menu{display:inline-flex}
  .topo,#conteudo{padding-left:16px;padding-right:16px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .etapas{grid-template-columns:repeat(3,1fr)}
  .etapas button{border-bottom:1px solid var(--linha)}
  #tela-login{grid-template-columns:1fr}
  .login-marca{padding:32px;min-height:200px}
  .login-marca h1{font-size:24px}
}
@media (max-width:560px){ .g2,.g3,.g4{grid-template-columns:1fr} .trilho-grande small{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
@media print{ .lateral,.topo .acoes,.btn,.barra-acao{display:none!important} #app{display:block} body{background:#fff} .painel{border:0;padding:0} }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   GVH · Sistema de Pedidos  —  frontend
   Comunicação: POST {token, acao, dados} → n8n → Supabase (função api)
   ============================================================ */
const API_URL = 'https://gvh-n8n.kjb64n.easypanel.host/webhook/gvh-sistema';
// Chave pública (feita para ficar no navegador). Ela só consegue OUVIR o canal de avisos
// "gvh-mudancas" — não lê nenhuma tabela. Os dados sempre vêm pelo n8n.
const SUPABASE_URL = 'https://zvcvdfkumjlvwqjdbiiw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_B8Rn0FkmxWafKLo4pog7qA_s3evDks4';
const INTERVALO_SEGURANCA_MS = 300000; // 5 min: só cobre queda do Realtime
const S = { token: null, usuario: null, perm: {}, base: null, cache: {}, parcelas: {}, feriados: {} };

/* ---------- utilitários ---------- */
// Sem "el", procura primeiro dentro da tela aberta (as telas ficam guardadas lado a lado)
const $ = (s, el) => el ? el.querySelector(s) : ((S.vistaAtual && S.vistaAtual.el.querySelector(s)) || document.querySelector(s));
const $$ = (s, el) => { if (el) return [...el.querySelectorAll(s)]; const r = S.vistaAtual ? [...S.vistaAtual.el.querySelectorAll(s)] : []; return r.length ? r : [...document.querySelectorAll(s)]; };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => Number(v || 0).toLocaleString('pt-BR', {maximumFractionDigits: 3});
const data = v => { if (!v) return '—'; const [a,m,d] = String(v).slice(0,10).split('-'); return `${d}/${m}/${a}`; };
const dataHora = v => v ? new Date(v).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const somaMeses = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0,10); };
const pode = chave => !!S.perm[chave];
const podeStatus = st => (S.perm.status_item_permitidos || []).includes(st);
/* fornecedor: só quem acessa a aba Pré-impressão (mesma regra do banco: fn_ve_fornecedor) */
const veFornecedor = () => podeStatus('em_producao') || podeStatus('despachado');
const formDados = form => Object.fromEntries(new FormData(form).entries());
const soDoc = v => String(v || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
const fmtDoc = v => { const d = soDoc(v);
  if (d.length === 11) return d.replace(/^(.{3})(.{3})(.{3})(.{2})$/, '$1.$2.$3-$4');
  if (d.length === 14) return d.replace(/^(.{2})(.{3})(.{3})(.{4})(.{2})$/, '$1.$2.$3/$4-$5');
  return v || ''; };
const fmtTel = v => { const d = String(v || '').replace(/\D/g, ''); const m = d.match(/^55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : (v || ''); };

function toast(msg, erro = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), erro ? 6000 : 3000);
}

let carregando = 0;
function setCarregando(d) { carregando += d; $('#carregando').classList.toggle('hidden', carregando <= 0); }

async function api(acao, dados = {}, silencioso = false) {
  setCarregando(1);
  try {
    const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json'},
                                     body: JSON.stringify({ token: S.token, acao, dados }) });
    let j; try { j = await r.json(); } catch { throw new Error('Resposta inválida do servidor.'); }
    if (Array.isArray(j)) j = j[0];
    if (!j || j.ok !== true) {
      if (j && j.codigo === 'SESSAO' && acao !== 'login') { sairLocal(); throw new Error('Sua sessão expirou. Entre novamente.'); }
      throw new Error((j && (j.erro || j.message)) || 'Não foi possível concluir a ação.');
    }
    if (!/^(login|sessao|base|resumo|listar_|obter_|buscar_|arte_arquivo|comprovante_arquivo|calcular_preco|verificar_documento|ncm_consultar|fornecedor_senha|orc_publico|previa_cancelamento)/.test(acao) && acao !== 'cadastro_publico' && !(acao === 'feriados' && !dados.salvar && !dados.excluir)) marcarTelasDesatualizadas();
    return j;
  } catch (e) {
    if (!silencioso) toast(e.message === 'Failed to fetch' ? 'Sem conexão com o servidor.' : e.message, true);
    throw e;
  } finally { setCarregando(-1); }
}

/* ---------- paginação ("mostrar mais") ---------- */
const PASSO_LISTA = 50;
const limLista = chave => (S.cache.lim ||= {})[chave] || PASSO_LISTA;
const zerarLista = chave => { (S.cache.lim ||= {})[chave] = PASSO_LISTA; };
function rodapeLista(chave, mostrados, total, rotulo, extra = '') {
  if (!total) return '';
  if (total <= mostrados) return `<p class="small muted" style="margin:10px 0 0">${total} ${rotulo}.${extra ? ' ' + extra : ''}</p>`;
  return `<div style="display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap"><span class="small muted">Mostrando ${mostrados} de ${total} ${rotulo}.${extra ? ' ' + extra : ''}</span>
    <button type="button" class="btn peq" data-mais="${chave}">Mostrar mais ${Math.min(PASSO_LISTA, total - mostrados)}</button></div>`;
}
function ligarMais(el, chave, aoMudar) {
  const b = el.querySelector(`[data-mais="${chave}"]`);
  if (b) b.onclick = () => { S.cache.lim[chave] = limLista(chave) + PASSO_LISTA; aoMudar(); };
}

/* ---------- modal ---------- */
function abrirModal({ titulo, corpo, rodape = '', largo = false, aoAbrir }) {
  const f = document.createElement('div');
  f.className = 'fundo-modal';
  f.innerHTML = `<div class="modal ${largo ? 'largo' : ''}" role="dialog" aria-modal="true">
      <div class="modal-cab"><h2>${esc(titulo)}</h2><button class="fechar" aria-label="Fechar">×</button></div>
      <div class="modal-corpo">${corpo}</div>
      ${rodape ? `<div class="modal-rodape">${rodape}</div>` : ''}</div>`;
  const fechar = () => f.remove();
  f.querySelector('.fechar').onclick = fechar;
  f.addEventListener('mousedown', e => { if (e.target === f) fechar(); });
  f.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  $('#modais').appendChild(f);
  const primeiro = f.querySelector('input,select,textarea'); if (primeiro) primeiro.focus();
  if (aoAbrir) aoAbrir(f, fechar);
  return { el: f, fechar };
}
function confirmar(texto, rotulo = 'Confirmar', perigo = false) {
  return new Promise(res => {
    const m = abrirModal({ titulo: 'Confirmação', corpo: `<p style="margin:0">${texto}</p>`,
      rodape: `<button class="btn" data-n>Voltar</button><button class="btn ${perigo ? 'perigo' : 'prim'}" data-s>${esc(rotulo)}</button>` });
    m.el.querySelector('[data-n]').onclick = () => { m.fechar(); res(false); };

const ETAPAS = [
  ['criacao_arte','Criação de Arte'], ['pre_impressao','Pré-Impressão'],
  ['em_producao','Em produção'], ['despachado','Despachado'], ['expedicao','Expedição'], ['saida','Transporte / Retirada'], ['entregue','Entregue']
];
const ORDEM_PED = { criacao_arte:0, pre_impressao:1, em_producao:2, despachado:3, expedicao:4, em_transporte:5, aguardando_retirada:5, entregue:6, concluido:7, cancelado:-1 };
const ORDEM_ITEM = { arte_a_fazer:0, arte_em_alteracao:0, arte_em_aprovacao:0, pre_impressao:1, em_producao:2, despachado:3, expedicao:4, em_transporte:5, aguardando_retirada:5, entregue:6, cancelado:-1 };
const COR_STATUS = {
  recebido:'b-cinza', criacao_arte:'b-azul', arte_a_fazer:'b-azul', arte_em_alteracao:'b-ambar', arte_em_aprovacao:'b-azul',
  pre_impressao:'b-ambar', em_producao:'b-ambar', despachado:'b-azul', expedicao:'b-verde', em_transporte:'b-verde', aguardando_retirada:'b-verde',
  entregue:'b-verde', concluido:'b-escuro', cancelado:'b-vermelho'
};
const COR_FIN = { pago:'b-verde', atrasado:'b-vermelho', boleto:'b-azul', sinal_pago:'b-ambar', aguardando_pagamento:'b-cinza' };
const nomeStatusItem = c => (S.base?.status_item || []).find(s => s.codigo === c)?.nome || c;
const nomeStatusPed = c => (S.base?.status_pedido || []).find(s => s.codigo === c)?.nome || c;
const badge = (txt, cls) => `<span class="badge ${cls || 'b-cinza'}">${esc(txt)}</span>`;
const badgeItem = c => badge(nomeStatusItem(c), COR_STATUS[c]);
const badgePed = (c, nome) => badge(nome || nomeStatusPed(c), COR_STATUS[c]);
const badgeFin = (c, nome) => c ? badge(nome, COR_FIN[c]) : '';

function trilho(pedido) {
  const at = ORDEM_PED[pedido.status];
  if (at === -1) return `<div class="trilho cancelado">${'<span></span>'.repeat(7)}</div>`;
  const cont = [0,0,0,0,0,0,0];
  (pedido.itens || []).forEach(i => { const o = ORDEM_ITEM[i.status]; if (o >= 0) cont[o]++; });
  return `<div class="trilho" title="${esc(pedido.status_nome || '')}">` + ETAPAS.map((e, k) => {
    const cls = at === 7 || k < at ? 'feito' : (k === at ? 'atual' : '');
    return `<span class="${cls}">${cont[k] && at !== 7 ? `<i>${cont[k]}</i>` : ''}</span>`;
  }).join('') + '</div>';
}
function trilhoGrande(pedido) {
  const at = ORDEM_PED[pedido.status];
  const cont = [0,0,0,0,0,0,0];
  (pedido.itens || []).forEach(i => { const o = ORDEM_ITEM[i.status]; if (o >= 0) cont[o]++; });
  return `<div class="trilho-grande">` + ETAPAS.map((e, k) => {
    const cls = at === 7 || (at >= 0 && k < at) ? 'feito' : (k === at ? 'atual' : '');
    return `<div class="${cls}">${esc(e[1])}<small>${cont[k] ? cont[k] + (cont[k] > 1 ? ' itens' : ' item') : ''}</small></div>`;
  }).join('') + '</div>';
}

function montarMenu() {
  $('#menu').innerHTML = itensMenu().map(i => i.length === 1
    ? `<div class="grupo">${esc(i[0])}</div>`
    : `<a href="${i[0]}" data-rota="${i[0]}">${esc(i[1])}</a>`).join('');
}
const ROTAS = {};
function rota(nome, fn) { ROTAS[nome] = fn; }
// Telas de formulário nunca se atualizam sozinhas: o que foi digitado fica guardado até salvar ou descartar.
const ROTAS_FORM = new Set(['novo', 'orcamento']);
const VISTAS = new Map();   // chave da rota -> { el, nome, param, form, sujo, editando, topo, dados }
const MAX_VISTAS = 12;

function chaveRota() { return (location.hash || '#/inicio').replace(/^#\/?/, '') || 'inicio'; }
// vista dona de um elemento de tela (cada desenho sabe a que tela pertence, mesmo com outro desenho acontecendo ao mesmo tempo)
function vistaDoEl(el) { for (const v of VISTAS.values()) if (v.el === el) return v; return { el, descartada: true }; }
function definirTopoEm(el, titulo, acoes = '') {
  const v = vistaDoEl(el); if (v.descartada) return;
  const caixa = document.createElement('div'); caixa.innerHTML = acoes;
  const t = { titulo, acoes, nos: [...caixa.childNodes] };
  v.topo = t;
  if (v === S.vistaAtual) aplicarTopo(t);
}
function definirTopo(titulo, acoes = '') {
  const v = vistaRender();
  // guarda os próprios botões (e não só o HTML): ao voltar para a tela, os cliques ligados por código continuam funcionando
  const caixa = document.createElement('div'); caixa.innerHTML = acoes;
  const t = { titulo, acoes, nos: [...caixa.childNodes] };
  if (v) v.topo = t;
  if (!v || v === S.vistaAtual) aplicarTopo(t);
}
function aplicarTopo(t) {
  $('#titulo', document).textContent = t.titulo;
  const box = $('#topo-acoes', document);
  if (t.nos) box.replaceChildren(...t.nos); else box.innerHTML = t.acoes || '';
  document.title = (t.titulo || 'Sistema') + ' · GVH';
}
// vista que está sendo desenhada agora (ou a atual, se nenhuma)
const vistaRender = () => S.vistaEmRender || S.vistaAtual;

async function renderVista(v) {
  // nunca desenha a mesma tela duas vezes ao mesmo tempo (o aviso do Realtime chegava no meio e quebrava a tela)
  if (v.renderizando) { v.renderDeNovo = true; return v.renderizando; }
  v.renderizando = (async () => {
    do {
      v.renderDeNovo = false;
      S.vistaEmRender = v;
      v.sujo = false; v.editando = false; v.el.innerHTML = '';
      esconderAvisoNovidades();
      const fn = ROTAS[v.nome] || ROTAS.inicio;
      try { await fn(v.param, v.el); }
      catch (e) { v.el.innerHTML = `<div class="alerta erro">${esc(e.message)}</div>`; }
      finally { if (S.vistaEmRender === v) S.vistaEmRender = null; }
    } while (v.renderDeNovo && VISTAS.get(chaveDe(v)) === v);
  })();
  try { await v.renderizando; } finally { v.renderizando = null; }
}
const chaveDe = v => { for (const [k, x] of VISTAS) if (x === v) return k; return null; };
function limparVistasAntigas() {
  if (VISTAS.size <= MAX_VISTAS) return;
  for (const [k, v] of VISTAS) {
    if (VISTAS.size <= MAX_VISTAS) break;
    if (v !== S.vistaAtual && !v.form) { v.el.remove(); VISTAS.delete(k); }
  }
}
function descartarVista(chave) { const v = VISTAS.get(chave); if (v) { v.el.remove(); VISTAS.delete(chave); } }

async function rotear() {
  if (!S.token) return;
  $('#lateral', document).classList.remove('aberta');
  const chave = chaveRota();
  const [nome, ...resto] = chave.split('/');
  const param = resto.length ? decodeURIComponent(resto.join('/')) : null;
  const nomeMenu = nome === 'novo' || nome === 'pedido' ? 'pedidos' : nome === 'orcamento' ? 'orcamentos' : nome;
  $$('#menu a', document).forEach(a => a.classList.toggle('ativo', a.dataset.rota === '#/' + nomeMenu));
  VISTAS.forEach(v => v.el.hidden = true);
  let v = VISTAS.get(chave);
  if (!v) {
    const el = document.createElement('div'); el.className = 'vista';
    $('#conteudo', document).appendChild(el);
    v = { el, nome, param, form: ROTAS_FORM.has(nome), sujo: true };
    // qualquer digitação dentro da tela trava a atualização automática dela
    el.addEventListener('input', e => { if (!e.target.closest('.filtros')) v.editando = true; });
    el.addEventListener('change', e => { if (e.target.matches('input,select,textarea') && !e.target.closest('.filtros')) v.editando = true; });
    VISTAS.set(chave, v);
  } else {
    // devolve para o fim da fila (mais recente)
    VISTAS.delete(chave); VISTAS.set(chave, v);
  }
  S.vistaAtual = v; v.el.hidden = false;
  if (v.topo) aplicarTopo(v.topo); else aplicarTopo({ titulo: '', acoes: '' });
  if (v.sujo && !v.form) await renderVista(v);
  else if (v.sujo && v.form && !v.el.innerHTML) await renderVista(v);
  else if (v.sujo) mostrarAvisoNovidades();
  limparVistasAntigas();
}
window.addEventListener('hashchange', rotear);
// "Atualizar": refaz a tela atual na hora
function recarregar() { const v = S.vistaAtual; if (v) renderVista(v); }

/* ---------- atualização automática (Realtime + rede de segurança) ---------- */
function marcarTelasDesatualizadas() {
  VISTAS.forEach(v => { if (!v.form) v.sujo = true; });
}
function podeAtualizarSozinha(v) {
  if (!v || v.form) return false;
  if ($('.fundo-modal', document)) return false;
  if (v.editando) return false;
  const ativo = document.activeElement;
  if (ativo && v.el.contains(ativo) && ativo.matches('input,select,textarea')) return false;
  if (v.el.querySelector('.sel-item:checked')) return false;
  return true;
}
function tentarAtualizarTelaAtual() {
  const v = S.vistaAtual; if (!v || !v.sujo) return;
  if (podeAtualizarSozinha(v)) renderVista(v);
  else if (!v.form || v.nome !== 'novo') mostrarAvisoNovidades();
}
function mostrarAvisoNovidades() {
  let a = $('#aviso-novidades', document);
  if (!a) {
    a = document.createElement('div'); a.id = 'aviso-novidades';
    a.innerHTML = `<span>Há alterações novas nesta tela.</span><button class="btn peq prim" type="button">Atualizar agora</button>`;
    a.querySelector('button').onclick = () => { esconderAvisoNovidades(); recarregar(); };
    document.body.appendChild(a);
  }
  a.hidden = false;
}
function esconderAvisoNovidades() { const a = $('#aviso-novidades', document); if (a) a.hidden = true; }

let canalRealtime = null, timerRealtime = null, timerSeguranca = null;
function iniciarAtualizacaoAutomatica() {
  if (!canalRealtime && window.supabase) {
    try {
      const cli = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const aviso = () => { clearTimeout(timerRealtime); timerRealtime = setTimeout(() => { marcarTelasDesatualizadas(); tentarAtualizarTelaAtual(); }, 800); };
      canalRealtime = cli.channel('gvh-mudancas', { config: { private: true } })
        .on('broadcast', { event: 'INSERT' }, aviso)
        .on('broadcast', { event: 'UPDATE' }, aviso)
        .on('broadcast', { event: 'DELETE' }, aviso)
        .subscribe();
    } catch (e) { console.warn('Realtime indisponível', e); }
  }
  clearInterval(timerSeguranca);
  timerSeguranca = setInterval(() => { if (document.visibilityState === 'visible') { marcarTelasDesatualizadas(); tentarAtualizarTelaAtual(); } }, INTERVALO_SEGURANCA_MS);
}

/* ---------- AR0: arquivos do pedido no Google Drive ---------- */
const TIPOS_ARQ = { arte:'Arte', prova:'Prova', producao:'Arquivo de produção', orcamento:'Orçamento aprovado', comprovante:'Comprovante de pagamento',
  nota_fiscal:'Nota fiscal', entrega:'Entrega', outro:'Outro' };
const fmtTam = b => !b ? '' : b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
async function carregarArquivosPedido(p, el) {
  const alvo = el.querySelector('#arquivos-pedido'); if (!alvo) return;

  try { r = await api('listar_arquivos', { pedido_id: p.id }, true); }
  catch (e) { alvo.innerHTML = `<div class="painel-cab"><h2>Arquivos</h2></div><p class="small" style="color:var(--vermelho);margin:0">Não foi possível carregar os arquivos: ${esc(e.message)}</p>`; return; }
  if (!alvo.isConnected) return;
  const podeTipos = Object.keys(TIPOS_ARQ).filter(t => r.pode_enviar && r.pode_enviar[t]);
  const arqs = r.arquivos || [];
  alvo.innerHTML = `<div class="painel-cab"><h2>Arquivos</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${r.pasta_url ? `<a class="btn" href="${esc(r.pasta_url)}" target="_blank" rel="noopener">Pasta no Drive</a>` : ''}
        ${podeTipos.length ? `<button class="btn" data-enviar-arq>Enviar arquivo</button>` : ''}</div></div>
    ${arqs.length ? `<div class="tabela-wrap"><table><thead><tr><th>Tipo</th><th>Arquivo</th><th>Item</th><th>Enviado por</th><th></th></tr></thead><tbody>
      ${arqs.map(a => `<tr><td>${esc(TIPOS_ARQ[a.tipo] || a.tipo)}</td>
        <td><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.nome)}</a><div class="small muted">${fmtTam(a.tamanho)}</div></td>
        <td class="small">${a.item_descricao ? esc(a.item_descricao) : '<span class="muted">Pedido</span>'}</td>
        <td class="small">${esc(a.criado_por_nome || '')}<div class="muted">${dataHora(a.created_at)}</div></td>
        <td class="dir">${r.pode_enviar && r.pode_enviar[a.tipo] ? `<button class="btn peq" data-excluir-arq="${a.id}">Excluir</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>`
      : `<p class="small muted" style="margin:0">Nenhum arquivo ainda. A pasta do pedido no Drive é criada sozinha quando o primeiro arquivo for enviado.</p>`}`;
  const b = alvo.querySelector('[data-enviar-arq]');
  if (b) b.onclick = () => modalEnviarArquivo(p, podeTipos);
  alvo.querySelectorAll('[data-excluir-arq]').forEach(bt => bt.onclick = () => modalExcluirArquivo(arqs.find(a => a.id === bt.dataset.excluirArq)));
}
function modalExcluirArquivo(a) {
  const fin = ['orcamento', 'comprovante', 'nota_fiscal'].includes(a.tipo);
  const m = abrirModal({ titulo: 'Excluir arquivo', corpo: `
    <p style="margin:0 0 10px"><b>${esc(a.nome)}</b> (${esc(TIPOS_ARQ[a.tipo] || a.tipo)})</p>
    <p class="small muted" style="margin:0 0 12px">${fin
      ? 'O arquivo sai da pasta do pedido e fica guardado na pasta 99_PEDIDOS EXCLUÍDOS do Drive (orçamentos, comprovantes e notas fiscais nunca são apagados).'
      : 'O arquivo vai para a lixeira do Drive compartilhado e pode ser recuperado por lá durante 30 dias.'} A exclusão fica registrada no histórico do pedido.</p>
    <label class="campo">Motivo<input type="text" id="motivo-arq" placeholder="Ex.: arquivo errado, versão antiga"></label>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn perigo" data-c>Excluir arquivo</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-c]').onclick = async () => {
    const r = await api('arquivo_excluir', { id: a.id, motivo: m.el.querySelector('#motivo-arq').value.trim() || null });
    m.fechar();
    if (r.drive_ok === false) toast('Arquivo retirado do sistema, mas o Drive não respondeu. Confira a pasta do pedido.', true);
    else toast('Arquivo excluído.');
    recarregar();
  };
}
function modalEnviarArquivo(p, podeTipos) {
  const itens = (p.itens || []).filter(i => i.status !== 'cancelado');
  const m = abrirModal({ titulo: 'Enviar arquivo ao Drive', corpo: `
    <form id="f-arq" class="grade">
      <label class="campo">Tipo *<select name="tipo" required>${podeTipos.map(t => `<option value="${t}">${esc(TIPOS_ARQ[t])}</option>`).join('')}</select></label>
      <label class="campo">Item<select name="item_id"><option value="">Pedido inteiro</option>${itens.map(i => `<option value="${i.id}">${esc(i.descricao)}</option>`).join('')}</select></label>
      <label class="campo" style="grid-column:1/-1">Arquivos *<input type="file" name="arquivos" multiple required></label>
      <div id="arq-prog" class="small muted" style="grid-column:1/-1"></div>
    </form>`,
    rodape: `<button class="btn" data-v>Cancelar</button><button class="btn prim" data-c>Enviar</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  const bt = m.el.querySelector('[data-c]');
  bt.onclick = async () => {
    const f = m.el.querySelector('#f-arq'); const arqs = [...f.elements.arquivos.files];
    if (!arqs.length) return toast('Escolha pelo menos um arquivo.', true);
    bt.disabled = true; const prog = m.el.querySelector('#arq-prog'); let ok = 0;
    for (const [n, arq] of arqs.entries()) {
      try {
        await enviarArquivoDrive(p.id, arq, f.elements.tipo.value, f.elements.item_id.value, frac =>
          prog.textContent = `Enviando ${n + 1} de ${arqs.length}: ${arq.name} — ${Math.round(frac * 100)}%`);
        ok++;
      } catch (e) { toast(`${arq.name}: ${e.message}`, true); }
    }
    bt.disabled = false;
    if (ok) { toast(ok > 1 ? `${ok} arquivos enviados ao Drive.` : 'Arquivo enviado ao Drive.'); m.fechar(); recarregar(); }
  };
}
async function enviarArquivoDrive(pedidoId, arquivo, tipo, itemId, aoProgresso) {
  const mime = arquivo.type || 'application/octet-stream';
  const r = await api('arquivo_enviar', { pedido_id: pedidoId, item_id: itemId || null, tipo, nome_arquivo: arquivo.name, mime, tamanho: arquivo.size }, true);
  if (!r.upload_url) throw new Error('O Drive não devolveu o endereço de envio.');
  const resp = await new Promise((ok, falha) => {
    const x = new XMLHttpRequest();
    x.open('PUT', r.upload_url);
    x.setRequestHeader('Content-Type', mime);
    x.upload.onprogress = e => { if (e.lengthComputable && aoProgresso) aoProgresso(e.loaded / e.total); };
    x.onload = () => { if (x.status >= 200 && x.status < 300) { try { ok(JSON.parse(x.responseText || '{}')); } catch { falha(new Error('Resposta inválida do Drive.')); } }
                       else falha(new Error(`O Drive recusou o envio (${x.status}).`)); };
    x.onerror = () => falha(new Error('Falha de conexão ao enviar para o Drive.'));
    x.send(arquivo);
  });
  if (!resp.id) throw new Error('O Drive não confirmou o arquivo.');
  await api('arquivo_confirmar', { id: r.arquivo_id, drive_file_id: resp.id }, true);
}

function descHistorico(h) {

  if (h.tipo === 'status_pedido') return `Pedido passou para <b>${esc(nomeStatusPed(h.para))}</b>`;
  return esc(h.descricao);
}

async function moverSelecionados() {
  const itens = $$('.sel-item:checked').map(c => c.value);
  if (!itens.length) return toast('Selecione os itens que deseja mover.', true);
  const status = $('#novo-status').value;
  if (!status) return toast('Escolha para qual status mover.', true);
  if (status === 'cancelado' && !await confirmar(`Cancelar ${itens.length > 1 ? 'os itens selecionados' : 'o item selecionado'}?`, 'Cancelar itens', true)) return;
  await api('mudar_status_itens', { itens, status });
  toast('Itens atualizados.'); recarregar();
}

async function cancelarPedido(excluir = false) {
  const p = S.vistaAtual.dados;
  const r = await api('previa_cancelamento', { id: p.id, excluir });
  const avisos = r.avisos || [];
  const acao = excluir ? 'Excluir' : 'Cancelar';
  const m = abrirModal({ titulo: `${acao} pedido ${p.numero}`, corpo: `
    ${excluir
      ? '<p style="margin:0 0 12px">O pedido sai de todas as listas e não pode mais ser reativado. O histórico, os pagamentos e as comissões continuam registrados.</p>'
      : '<p style="margin:0 0 12px">Todos os itens param na hora: saem da arte, da pré-impressão, da produção e da expedição. Parcelas em aberto são canceladas. Se reativar depois, cada item volta para onde estava.</p>'}
    ${avisos.length ? `<div style="margin-bottom:12px"><b>Confirme cada ponto antes de continuar:</b>
      ${avisos.map(a => `<label class="check" style="align-items:flex-start;margin-top:10px;padding:10px 12px;border:1px solid var(--vermelho);border-radius:8px;background:var(--vermelho-bg)">
        <input type="checkbox" data-conf="${esc(a.codigo)}" style="margin-top:3px">
        <span><b>${esc(a.titulo)}</b><br><span class="small">${esc(a.texto)}</span></span></label>`).join('')}</div>`
      : '<p class="small muted" style="margin:0 0 12px">Nenhum pagamento, produção ou repasse de comissão ligado a este pedido.</p>'}
    <label class="campo">Motivo ${excluir ? 'da exclusão' : 'do cancelamento'} *<textarea id="motivo" required></textarea></label>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn perigo" data-c>${acao} pedido</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-c]').onclick = async () => {
    const motivo = $('#motivo', m.el).value.trim();
    const confirmados = [...m.el.querySelectorAll('[data-conf]:checked')].map(c => c.dataset.conf);
    if (confirmados.length < avisos.length) return toast('Marque todos os avisos para confirmar.', true);
    if (!motivo) return toast(`Informe o motivo ${excluir ? 'da exclusão' : 'do cancelamento'}.`, true);
    await api(excluir ? 'excluir_pedido' : 'cancelar_pedido', { id: p.id, motivo, confirmados });
    m.fechar();
    if (excluir) { toast('Pedido excluído.'); descartarVista(chaveRota()); location.hash = '#/pedidos'; }
    else { toast('Pedido cancelado. Os itens foram parados.'); recarregar(); }
  };
}
async function reativarPedido() {
  if (!await confirmar('Reativar este pedido? Cada item volta para a etapa em que estava quando o pedido foi cancelado, e as parcelas canceladas junto com ele voltam a ficar em aberto.', 'Reativar')) return;
  await api('cancelar_pedido', { id: S.vistaAtual.dados.id, reativar: true }); toast('Pedido reativado.'); recarregar();
}

/* ---------- CATEGORIAS (sugestão pelo que o vendedor escreve) ---------- */
const normTxt = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const catsAtivas = () => (S.base.categorias || []).filter(c => c.ativo);
function sugerirCategorias(texto, max = 3) {
  const t = normTxt(texto); if (t.length < 3) return [];
  const tt = ' ' + t + ' ';
  const res = [];
  for (const c of catsAtivas()) {
    let melhor = 0;
    for (const a0 of [c.nome, ...(c.apelidos || [])]) {
      const a = normTxt(a0); if (!a) continue;
      let sc = 0;
      if (a === t) sc = 1000;
      else if (tt.includes(' ' + a + ' ')) sc = 100 + a.length;   // o apelido aparece no texto ("folder 3 dobras")
      else if (a.startsWith(t)) sc = 20 + t.length;             // o texto é o começo do apelido ("panf")
      if (sc > melhor) melhor = sc;
    }
    if (melhor) res.push({ c, sc: melhor });
  }
  return res.sort((x, y) => y.sc - x.sc).slice(0, max).map(x => x.c);
}
const opcoesCategoria = (sel, podeNova) => `<option value="">Selecione a categoria</option>` +
  (S.base.categorias || []).filter(c => c.ativo || c.id === sel).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}${c.servico && !/servi[cç]o/i.test(c.nome) ? ' (serviço)' : ''}</option>`).join('') +
  (podeNova ? '<option value="__nova">+ Cadastrar nova categoria</option>' : '');
const podeNovaCategoria = () => pode('cadastra_produtos') || pode('gerencia_cadastros');

const infoAcabamento = i => !i.precisa_acabamento ? '' : `<div class="small" style="margin-top:4px">${badge(i.acabamento_iniciado_em ? 'Em acabamento' : 'Precisa de acabamento', i.acabamento_iniciado_em ? 'b-ambar' : 'b-azul')} ${esc(i.acabamento_por || '')}</div>`;
const camposAcabamento = i => `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="precisa_acabamento" data-acab ${i.precisa_acabamento ? 'checked' : ''}> Precisa de acabamento depois que chegar do fornecedor?</label>
  <label class="campo ${i.precisa_acabamento ? '' : 'hidden'}" style="grid-column:1/-1" data-acab-box>Quem vai fazer o acabamento *<input type="text" name="acabamento_por" value="${esc(i.acabamento_por || '')}" placeholder="Ex.: Interno — dobrar e grampear"></label>`;
function ligarAcabamento(form) {
  const ck = form.querySelector('[data-acab]'); if (!ck) return;
  ck.onchange = () => form.querySelector('[data-acab-box]').classList.toggle('hidden', !ck.checked);
}
function lerAcabamento(form, d) {
  const ck = form.querySelector('[data-acab]'); if (!ck) return true;
  d.precisa_acabamento = ck.checked;
  if (!ck.checked) delete d.acabamento_por;
  else if (!String(d.acabamento_por || '').trim()) { toast('Informe quem vai fazer o acabamento.', true); return false; }
  return true;
}

function opcoesStatusInicial(sel = 'arte_a_fazer') {
  const lista = ['arte_a_fazer', ...(S.perm.status_item_permitidos || []).filter(s => ['arte_a_fazer','arte_em_aprovacao','pre_impressao'].includes(s))];
  return [...new Set(lista)].map(s => `<option value="${s}" ${s === sel ? 'selected' : ''}>${esc(nomeStatusItem(s))}</option>`).join('');
}

const unitario = (total, qtd) => Number(qtd) > 0 ? (Number(total || 0) / Number(qtd)).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 4 }) : '—';
async function sugerirTotal(produtoId, qtd) {
  if (!produtoId || !(Number(qtd) > 0)) return null;
  const r = await api('calcular_preco', { produto_id: produtoId, quantidade: qtd }, true).catch(() => null);
  return r && r.total != null ? Number(r.total) : null;
}

/* arte no Storage */
async function enviarArte(itemId, arquivo) {
  const r = await api('arte_arquivo', { item_id: itemId, op: 'upload', nome_arquivo: arquivo.name });
  const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', arquivo);
  const up = await fetch(r.url, { method: 'PUT', body: fd, headers: { 'x-upsert': 'true' } });
  if (!up.ok) { toast('Falha ao enviar o arquivo de arte.', true); throw new Error('upload'); }
  await api('salvar_item', { id: itemId, arte_storage_path: r.path });
  toast('Arquivo de arte enviado.');
}
async function baixarArte(itemId) {
  const r = await api('arte_arquivo', { item_id: itemId, op: 'download' });
  window.open(r.url, '_blank', 'noopener');
}

/* ---------- PARCELAS ---------- */
const TIPOS_PARC = { sinal:'Sinal', restante:'Restante', boleto:'Boleto', a_vista:'À vista', parcela:'Parcela' };
const FORMAS = { pix:'Pix', dinheiro:'Dinheiro', cartao_credito:'Cartão de crédito', cartao_debito:'Cartão de débito', boleto:'Boleto', transferencia:'Transferência', outro:'Outro' };
const opcoesForma = (sel = '') => `<option value="">—</option>` + Object.entries(FORMAS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
function badgeParcela(r) {
  if (r.situacao === 'pago') return r.conferencia === 'pendente'
    ? badge('Pago em ' + data(r.pago_em) + ' · a conferir', 'b-ambar')
    : badge('Pago em ' + data(r.pago_em), 'b-verde');
  if (r.situacao === 'cancelado') return badge('Cancelada', 'b-cinza');
  if (r.atrasado) return badge('Atrasada', 'b-vermelho');
  if (r.dias_para_vencer === 0) return badge('Vence hoje', 'b-ambar');
  return badge('Em aberto', 'b-cinza');
}
function detalheParcela(r) {
  if (r.situacao === 'pago' && r.baixado_por_nome) return `<div class="small muted">Marcado por ${esc(r.baixado_por_nome)}${r.conferencia === 'conferido' && r.conferido_por_nome ? ` · conferido por ${esc(r.conferido_por_nome)}` : ''}</div>`;
  if (r.situacao === 'aberto' && r.conferencia === 'devolvido') return `<div class="small" style="color:var(--vermelho)">Devolvido pelo financeiro: ${esc(r.motivo_devolucao || '')}</div>`;
  return '';
}
function tabelaParcelas(lista, comPedido) {
  lista.forEach(r => S.parcelas[r.id] = r);
  if (!lista.length) return `<div class="vazio">Nenhum pagamento lançado.</div>`;
  const fin = pode('edita_financeiro');
  const vend = !fin && pode('cria_pedidos') && !comPedido;   // vendedor, na tela do pedido
  const acoes = fin || vend;
  const conferir = fin && (comPedido || S.usuario.perfil === 'financeiro');
  return `<div class="tabela-wrap"><table>
    <thead><tr>${comPedido ? '<th>Pedido</th><th>Cliente</th>' : ''}<th>Parcela</th><th>Vencimento</th><th class="dir">Valor</th><th>Forma</th><th>Situação</th>${acoes ? '<th></th>' : ''}</tr></thead>
    <tbody>${lista.map(r => `<tr>
      ${comPedido ? `<td><a href="#/pedido/${r.pedido_id}"><b>${esc(r.pedido_numero)}</b></a></td><td>${esc(r.cliente_nome)}</td>` : ''}
      <td>${esc(TIPOS_PARC[r.tipo] || r.tipo)}${r.parcela_num ? ` ${r.parcela_num}${r.parcelas_total ? '/' + r.parcelas_total : ''}` : ''}${r.observacao ? `<div class="small muted">${esc(r.observacao)}</div>` : ''}</td>
      <td class="num">${data(r.vencimento)}</td>
      <td class="dir num">${brl(r.valor)}</td>
      <td>${esc(FORMAS[r.forma_pagamento] || '—')}${urlSegura(r.link_pagamento) ? `<div><a class="small" href="${esc(urlSegura(r.link_pagamento))}" target="_blank" rel="noopener">Link de pagamento</a></div>` : ''}
        ${r.tem_comprovante ? `<div><button class="btn link peq" onclick="verComprovante('${r.id}')">Ver comprovante</button></div>` : ''}</td>
      <td>${badgeParcela(r)}${detalheParcela(r)}</td>
      ${acoes ? `<td class="dir" style="white-space:nowrap">
        ${r.situacao === 'aberto' ? `<button class="btn prim peq" onclick="modalBaixa('${r.id}', ${conferir})">${fin ? 'Dar baixa' : 'Marcar como pago'}</button>
             ${fin ? `<button class="btn link peq" onclick="excluirParcela('${r.id}')">Excluir</button>` : ''}` : ''}

function ligarGerador(el, onChange) {
  let parcelas = [];
  const g = k => el.querySelector(`[data-g="${k}"]`).value;
  const desenhar = () => {
    const alvo = el.querySelector('#preview-parcelas');
    alvo.innerHTML = parcelas.length ? `<table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="dir">Valor</th><th>Forma</th><th></th></tr></thead><tbody>
      ${parcelas.map((p, k) => `<tr><td>${esc(TIPOS_PARC[p.tipo])}${p.parcela_num ? ' ' + p.parcela_num + '/' + p.parcelas_total : ''}</td>
        <td><input type="date" value="${p.vencimento}" data-k="${k}" data-c="vencimento"></td>
        <td class="dir"><input type="number" step="0.01" value="${p.valor}" data-k="${k}" data-c="valor" style="max-width:130px;text-align:right"></td>
        <td>${esc(FORMAS[p.forma_pagamento] || '—')}</td>
        <td><button type="button" class="btn link peq" data-rm="${k}">Remover</button></td></tr>`).join('')}</tbody></table>
      <p class="small muted">Soma: <b>${brl(parcelas.reduce((s, p) => s + Number(p.valor), 0))}</b></p>` : '<p class="small muted">Nenhuma parcela gerada. Preencha acima e clique em "Gerar parcelas".</p>';
    alvo.querySelectorAll('[data-c]').forEach(inp => inp.onchange = () => { parcelas[inp.dataset.k][inp.dataset.c] = inp.value; desenhar(); });
    alvo.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { parcelas.splice(b.dataset.rm, 1); desenhar(); });
    onChange && onChange(parcelas);
  };
  el.querySelector('[data-g-gerar]').onclick = () => {
    parcelas = [];
    const sinal = Number(g('sinal') || 0), total = Number(g('total') || 0), qtd = Math.max(1, Number(g('qtd') || 1)), modo = g('modo');
    if (sinal > 0) parcelas.push({ tipo: 'sinal', valor: sinal.toFixed(2), vencimento: g('venc_sinal'), forma_pagamento: 'pix' });
    const resto = Math.round((total - sinal) * 100);
    if (resto > 0) {
      const n = modo === 'restante' ? 1 : qtd; const base = Math.floor(resto / n);
      for (let k = 0; k < n; k++) {
        const cent = k === n - 1 ? resto - base * (n - 1) : base;
        parcelas.push({ tipo: modo === 'restante' ? 'restante' : modo, parcela_num: n > 1 ? k + 1 : null, parcelas_total: n > 1 ? n : null,
          valor: (cent / 100).toFixed(2), vencimento: somaMeses(g('venc1'), k), forma_pagamento: g('forma') || null });
      }
    }
    desenhar();
  };
  desenhar();
  return () => parcelas;
}
/* ---------- FORMA DE PAGAMENTO (V4) — novo pedido, conversão de orçamento, troca de forma e lançamento ---------- */
const FORMAS_COMB = { pix:'Pix', transferencia:'Transferência', cartao_credito:'Cartão de crédito', boleto:'Boleto', retirada:'Paga na retirada', sinal_restante:'Sinal + restante', outros:'Outros' };
const FORMAS_LIBERAM = ['boleto', 'retirada'];   // liberam a pré-impressão sem pagamento (V11)
const EXT_COMP = '.pdf,.png,.jpg,.jpeg,.webp,.heic,.heif';
const urlSegura = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
async function enviarComprovante(arquivo, recebimentoId) {
  if (arquivo.size > 10 * 1024 * 1024) { toast('O comprovante passa de 10 MB.', true); throw new Error('tamanho'); }
  const r = await api('comprovante_arquivo', { op: 'upload', id: recebimentoId || '', nome_arquivo: arquivo.name });
  const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', arquivo);
  const up = await fetch(r.url, { method: 'PUT', body: fd, headers: { 'x-upsert': 'true' } });
  if (!up.ok) { toast('Falha ao enviar o comprovante.', true); throw new Error('upload'); }
  return r.path;
}

function htmlFormaPagamento(op = {}) {

/* Componente que evolui conforme os cliques. Devolve coletar() assíncrono → { forma_pagamento, forma_pagamento_obs, recebimentos, resumo, autoriza_sem_pagamento }.
   coletar.atualizar() recalcula boletos e sugestão do sinal quando o total ou a previsão mudam. */
function ligarFormaPagamento(el, total, prev, inicial) {
  const raiz = el.matches('[data-fp-raiz]') ? el : el.querySelector('[data-fp-raiz]');
  const podeAutorizar = raiz.hasAttribute('data-fp-autorizar');
  const orc = raiz.hasAttribute('data-fp-orc');   // orçamento: só o combinado, sem "já pagou", comprovante ou link
  const corpo = raiz.querySelector('[data-fp-corpo]');
  const st = { forma: '', pago: null, comp: null, link: '', qtd: 1, outraQtd: false, parcelas: [], parcManual: false,
               sinal: '', sinalManual: false, sinalPago: null, formaSinal: 'pix', compSinal: null, restante: 'pix', linkRest: '', obs: '', autoriza: null };
  const enviados = new Map();
  const t2 = () => Math.round(total() * 100) / 100;
  const brlTxt = v => brl(v).replace(/\s/g, ' ');
  const chips = (grupo, opcoes, valor) => `<div class="chips" data-g="${grupo}">${opcoes.map(([v, r]) => `<button type="button" class="chip ${String(valor) === String(v) ? 'ativo' : ''}" data-v="${v}">${r}</button>`).join('')}</div>`;
  const pergunta = (txt, html) => `<div style="margin-top:12px"><div class="small" style="margin-bottom:6px">${txt}</div>${html}</div>`;
  const campo = (rot, k, tipo = 'text', extra = '') => `<label class="campo" style="margin-top:12px;max-width:420px">${rot}<input type="${tipo}" data-k="${k}" value="${esc(st[k])}" ${extra}></label>`;
  const arquivo = (k, rot) => `<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button type="button" class="btn peq" data-arq="${k}">${st[k] ? 'Trocar arquivo' : rot}</button>
    ${st[k] ? `<span class="small">${esc(st[k].name)} ✓</span>` : '<span class="small muted">PDF ou imagem</span>'}</div>`;
  const simNao = (k, txt) => pergunta(txt, chips(k, [['true', 'Sim'], ['false', 'Ainda não']], st[k]));
  const gerarParc = () => {
    const qtd = Math.min(24, Math.max(1, Number(st.qtd) || 1)), v1 = prev() || somaDias(hoje(), 30);
    const cents = Math.round(t2() * 100), base = Math.floor(cents / qtd);
    st.parcelas = Array.from({ length: qtd }, (_, k) => ({ tipo: 'boleto', forma_pagamento: 'boleto',
      parcela_num: qtd > 1 ? k + 1 : null, parcelas_total: qtd > 1 ? qtd : null, vencimento: somaDias(v1, 30 * k),
      valor: ((k === qtd - 1 ? cents - base * (qtd - 1) : base) / 100).toFixed(2) }));
    st.parcManual = false;
  };
  const sugerirSinal = () => { if (!st.sinalManual) { const s = Math.round(t2() * 50) / 100; st.sinal = s > 0 ? s.toFixed(2) : ''; } };
  const nadaPago = () => (st.forma === 'sinal_restante' ? st.sinalPago === false : st.pago === false);
  const mostraAut = () => !orc && podeAutorizar && st.forma && !FORMAS_LIBERAM.includes(st.forma) && nadaPago();
  const resumo = () => {
    const f = st.forma, pg = st.pago === true ? ' (pago)' : '';
    if (f === 'pix' || f === 'transferencia' || f === 'cartao_credito') return FORMAS_COMB[f] + pg;
    if (f === 'boleto') return st.parcelas.length > 1 ? `Boleto em ${st.parcelas.length}x` : 'Boleto';
    if (f === 'retirada') return 'Paga na retirada';
    if (f === 'sinal_restante') return `Sinal de ${brlTxt(Number(st.sinal || 0))}${st.sinalPago === true ? ' (pago)' : ''} + restante na entrega (${FORMAS_COMB[st.restante]})`;
    if (f === 'outros') return 'Outros' + (st.obs ? ': ' + st.obs : '') + pg;
    return '';
  };
  const render = () => {
    raiz.querySelectorAll('[data-fp="forma"] .chip').forEach(b => b.classList.toggle('ativo', b.dataset.v === st.forma));
    const f = st.forma; let h = '';
    if (orc && f === 'boleto') {
      h += pergunta('Quantos boletos?', chips('qtd', [1, 2, 3, 4, 5, 6].map(n => [n, n + 'x']).concat([['outro', 'Outro']]), st.outraQtd ? 'outro' : st.qtd));
      if (st.outraQtd) h += campo('Quantidade de boletos', 'qtd', 'number', 'min="1" max="24" style="max-width:120px"');
    } else if (orc && f === 'sinal_restante') {
      h += campo(`Valor do sinal (R$) <span class="muted small">— sugestão: 50%</span>`, 'sinal', 'number', 'step="0.01" min="0.01" style="max-width:160px"');
      h += pergunta('Restante, depois da entrega, em', chips('restante', [['pix', 'Pix'], ['cartao_credito', 'Cartão de crédito']], st.restante));
    } else if (orc && f === 'outros') {
      h += campo('Como será o pagamento? *', 'obs', 'text', 'placeholder="Ex.: permuta, crédito do cliente, a combinar"');
    } else if (orc) {
      // pix, transferência, cartão e retirada: no orçamento basta a forma
    } else if (f === 'pix' || f === 'transferencia') {
      h += simNao('pago', 'O cliente já pagou?');
      if (st.pago === true) h += arquivo('comp', 'Anexar comprovante');
    } else if (f === 'cartao_credito') {
      h += campo('Link de pagamento (Cielo) <span class="muted small">— opcional</span>', 'link', 'url', 'placeholder="https://"');
      h += simNao('pago', 'O cliente já pagou?');
    } else if (f === 'boleto') {
      h += pergunta('Quantos boletos?', chips('qtd', [1, 2, 3, 4, 5, 6].map(n => [n, n + 'x']).concat([['outro', 'Outro']]), st.outraQtd ? 'outro' : st.qtd));
      if (st.outraQtd) h += campo('Quantidade de boletos', 'qtd', 'number', 'min="1" max="24" style="max-width:120px"');
      h += `<div style="margin-top:10px">${st.parcelas.map((p, k) => `<div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <span class="small muted" style="min-width:42px">${p.parcela_num ? p.parcela_num + '/' + p.parcelas_total : 'Único'}</span>
          <input type="date" value="${p.vencimento}" data-pk="${k}" data-pc="vencimento" style="max-width:170px">
          <input type="number" step="0.01" value="${p.valor}" data-pk="${k}" data-pc="valor" style="max-width:130px;text-align:right"></div>`).join('')}</div>`;
    } else if (f === 'sinal_restante') {
      h += campo(`Valor do sinal (R$) <span class="muted small">— sugestão: 50%</span>`, 'sinal', 'number', 'step="0.01" min="0.01" style="max-width:160px"');
      h += simNao('sinalPago', 'O sinal já foi pago?');
      if (st.sinalPago === true) {
        h += pergunta('Pago em', chips('formaSinal', [['pix', 'Pix'], ['transferencia', 'Transferência']], st.formaSinal));
        h += arquivo('compSinal', 'Anexar comprovante do sinal');
      }
      h += pergunta('Restante, depois da entrega, em', chips('restante', [['pix', 'Pix'], ['cartao_credito', 'Cartão de crédito']], st.restante));
      if (st.restante === 'cartao_credito') h += campo('Link do restante (Cielo) <span class="muted small">— opcional</span>', 'linkRest', 'url', 'placeholder="https://"');
    } else if (f === 'outros') {
      h += campo('Como será o pagamento? *', 'obs', 'text', 'placeholder="Ex.: permuta, crédito do cliente, a combinar"');
      h += simNao('pago', 'Já foi pago?');
    }
    if (mostraAut()) h += pergunta('Pode ir para a produção antes do pagamento?', chips('autoriza', [['true', 'Sim, autorizo'], ['false', 'Não']], st.autoriza ?? 'false'));
    if (f) h += `<div class="small muted" style="margin-top:14px;padding-top:10px;border-top:1px solid var(--borda, #e5e5e5)" data-fp-resumo>Resumo: <b>${esc(resumo())}</b></div>`;
    corpo.innerHTML = h;

  const atualizarResumo = () => { const r = corpo.querySelector('[data-fp-resumo] b'); if (r) r.textContent = resumo(); };
  const ligar = () => {
    corpo.querySelectorAll('[data-g]').forEach(g => g.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const k = g.dataset.g, v = b.dataset.v;
      if (k === 'qtd') { if (v === 'outro') { st.outraQtd = true; } else { st.outraQtd = false; st.qtd = Number(v); gerarParc(); } }
      else st[k] = v === 'true' ? true : v === 'false' ? false : v;
      render();
    }));

      st[i.dataset.k] = i.value;
      if (i.dataset.k === 'sinal') st.sinalManual = true;
      if (i.dataset.k === 'qtd') { gerarParc(); render(); const n = corpo.querySelector('[data-k=qtd]'); n.focus(); return; }
      atualizarResumo();
    });
    corpo.querySelectorAll('[data-pc]').forEach(i => i.onchange = () => { st.parcelas[i.dataset.pk][i.dataset.pc] = i.value; st.parcManual = true; });
    corpo.querySelectorAll('[data-arq]').forEach(b => b.onclick = () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = EXT_COMP;
      inp.onchange = () => { if (inp.files[0]) { st[b.dataset.arq] = inp.files[0]; render(); } };
      inp.click();

  };
  raiz.querySelectorAll('[data-fp="forma"] .chip').forEach(b => b.onclick = () => {
    st.forma = b.dataset.v; st.pago = null;
    if (st.forma === 'boleto' && !st.parcelas.length) gerarParc();
    if (st.forma === 'sinal_restante') sugerirSinal();
    render();
  });
  const subir = async a => { if (!enviados.has(a)) enviados.set(a, await enviarComprovante(a)); return enviados.get(a); };
  const coletarOrc = () => {
    const f = st.forma; if (!f) return null;
    let obs = null;
    if (f === 'sinal_restante') {
      const sinal = Math.round(Number(st.sinal || 0) * 100) / 100;
      if (!(sinal > 0)) throw new Error('Informe o valor do sinal.');
      if (t2() > 0 && sinal >= t2()) throw new Error('O sinal precisa ser menor que o total.');
    }
    if (f === 'outros') { obs = st.obs.trim(); if (!obs) throw new Error('Descreva como será o pagamento em "Outros".'); }
    return { forma_pagamento: f, forma_pagamento_obs: obs, resumo: resumo(),
             pagamento_detalhe: f === 'boleto' ? { qtd: Number(st.qtd) || 1 } : f === 'sinal_restante' ? { sinal: Number(st.sinal), restante: st.restante } : null };
  };

    } else if (f === 'cartao_credito') {

      if (st.parcelas.some(x => !x.vencimento)) throw new Error('Informe o vencimento de cada boleto.');
      rec = st.parcelas.map(x => ({ ...x }));
    } else if (f === 'retirada') {
      rec = [{ tipo: 'restante', valor: t.toFixed(2), vencimento: p || hoje(), forma_pagamento: null }];
    } else if (f === 'sinal_restante') {
      const sinal = Math.round(Number(st.sinal || 0) * 100) / 100;
      if (!(sinal > 0)) throw new Error('Informe o valor do sinal.');
      if (sinal >= t) throw new Error('O sinal precisa ser menor que o total. Se o cliente pagou tudo, escolha Pix ou Transferência.');
      if (st.sinalPago === null) throw new Error('Informe se o sinal já foi pago.');
      if (st.sinalPago && !st.compSinal) throw new Error('Anexe o comprovante do sinal ou marque "Ainda não".');
      const linkR = st.restante === 'cartao_credito' ? st.linkRest.trim() : '';
      if (linkR && !urlSegura(linkR)) throw new Error('O link de pagamento precisa começar com https://');
      rec = [{ tipo: 'sinal', valor: sinal.toFixed(2), vencimento: hoje(), forma_pagamento: st.formaSinal, _arq: st.sinalPago ? st.compSinal : null },

    } else {
      obs = st.obs.trim();
      if (!obs) throw new Error('Descreva como será o pagamento em "Outros".');
      if (st.pago === null) throw new Error('Informe se já foi pago.');
      rec = [{ tipo: 'a_vista', valor: t.toFixed(2), vencimento: hoje(), forma_pagamento: 'outro', observacao: obs, pago: st.pago }];
    }
    for (const r of rec) { if (r._arq) r.comprovante_path = await subir(r._arq); delete r._arq; }
    return { forma_pagamento: f, forma_pagamento_obs: obs, recebimentos: rec, resumo: resumo(),
             autoriza_sem_pagamento: !!(mostraAut() && st.autoriza === true) };
  };
  coletar.atualizar = () => {
    if (st.forma === 'boleto' && !st.parcManual) gerarParc();
    if (st.forma === 'sinal_restante') sugerirSinal();
    if (st.forma) render();
  };
  // estado inicial (orçamento salvo ou orçamento sendo transformado em pedido)
  if (inicial && inicial.forma) {
    const det = inicial.detalhe || {};
    st.forma = inicial.forma; st.obs = inicial.obs || '';
    if (det.qtd) { st.qtd = Number(det.qtd); st.outraQtd = ![1, 2, 3, 4, 5, 6].includes(st.qtd); }
    if (det.sinal) { st.sinal = Number(det.sinal).toFixed(2); st.sinalManual = true; }
    if (det.restante) st.restante = det.restante;
    if (st.forma === 'boleto') gerarParc();
    if (st.forma === 'sinal_restante') sugerirSinal();
    render();
  }
  return coletar;
}

function ligarBuscaCliente(input, aoEscolher) {
  const box = input.parentElement; let t;
  const res = document.createElement('div'); res.className = 'busca-res hidden'; box.appendChild(res);
  input.addEventListener('input', () => {
    clearTimeout(t); const q = input.value.trim();
    if (q.length < 2) { res.classList.add('hidden'); return; }
    t = setTimeout(async () => {
      const r = await api('buscar_clientes', { busca: q, limite: 12 }, true).catch(() => ({ clientes: [] }));
      res.innerHTML = r.clientes.map(c => `<div data-id="${c.id}"><b>${esc(c.nome_fantasia || c.nome)}</b><div class="small muted">${esc(c.nome_fantasia ? c.nome : '')} ${esc(fmtDoc(c.cpf_cnpj))} ${esc(fmtTel(c.whatsapp || c.telefone))}</div></div>`).join('')
        + (pode('cadastra_clientes') ? `<div data-novo><b style="color:var(--verde)">Cadastrar novo cliente</b></div>` : '');
      res.classList.remove('hidden');
      res.querySelectorAll('[data-id]').forEach(d => d.onclick = () => { const c = r.clientes.find(x => x.id === d.dataset.id); res.classList.add('hidden'); aoEscolher(c); });
      const nv = res.querySelector('[data-novo]'); if (nv) nv.onclick = () => { res.classList.add('hidden'); modalCliente(null, c => aoEscolher(c), q); };
    }, 300);
  });
  document.addEventListener('click', e => { if (!box.contains(e.target)) res.classList.add('hidden'); });
}

      const box = $(`[data-sug="${k}"]`, alvo); if (!box) return;
      box.innerHTML = l.length > 1 ? 'Também: ' + l.slice(1).map(c => `<a href="#" data-k2="${k}" data-cat="${c.id}">${esc(c.nome)}</a>`).join(' · ') : '';
      $$(`[data-k2="${k}"]`, box).forEach(a => a.onclick = e => { e.preventDefault(); it.categoria_id = a.dataset.cat; it._catManual = true;
        const sel = $(`[data-k="${k}"][data-f=categoria_id]`, alvo); if (sel) sel.value = it.categoria_id; });
    };
    $$('[data-f]', alvo).forEach(el => el.onchange = el.oninput = e => {
      const k = Number(el.dataset.k); const it = itens[k]; const f = el.dataset.f;
      if (f === 'categoria_id') {
        if (e.type === 'input') return;
        if (el.value === '__nova') { el.value = it.categoria_id || ''; modalCategoria(null, id => { it.categoria_id = id; it._catManual = true; desenhar(); }); return; }
        it.categoria_id = el.value; it._catManual = true; aoMudar && aoMudar(itens); return;
      }
      it[f] = el.value;
      if (f === 'descricao') {
        const sg = sugestaoPorTexto(el.value);
        if (sg) {
          // escolheu um produto sugerido: categoria vem junto; com "…", seleciona para o vendedor digitar a medida
          it.categoria_id = sg.categoria_id; it._catManual = true;
          const sel = $(`[data-k="${k}"][data-f=categoria_id]`, alvo); if (sel) sel.value = sg.categoria_id;
          const box = $(`[data-sug="${k}"]`, alvo); if (box) box.innerHTML = '';
          const i = el.value.indexOf('…'); if (i >= 0) setTimeout(() => { try { el.focus(); el.setSelectionRange(i, i + 1); } catch {} }, 0);
        } else sugerirCat(k);
      }
      if (f === 'quantidade' || f === 'valor_total') atualizarUnit(k);
      aoMudar && aoMudar(itens);
    });
    $$('[data-rm]', alvo).forEach(b => b.onclick = () => { itens.splice(b.dataset.rm, 1); desenhar(); });
    $('#add-item', alvo).onclick = () => { itens.push({ ...novo(), status: itens[itens.length - 1]?.status || 'arte_a_fazer' }); desenhar(); };
    aoMudar && aoMudar(itens);
  };
  desenhar();
  const usado = i => (i.descricao || '').trim() || i.categoria_id || Number(i.valor_total);
  const pegar = () => itens.filter(usado).map(i => ({ categoria_id: i.categoria_id, descricao: (i.descricao || '').trim(), observacao: i.observacao || '',
    especificacao: i.especificacao || '', quantidade: i.quantidade, valor_total: i.valor_total, status: i.status }));
  pegar.definirStatus = v => { comStatus = v; alvo.classList.toggle('ocultar-status', !v); };
  pegar.incompletos = () => itens.filter(usado).filter(i => !(i.descricao || '').trim() || !i.categoria_id
    || !(Number(i.quantidade) > 0) || i.valor_total === '' || i.valor_total == null).length;
  return pegar;
}

/* ---------- ENTREGA (V3) — novo pedido, editar pedido, alterar entrega e conversão de orçamento ---------- */
function htmlEntrega(v = {}) {
  const forma = v.forma_entrega || 'retirada';
  return `<div data-ent style="grid-column:1/-1">
    <input type="hidden" name="forma_entrega" value="${forma}"><input type="hidden" name="endereco_entrega" value="${esc(v.endereco_entrega || '')}">
    <div class="chips" data-ent-forma><button type="button" class="chip" data-v="retirada">Retira no balcão</button><button type="button" class="chip" data-v="entrega">Entregar no cliente</button></div>
    <div data-ent-corpo style="margin-top:10px"></div></div>`;
}
function ligarEntrega(el) {
  const raiz = el.querySelector('[data-ent]');
  const hForma = raiz.querySelector('[name=forma_entrega]'), hEnd = raiz.querySelector('[name=endereco_entrega]');
  const corpo = raiz.querySelector('[data-ent-corpo]');
  let endEntrega = hForma.value === 'entrega' ? hEnd.value : '', manual = !!endEntrega, cepInfo = null;
  const render = () => {
    const f = hForma.value;
    raiz.querySelectorAll('[data-ent-forma] .chip').forEach(b => b.classList.toggle('ativo', b.dataset.v === f));
    if (f === 'retirada') { hEnd.value = EMPRESA.endereco; corpo.innerHTML = `<div class="small">Balcão: ${esc(EMPRESA.endereco)}</div>`; return; }
    hEnd.value = endEntrega;
    corpo.innerHTML = `<div class="grade g4">
        <label class="campo">CEP<input type="text" data-e="cep" maxlength="9" inputmode="numeric" placeholder="Buscar endereço"></label>
        <label class="campo">Número<input type="text" data-e="num"></label>
        <label class="campo" style="grid-column:span 2">Complemento<input type="text" data-e="comp"></label></div>
      <label class="campo" style="margin-top:8px">Endereço de entrega<input type="text" data-e="end" value="${esc(endEntrega)}"></label>
      <div class="small muted" data-e="dica" style="margin-top:4px">${endEntrega ? '' : 'Digite o CEP ou escreva o endereço completo.'}</div>`;
    const q = k => corpo.querySelector(`[data-e="${k}"]`);
    const montar = () => {
      if (!cepInfo) return;
      const c = cepInfo, num = q('num').value.trim(), comp = q('comp').value.trim();
      endEntrega = [`${c.street || ''}${num ? ', ' + num : ''}`.trim(), comp, c.neighborhood, c.city && `${c.city}/${c.state}`, 'CEP ' + c.cep].filter(Boolean).join(' · ');
      q('end').value = endEntrega; hEnd.value = endEntrega; manual = true;
    };
    q('end').oninput = () => { endEntrega = q('end').value; hEnd.value = endEntrega; manual = true; };
    q('num').oninput = q('comp').oninput = montar;
    q('cep').oninput = async () => {
      const cep = q('cep').value.replace(/\D/g, ''); if (cep.length !== 8) return;
      const fmt = cep.replace(/^(\d{5})(\d{3})$/, '$1-$2'); q('cep').value = fmt; q('dica').textContent = 'Buscando…';
      try {
        const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`); if (!r.ok) throw new Error();
        cepInfo = { ...(await r.json()), cep: fmt }; montar(); q('dica').textContent = 'Confira o número e o complemento.'; q('num').focus();
      } catch { cepInfo = null; q('dica').textContent = 'CEP não encontrado. Escreva o endereço completo.'; }
    };
  };
  raiz.querySelectorAll('[data-ent-forma] .chip').forEach(b => b.onclick = () => { hForma.value = b.dataset.v; render(); });
  render();
  return {
    forma: () => hForma.value,
    endereco: () => hEnd.value,
    definirCliente: c => { if (manual) return; endEntrega = c ? enderecoCliente(c) : ''; cepInfo = null; render(); }
  };
}
const somaDiasUteis = (d, n) => { const x = new Date(d + 'T12:00:00'); let k = 0; while (k < n) { x.setDate(x.getDate() + 1); if (x.getDay() % 6) k++; } return x.toISOString().slice(0, 10); };
const textoPrazo = n => n ? `${n} ${Number(n) === 1 ? 'dia útil' : 'dias úteis'} após a aprovação da arte` : '';
const freteGratis = o => o.frete_gratis ?? (o.forma_entrega === 'entrega' && !Number(o.frete));
const SELO_FRETE = `<div style="display:inline-block;margin-top:10px;padding:6px 16px;border:2px solid #00a986;color:#00a986;border-radius:6px;font-weight:700;letter-spacing:1.5px;font-size:12pt;transform:rotate(-2deg)">FRETE GRÁTIS</div>`;
function blocosProposta(o) {

            : o.forma_entrega === 'retirada' ? `Retirada no balcão: ${EMPRESA.endereco}` : '';
  return `${o.prazo_dias_uteis ? `<div class="bloco"><div class="rot">Prazo</div><p>${esc(textoPrazo(o.prazo_dias_uteis))}</p></div>` : ''}
    ${ent || o.observacoes_entrega ? `<div class="bloco"><div class="rot">Entrega</div>${ent ? `<p>${esc(ent)}</p>` : ''}${o.observacoes_entrega ? `<p style="margin-top:4px">${esc(o.observacoes_entrega)}</p>` : ''}</div>` : ''}`;
}
const saiuParaEntrega = p => (p.itens || []).some(i => ['em_transporte', 'entregue'].includes(i.status));
function modalAlterarEntrega() {
  const p = S.vistaAtual.dados;
  if (saiuParaEntrega(p)) return toast('O pedido já saiu para entrega. O endereço não pode mais ser alterado.', true);
  const m = abrirModal({ titulo: `Entrega do pedido ${p.numero}`, corpo: `<form id="f-ent" class="grade g2">${htmlEntrega(p)}</form>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar entrega</button>`,

  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    await api('editar_pedido', { id: p.id, ...formDados($('#f-ent', m.el)) }); m.fechar(); toast('Entrega atualizada.'); recarregar();
  };
}

    finally { $('#np-salvar').disabled = false; }
  };
