function conferirCadastroLink(id) {

  const m = abrirModal({ titulo: `Conferir cadastro · ${x.nome}`, largo: true, corpo: `
    ${x.existente ? `<div class="alerta" style="margin-bottom:12px"><b>Este documento já é do cliente ${esc(x.existente.nome)}.</b> Ao aprovar, nome, telefone, e-mail e endereço desse cadastro serão atualizados com os dados abaixo. Revenda, observação fixa e contatos continuam como estão.</div>` : ''}
    <div class="grade g3">

      ${lin('Telefone', fmtTel(d.telefone) + (d.telefone_whatsapp ? ' (WhatsApp)' : ''))}${lin('E-mail', d.email)}${lin('Instagram', d.instagram && '@' + d.instagram)}
      <div style="grid-column:1/-1">${lin('Endereço', end)}</div>
      <div style="grid-column:1/-1" class="small muted">Enviado em ${dataHora(x.updated_at)} · aceite LGPD em ${dataHora(x.lgpd_aceite_em)}</div>
    </div>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn perigo" data-r>Recusar</button><button class="btn prim" data-a>${x.existente ? 'Aprovar e atualizar cliente' : 'Aprovar cadastro'}</button>` });
  m.el.querySelector('[data-v]').onclick = () => { m.fechar(); modalCadastrosLink(); };
  m.el.querySelector('[data-a]').onclick = async () => {

    if (await confirmar('Cadastro aprovado. Quer abrir o cliente para completar dados internos (revenda, observação fixa)?', 'Abrir cliente')) modalCliente(r.cliente_id, recarregar);
    else recarregar();
  };
  m.el.querySelector('[data-r]').onclick = async () => {
    const motivo = prompt('Motivo da recusa (uso interno):'); if (!motivo || !motivo.trim()) return;
    await api('revisar_cadastro_link', { id, acao: 'recusar', motivo: motivo.trim() }); m.fechar(); toast('Cadastro recusado.'); modalCadastrosLink();

}

/* ---------- ARTE ---------- */

  S.cache.voltarArte = 'arte';
  const designers = S.base?.designers || [];
  definirTopoEm(el, 'Arte', `<button class="btn" onclick="recarregar()">Atualizar</button>`);

    ${barraFiltroArte({ artes: r.artes, filtro: fl, busca: b, aoFiltrar: 'filtrarFilaArte', idBusca: 'b-arte',

    <p class="small muted">${r.total} arte(s)${b || vd || des ? ' no filtro' : ''}.</p>
    ${listaArtesResumo(r.artes.filter(filtroArteFn(fl)), 'interno')}`;

  ligarFiltroArte(el, '#f-vend-arte', 'vendArte');
  ligarFiltroArte(el, '#f-des-arte', 'desArte');

});
function filtrarFilaArte(k) { S.cache.filtroArteFila = k; recarregar(); }
async function moverItem(id, status) { await api('mudar_status_itens', { itens: [id], status }); toast(`Item movido para ${nomeStatusItem(status)}.`); recarregar(); }
function modalArte(id) {
  const i = S.vistaAtual.dados.find(x => x.id === id);
  const m = abrirModal({ titulo: `Arte · ${i.descricao}`, corpo: `

      <label class="campo">Link da prova / aprovação<input type="text" name="arte_url" value="${esc(i.arte_url || '')}"></label>

    </form>`, rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    await api('salvar_item', { id, ...formDados($('#f-arte', m.el)) });
    for (const arq of [...$('#arq', m.el).files]) {
      try { await enviarArquivoDrive(i.pedido_id, arq, 'producao', id, $('#arq-rot', m.el).value.trim()); }

/* ---------- ARTES (AR2) ---------- */
// Situações da arte. A designer move a arte; o item anda sozinho conforme as artes dele.
const ARTE_SIT = {
  a_fazer: ['Arte pendente', 'b-cinza'], em_criacao: ['Em andamento', 'b-azul'],
  em_alteracao: ['Em andamento', 'b-azul'], aguardando_cliente: ['Em aprovação', 'b-ambar'],
  pausada: ['Pausada · com o vendedor', 'b-vermelho'], aprovada: ['Aprovado pelo cliente', 'b-azul'],
  pronta: ['Arquivo pronto para impressão', 'b-verde'], resolvida_vendedor: ['Resolvida pelo vendedor', 'b-cinza'],
  cancelada: ['Cancelada', 'b-vermelho']
};
const badgeArte = s => badge((ARTE_SIT[s] || [s])[0], (ARTE_SIT[s] || [, 'b-cinza'])[1]);
// Cada pessoa tem uma cor no cadastro (Cadastros › Usuários). Sem cor, cai numa cor
// derivada do nome, para nunca ficar sem identificação visual.
const COR_PESSOA_PADRAO = '#5D6B73';
function corDaPessoa(nome, cor) {
  if (cor && /^#[0-9A-Fa-f]{6}$/.test(cor)) return cor;
  if (!nome) return COR_PESSOA_PADRAO;
  const p = ['#00838F', '#AD1457', '#5D4037', '#455A64', '#9E9D24', '#4527A0', '#C62828'];
  let h = 0; for (const c of String(nome)) h = (h * 31 + c.charCodeAt(0)) % 9973;
  return p[h % p.length];
}
// texto branco ou escuro conforme o que der mais contraste com a cor de fundo,
// medido pela regra de contraste da WCAG — serve para qualquer cor que o diretor escolher
function luminancia(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { const x = v / 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const contrasteEntre = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
const LUM_ESCURO = luminancia('#132A32');
function textoSobre(hex) {
  const L = luminancia(hex);
  return contrasteEntre(L, 1) >= contrasteEntre(L, LUM_ESCURO) ? '#fff' : '#132A32';
}
function tagPessoa(nome, cor, papel) {
  if (!nome) return '';
  const c = corDaPessoa(nome, cor);
  return `<span class="tag-pessoa" style="background:${c};color:${textoSobre(c)}" title="${esc(papel ? papel + ': ' + nome : nome)}">${esc(nome)}${papel ? `<span class="papel">${esc(papel)}</span>` : ''}</span>`;
}
const soPainelArte = () => !!S.perm.so_painel_arte;
const gerenciaArtes = () => !!S.perm.gerencia_artes;
const arteTipos = () => (S.base?.arte_tipos || []).filter(t => t.ativo);
const nomeTipoArte = c => (S.base?.arte_tipos || []).find(t => t.codigo === c)?.nome || c;

function tempoCurto(seg) {
  const s = Math.max(0, Math.round(Number(seg) || 0));
  if (s < 60) return s + ' s';
  const m = Math.round(s / 60); if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return h + 'h' + (mm ? ' ' + mm + 'min' : '');
  const d = Math.floor(h / 24); return d + (d === 1 ? ' dia' : ' dias') + (h % 24 ? ' ' + (h % 24) + 'h' : '');
}
function etiquetasArte(a) {
  const e = [];
  if (a.urgente) e.push(badge('URGENTE', 'b-vermelho'));
  if (a.entrega_atrasada) e.push(badge('ATRASADO', 'b-vermelho'));
  if (a.tempo_estourado) e.push(badge('Passou do tempo previsto', 'b-ambar'));
  if (a.situacao === 'aprovada') e.push(badge('FALTA FECHAR O ARQUIVO', 'b-ambar'));
  if (a.situacao === 'em_alteracao') e.push(badge('Alteração pedida', 'b-ambar'));
  if (a.falta_pagamento) e.push(badge('Falta pagamento', 'b-ambar'));
  return e.join(' ');
}
// Botões da designer: um passo por vez, na ordem do trabalho dela.
/* ---------- AR3c: montador de provas (arquivo montador.js, carregado só no clique) ---------- */
const podeMontarProva = a => ['a_fazer', 'em_criacao', 'em_alteracao', 'aguardando_cliente'].includes(a.situacao) && !!a.item_id;
let carregandoMontador = null;
async function copiarLinkProva(chave) {
  const link = location.origin + location.pathname + '#/prova/' + chave;
  try { await navigator.clipboard.writeText(link); toast('Link de aprovação copiado.'); } catch (e) { prompt('Copie o link:', link); }
}
async function carregarMontador() {
  if (!window.abrirMontador) {
    carregandoMontador = carregandoMontador || new Promise((ok, falha) => {
      const sc = document.createElement('script'); sc.src = 'montador.js?v=20261027a';
      sc.onload = ok; sc.onerror = () => { carregandoMontador = null; falha(new Error('Não foi possível abrir o montador de provas. Atualize a página (Ctrl+F5).')); };
      document.head.appendChild(sc);
    });
    try { await carregandoMontador; } catch (e) { toast(e.message, true); return false; }
  }
  return true;
}
async function montarProva(arteId) { if (await carregarMontador()) window.abrirMontador(arteId); }
// Vendedor (ou quem for) testa o arquivo do cliente contra o gabarito do item: só na tela, nada é salvo nem enviado
async function testarArquivo(itemId) {
  const v = S.vistaAtual || {};
  const i = ((v.dados && v.dados.itens) || []).find(x => x.id === itemId);
  const a = (v.artes || []).find(x => x.item_id === itemId);
  const item = i ? { item_descricao: i.descricao, urgencia: i.urgencia } : a ? { item_descricao: a.item_descricao, urgencia: a.urgencia } : null;
  if (!item) return toast('Item não encontrado. Atualize a tela.', true);
  // AR4 caminho direto: arquivo do cliente dentro do gabarito vai como arquivo para impressão
  const pend = (v.artes || []).filter(x => x.item_id === itemId && ['a_fazer', 'em_criacao', 'aguardando_cliente', 'em_alteracao', 'pausada', 'aprovada'].includes(x.situacao));
  const statusItem = i ? i.status : a && a.item_status;
  const podeVend = !pode('so_painel_arte') && (pode('cria_pedidos') || gerenciaArtes());
  let direto = null;
  if (podeVend && ITEM_NA_ARTE.includes(statusItem)) {
    if (pend.length === 1) direto = { arte: pend[0], motivo: null };
    else direto = { arte: null, motivo: pend.length > 1 ? 'Este item tem mais de uma arte em andamento: use o caminho normal (arte por arte).'
                                                     : 'Este item não tem arte em andamento.' };
    if (direto.arte && item.urgencia && item.urgencia.digital && item.urgencia.digital.digital)
      direto = { arte: null, motivo: 'Item na impressão digital: a folha montada (A4/SRA3) é feita pela designer. Use o caminho normal.' };
  }
  if (await carregarMontador()) window.abrirMontador(null, { teste: true, item, direto, aoUsar: usarArquivoCliente });
}
// Envia os arquivos do cliente como arquivo para impressão e encerra a arte (resolvida pelo vendedor)
async function usarArquivoCliente(arte, files, conf, aoProgresso) {
  let confirmarDesigner = false;
  if (arte.situacao !== 'a_fazer') {
    if (!(await confirmar(`${arte.designer_nome || 'A designer'} já começou esta arte. Usar o arquivo do cliente encerra a arte sem pagamento à designer. Continuar?`, 'Usar o arquivo do cliente'))) return null;
    confirmarDesigner = true;
  }
  const ids = [];
  for (const [k, f] of files.entries()) {
    ids.push(await enviarArquivoDrive(arte.pedido_id, f, 'producao', arte.item_id, files.length > 1 ? `Cliente ${k + 1}` : 'Arquivo do cliente',
      fr => aoProgresso && aoProgresso(`Enviando ${f.name}… ${Math.round(fr * 100)}%`), null, { arte_id: arte.id }));
  }
  const r = await api('arte_usar_arquivo_cliente', { arte_id: arte.id, arquivo_ids: ids, confirmar: confirmarDesigner, conferencia: conf });
  toast(r.pre_impressao ? 'Arquivo do cliente enviado: o item foi para a pré-impressão.'
      : r.falta_pagamento ? 'Arquivo do cliente enviado. O item vai para a pré-impressão sozinho quando o pagamento entrar (ou o pedido for autorizado).'
      : r.item_status === 'arte_aprovada' ? 'Arquivo do cliente enviado: o item está pronto para a pré-impressão.'
      : 'Arquivo do cliente enviado e arte resolvida pelo vendedor.');
  recarregar();
  return r;
}
// Linha "Prova v2 · com o cliente desde…" no quadro da arte
function linhaProva(a) {
  const pv = a.prova; if (!pv) return '';
  const sit = { enviada: 'com o cliente', aprovada: 'aprovada', alteracao: 'cliente pediu alteração', substituida: 'substituída' }[pv.situacao] || pv.situacao;
  return `<div class="small muted" style="margin-top:6px">Prova v${pv.versao}${pv.modo === '3d' ? ' (3D)' : ''}${pv.final ? ' · <b>arte pronta para impressão</b>' : ''} · ${sit}${pv.decidido_nome ? ' por ' + esc(pv.decidido_nome) : ''} · ${dataHora(pv.decidido_em || pv.em)}</div>`;
}
function acoesDesigner(a) {
  const b = [];
  if (a.situacao === 'a_fazer') b.push(`<button class="btn prim peq" onclick="arteSituacao('${a.id}','em_criacao')">Começar a arte</button>`);
  if (podeMontarProva(a)) b.push(`<button class="btn prim peq" onclick="montarProva('${a.id}')">${a.situacao === 'aguardando_cliente' ? 'Nova versão da prova' : 'Montar prova'}</button>`);
  if (a.situacao === 'em_criacao' || a.situacao === 'em_alteracao') b.push(`<button class="btn peq" onclick="arteSituacao('${a.id}','aguardando_cliente')" title="Use quando a prova foi mandada por fora do sistema">Enviei a prova por fora</button>`);
  if (a.situacao === 'aguardando_cliente') {
    b.push(`<button class="btn prim peq" onclick="arteSituacao('${a.id}','aprovada')">Cliente aprovou</button>`);
    b.push(`<button class="btn peq" onclick="modalAlteracaoCliente('${a.id}')">Cliente pediu alteração</button>`);
  }
  if (a.situacao === 'em_criacao' || a.situacao === 'em_alteracao') b.push(`<button class="btn peq" onclick="modalAlteracaoCliente('${a.id}', true)" title="O cliente quer mudar quantidade, tamanho, papel… — a arte fica com o vendedor">Pausar (alteração no material)</button>`);
  if (a.situacao === 'aprovada') {
    b.push(`<button class="btn prim peq" onclick="modalFecharArte('${a.id}')">Enviar arquivo para impressão</button>`);
    b.push(`<button class="btn peq" onclick="modalAlteracaoCliente('${a.id}', true)">Pausar (alteração no material)</button>`);
  }
  if (a.situacao === 'pausada') b.push(`<span class="small muted">Aguardando o vendedor ajustar o material.</span>`);
  return b.join(' ');
}
function acoesVendedorArte(a, pode) {
  if (!pode) return '';
  const b = [];
  if (podeMontarProva(a) && a.designer_id) b.push(`<button class="btn peq" onclick="montarProva('${a.id}')">${a.situacao === 'aguardando_cliente' ? 'Nova versão da prova' : 'Montar prova'}</button>`);
  if (a.situacao === 'aguardando_cliente') {
    b.push(`<button class="btn prim peq" onclick="arteSituacao('${a.id}','aprovada')">Cliente aprovou</button>`);
    b.push(`<button class="btn peq" onclick="modalAlteracaoCliente('${a.id}')">Cliente pediu alteração</button>`);
  }
  if (a.situacao === 'pausada') b.push(`<button class="btn prim peq" onclick="arteSituacao('${a.id}','em_alteracao',2)">Material ajustado · devolver para a designer</button>`);
  if (a.situacao === 'aprovada' || a.situacao === 'pronta') b.push(`<button class="btn peq" onclick="arteSituacao('${a.id}','em_alteracao',1)">Devolver para a designer</button>`);
  if (['a_fazer', 'em_criacao', 'aguardando_cliente', 'em_alteracao', 'pausada', 'aprovada'].includes(a.situacao)) {
    b.push(`<button class="btn peq" onclick="modalArteEditar('${a.id}')">Editar</button>`);
    b.push(`<button class="btn peq" onclick="arteResolverVendedor('${a.id}')">Resolvida pelo vendedor</button>`);
  }

    const comDesigner = a.designer_nome ? ` (${esc(a.designer_nome)})` : '';
    if (!a.designer_id && ['a_fazer', 'em_criacao', 'em_alteracao'].includes(s)) texto = 'Arte sem designer: escolha a designer do pedido.';
    else if (s === 'a_fazer') texto = `Com a designer${comDesigner}: ainda não começou.`;
    else if (s === 'em_criacao' || s === 'em_alteracao') texto = `Com a designer${comDesigner}: fazendo a arte.`;
    else if (s === 'aguardando_cliente') { texto = 'A prova está com o cliente.';
      if (podeMexer) bot.push(B('Cliente aprovou', `arteSituacao('${id}','aprovada')`), B('Cliente pediu alteração', `modalAlteracaoCliente('${id}')`)); }
    else if (s === 'pausada') { texto = 'O cliente pediu mudança no material. Ajuste o item no pedido e devolva para a designer.';
      if (podeMexer) bot.push(B('Material ajustado · devolver para a designer', `arteSituacao('${id}','em_alteracao',2)`, 1)); }
    else if (s === 'aprovada') texto = `Aprovado pelo cliente. A designer${comDesigner} vai fechar o arquivo para impressão.`;
    else if (s === 'pronta') {
      if (a.item_status === 'arte_aprovada' && podeStatus('pre_impressao')) { texto = 'Arquivo pronto para impressão. Confira e envie.'; bot.push(B('Enviar para pré-impressão', `enviarPreImpressao('${a.item_id}')`, 1)); }
      else texto = naArte ? 'Arquivo pronto para impressão.' : 'Arquivo pronto. O item já está na pré-impressão ou adiante.'; }
    else if (s === 'resolvida_vendedor') texto = 'Resolvida pelo vendedor.';
    if (podeMexer) {
      if (podeMontarProva(a) && a.designer_id) mais.push(B(s === 'aguardando_cliente' ? 'Nova versão da prova' : 'Montar prova', `montarProva('${id}')`));
      if ((s === 'aprovada' || s === 'pronta') && naArte) mais.push(B('Devolver para a designer', `arteSituacao('${id}','em_alteracao',1)`));
      if (['a_fazer', 'em_criacao', 'em_alteracao', 'aguardando_cliente', 'pausada', 'aprovada'].includes(s)) {
        mais.push(B('Editar', `modalArteEditar('${id}')`), B('Resolvida pelo vendedor', `arteResolverVendedor('${id}')`)); }
    } else bot = [];
  }
  if (a.item_id) mais.push(B('Conversa' + (a.ultima_mensagem_em ? ' •' : ''), `modalConversaArte('${id}')`));
  if (!d && a.item_id) mais.push(B('Testar arquivo do cliente', `testarArquivo('${a.item_id}')`));
  return { texto, bot, mais };
}
// Um material (item) com as artes dele: passo a passo, alteração em destaque e o próximo passo

      <div>${urg ? badge('URGENTE', 'b-vermelho') : ''}${modo !== 'designer' && as.some(a => a.falta_pagamento) ? ' ' + badge('Falta pagamento', 'b-ambar') : ''}${seloConferencia(u && u.conferencia)}</div></div>

        ${passosArte(a)}
        ${caixaAlteracao(a)}

        <div class="proximo-passo"><div class="o-que">${ac.texto}</div>${ac.bot.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${ac.bot.join('')}</div>` : ''}</div>
        ${blocoExp('mais-arte-' + a.id, 'Mais opções e detalhes', `
          ${ac.mais.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${ac.mais.join('')}</div>` : ''}
          ${linhaProva(a)}
          <div class="small muted" style="margin-top:6px">${esc(nomeTipoArte(a.tipo))} · designer ${tempoCurto(a.seg_designer)} · cliente ${tempoCurto(a.seg_cliente)}${a.seg_vendedor ? ' · vendedor ' + tempoCurto(a.seg_vendedor) : ''}${a.tempo_estourado ? ' · <b>passou do tempo previsto</b>' : ''}${a.valor != null ? ' · ' + brl(a.valor) : ''}</div>
          ${modo !== 'designer' && a.designer_nome ? `<div class="small muted">Designer: ${esc(a.designer_nome)}</div>` : ''}
          <div data-arte-arq="${a.id}" data-arte-item="${a.item_id || ''}" class="small" style="margin-top:6px"></div>
          ${k === 0 && it.item_id ? htmlGabaritoItem(it.item_id, it.gabarito_grupo_id, u, ativa && (modo === 'designer' || pode('cria_pedidos') || gerenciaArtes() || pode('gerencia_cadastros'))) : ''}
          ${k === 0 && it.item_observacao ? `<div class="small" style="margin-top:6px"><span class="muted">Observação do item:</span> ${esc(it.item_observacao)}</div>` : ''}
          ${k === 0 && o.extraItem ? o.extraItem : ''}`, false, 'leve')}</div>`; }).join('')}
  </div>`;
}
// Tela do pedido na arte: cabeçalho curto e um bloco por material
function detalheArtesPedido(artes, modo) {

// Fechar a arte = enviar o arquivo para impressão. É aqui que a designer passa a receber pela arte.
function modalFecharArte(id) {
  const a = (S.vistaAtual?.artes || []).find(x => x.id === id); if (!a) return;
  // item na digital: o arquivo para impressão é a folha montada (A4 22×32 ou SRA3 32×45); gabarito "cabe na área" (apostila) não precisa
  const gr = a.urgencia && a.urgencia.gabarito_medidas && a.urgencia.gabarito_medidas.regras;
  const dig = !!(a.urgencia && a.urgencia.digital && a.urgencia.digital.digital) && !(gr && gr.modo === 'area');
  let folhaOk = null;
  const m = abrirModal({ titulo: `Arquivo para impressão · ${a.item_descricao}`, corpo: `
    <p class="small muted" style="margin:0">O cliente aprovou a prova. Envie o arquivo final de produção (sem linhas de gabarito). Ao enviar, a arte fica <b>Arquivo pronto para impressão</b> e o vendedor pode mandar o item para a pré-impressão.</p>
    ${a.urgencia && (a.urgencia.gabarito_nome || a.urgencia.grupo_nome) ? `<p class="small" style="margin:8px 0 0"><span class="muted">Gabarito:</span> ${esc(a.urgencia.grupo_nome || '')}${a.urgencia.gabarito_nome ? ' — ' + esc(a.urgencia.gabarito_nome) : ''}</p>` : ''}
    ${dig ? `<div class="alerta" style="margin-top:8px"><b>Item na impressão digital</b>${a.urgencia.digital.motivo ? ` (${esc(a.urgencia.digital.motivo)})` : ''}: envie a <b>folha montada</b> em PDF (A4 22 × 32 cm ou SRA3 32 × 45 cm). O sistema confere o tamanho.</div>` : ''}
    <label class="campo">${dig ? 'Folha montada' : 'Arquivo(s)'} *<input type="file" id="fa-arq" multiple accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.ai,.eps,.psd,.cdr,.svg,.zip"></label>
    <div id="fa-folha" class="small"></div>
    <label class="campo">Identificação <span class="muted">(opcional — ex.: Frente, Verso, Faca)</span><input type="text" id="fa-rot" maxlength="40" value="${dig ? 'Folha montada' : ''}"></label>
    <div id="fa-status" class="small"></div>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Enviar e fechar a arte</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  if (dig) m.el.querySelector('#fa-arq').onchange = async () => {
    const box = m.el.querySelector('#fa-folha'), arqs = [...m.el.querySelector('#fa-arq').files]; folhaOk = null; box.innerHTML = '';
    if (!arqs.length || !(await carregarMontador())) return;
    const linhas = [];
    folhaOk = true;
    for (const f of arqs) {
      let md = null; try { md = await window.medirArquivoMm(f); } catch (e) {}
      const nome = md && window.folhaDigitalMm(md.w, md.h);
      if (!nome) folhaOk = false;
      linhas.push(!md ? `<span style="color:var(--vermelho)">${esc(f.name)}: não é PDF, o tamanho não foi conferido.</span>`
        : nome ? `<span style="color:#007a61">✓ ${esc(f.name)}: folha ${nome} (${fmtMm(Math.round(md.w))} × ${fmtMm(Math.round(md.h))} mm).</span>`
        : `<span style="color:var(--vermelho)">${esc(f.name)}: ${fmtMm(Math.round(md.w))} × ${fmtMm(Math.round(md.h))} mm, não é A4 (220 × 320) nem SRA3 (320 × 450).</span>`);
    }
    box.innerHTML = linhas.join('<br>');
  };
  const bs = m.el.querySelector('[data-s]');
  bs.onclick = async () => {
    const arqs = [...m.el.querySelector('#fa-arq').files];
    if (!arqs.length) return toast(dig ? 'Escolha a folha montada.' : 'Escolha o arquivo para impressão.', true);
    // AR3b: conferência do arquivo para impressão (só avisa; vermelho pede "enviar mesmo assim" com motivo)
    if (!(await carregarMontador())) return;
    const conf = await window.conferirArquivosParaImpressao({ files: arqs, urgencia: a.urgencia, descricao: a.item_descricao, prova: a.prova, folha: dig,
      limiteMb: (S.cache.gabaritos && S.cache.gabaritos.dados && S.cache.gabaritos.dados.limite_mb) || 100 });
    if (!conf) return;
    const st = m.el.querySelector('#fa-status'), rot = m.el.querySelector('#fa-rot').value.trim();
    bs.disabled = true; bs.classList.add('ocupado'); const ids = [];
    for (const arq of arqs) {
      try { ids.push(await enviarArquivoDrive(a.pedido_id, arq, 'producao', a.item_id, rot, f => { st.textContent = `Enviando ${arq.name}… ${Math.round(f * 100)}%`; }, null, { arte_id: a.id })); }
      catch (e) { toast(`${arq.name}: ${e.message}`, true); }
    }
    if (!ids.length) { bs.disabled = false; bs.classList.remove('ocupado'); st.textContent = ''; return; }
    try { await api('conferencia_registrar', { arte_id: a.id, arquivo_ids: ids, origem: 'fechar_arte', ...conf }, true); }
    catch (e) { toast('O arquivo foi enviado, mas a conferência não ficou registrada: ' + e.message, true); }
    try { const r = await api('arte_situacao', { id, situacao: 'pronta' }); m.fechar();
      toast(r.arte && r.arte.item_status === 'pre_impressao' ? 'Arte fechada. O pedido tem pagamento: o item já foi para a pré-impressão.'
          : r.arte && r.arte.item_status === 'arte_aprovada' ? 'Arte fechada: arquivo pronto. Como o pedido ainda não tem pagamento, o vendedor envia para a pré-impressão.'
          : 'Arte fechada: arquivo pronto para impressão.'); recarregar(); }
    catch (e) { bs.disabled = false; bs.classList.remove('ocupado'); st.textContent = 'O arquivo foi enviado, mas a arte não fechou. Tente de novo.'; }
  };
}
// Item com arquivo pronto: o vendedor confere e envia para a pré-impressão (a trava de pagamento continua valendo)
async function enviarPreImpressao(ids) {
  const lista = String(ids).split(',').filter(Boolean); if (!lista.length) return;
  try { await api('mudar_status_itens', { itens: lista, status: 'pre_impressao' }); toast(lista.length > 1 ? `${lista.length} itens enviados para a pré-impressão.` : 'Item enviado para a pré-impressão.'); recarregar(); }
  catch (e) {}
}
async function arteResolverVendedor(id) {
  const ok = confirm('Marcar esta arte como resolvida pelo vendedor? Ela sai da fila da designer e não gera pagamento para ela.');
  if (!ok) return;
  const fazer = async (confirmar) => {
    const r = await api('arte_resolver_vendedor', confirmar ? { id, confirmar: true } : { id });
    toast('Arte resolvida pelo vendedor.');
    await oferecerPreImpressao(r.arte);
    recarregar();
  };
  try { await fazer(false); }
  catch (e) {
    if (e.codigo === 'CONFIRMAR') {
      if (!confirm(e.message + '\n\nConfirmar e encerrar a arte?')) return;
      try { await fazer(true); } catch (e2) { toast(e2.message, true); }
    } else toast(e.message, true);
  }
}
// Com a arte resolvida, o item pode já seguir. Perguntamos em vez de mover sozinho:
// o pagamento e a autorização continuam valendo, e a trava do banco responde se não puder.
async function oferecerPreImpressao(arte) {
  if (!arte || !arte.item_id) return;
  if (![ 'arte_a_fazer', 'arte_em_alteracao', 'arte_em_aprovacao', 'arte_pausada', 'arte_fechando', 'arte_aprovada'].includes(arte.item_status)) return;
  if (!podeStatus('pre_impressao')) return;
  let r; try { r = await api('listar_artes', { situacao: 'em_andamento', pedido_id: arte.pedido_id, limite: 100 }, true); } catch { return; }
  const pendentes = (r.artes || []).filter(a => a.item_id === arte.item_id);
  if (pendentes.length) {
    toast(`O material "${arte.item_descricao}" ainda tem ${pendentes.length} arte(s) em andamento.`);
    return;
  }
  if (!confirm(`O material "${arte.item_descricao}" está em ${nomeStatusItem(arte.item_status)} e já não tem arte pendente.\n\nEnviar para a pré-impressão agora?`)) return;
  try { await api('mudar_status_itens', { itens: [arte.item_id], status: 'pre_impressao' }); toast('Item enviado para a pré-impressão.'); }
  catch (e) {
    toast(e.message, true);
  }
}

    for (const arq of arqs) {
      st.textContent = `Enviando ${arq.name}…`;
      try { await enviarArquivoDrive(a.pedido_id, arq, tipo, a.item_id, rot, f => { st.textContent = `Enviando ${arq.name}… ${Math.round(f * 100)}%`; }); }
      catch (e) { falhou++; toast(`${arq.name}: ${e.message}`, true); }
    }
    btn.disabled = false;
    if (falhou < arqs.length) { m.fechar(); toast('Arquivo enviado.'); recarregar(); }
    else st.textContent = '';
  };
}

// prioridade: 0 entrega atrasada · 1 entrega hoje · 2 muito urgente · 3 urgente / entrega amanhã · 4 normal
function prioridadePre(i) {
  const u = i.urgencia || {};
  let d = u.dias_para_entrega;
  if (d == null && i.data_prevista_entrega) d = Math.round((new Date(i.data_prevista_entrega + 'T12:00:00') - new Date(hoje() + 'T12:00:00')) / 864e5);
  if (d != null && d < 0) return { p: 0, txt: 'Atrasado', cls: 'mk-verm', cor: 'var(--vermelho)', d };
  if (d === 0) return { p: 1, txt: 'Entrega hoje', cls: 'mk-verm', cor: 'var(--vermelho)', d };
  if (u.nivel === 'muito_urgente') return { p: 2, txt: 'Muito urgente', cls: 'mk-verm', cor: 'var(--vermelho)', d };
  if (u.nivel === 'urgente') return { p: 3, txt: 'Urgente', cls: 'mk-amb', cor: 'var(--ambar)', d };
  if (d === 1) return { p: 3, txt: 'Entrega amanhã', cls: 'mk-amb', cor: 'var(--ambar)', d };
  return { p: 4, txt: '', cls: '', cor: 'transparent', d };
}
const preProntoParaEnviar = i => !!(i.fornecedor_id && i.prazo_producao && String(i.codigo_producao || '').trim());
function preAlertaArquivo(i) {
  const c = i.conferencia; if (!c) return '';
  if (c.digital_mudou && !c.devolvida) return c.digital_atual ? 'Mudou para digital' : 'Saiu da digital';

const URG_REGRA = { normal: 'Normal', urgente: 'Urgente', muito_urgente: 'Muito urgente' };
function resumoRegra(r, grupos) {
  const nomeG = id => (grupos.find(g => g.id === id) || {}).nome || '?';
  const p = [];
  if (r.grupos) p.push(r.grupos.length > 2 ? `${r.grupos.length} materiais (${esc(nomeG(r.grupos[0]))}, …)` : r.grupos.map(x => esc(nomeG(x))).join(', '));
  if (r.palavras) p.push('produto com “' + r.palavras.map(esc).join('” ou “') + '”');
  if (r.qtd_min != null || r.qtd_max != null) p.push(r.qtd_min != null && r.qtd_max != null ? `${num(r.qtd_min)} a ${num(r.qtd_max)} un` : r.qtd_min != null ? `a partir de ${num(r.qtd_min)} un` : `até ${num(r.qtd_max)} un`);
  if (r.urgencias) p.push(r.urgencias.map(u => URG_REGRA[u] || u).join(' ou '));
  if (r.digital != null) p.push(r.digital ? 'só digital' : 'fora da digital');
  return p.join(' · ');
}

function ligarPreImpressao(el) {

          <td>${esc(x.vendedor_nome || '—')}</td>
          <td>${esc(TIPOS_PARC[x.tipo] || x.tipo)}${x.parcela_num ? ` ${x.parcela_num}${x.parcelas_total ? '/' + x.parcelas_total : ''}` : ''}</td>

              : `${badge('Conferido', 'b-verde')}<div class="small muted">${esc(x.conferido_por_nome || '')}</div>`}</td>

        </tr>`).join('')}</tbody></table></div>
      ${pend ? `<div class="barra-acao"><span id="conc-cont">Nenhum selecionado</span>
        <button class="btn prim" id="conc-ok" disabled>Confirmar selecionados</button>
        <button class="btn" id="conc-dev" disabled>Devolver selecionados</button></div>` : ''}`}

  const selecionados = () => $$('.sel-conc:checked').map(c => c.value);
  const atualizar = () => {
    const ids = selecionados(), soma = ids.reduce((s, id) => s + Number(S.parcelas[id].valor), 0);
    $('#conc-cont').textContent = ids.length ? `${ids.length} selecionado(s) · ${brl(soma)}` : 'Nenhum selecionado';

function devolverPagamentos(ids) {
  const soma = ids.reduce((s, id) => s + Number(S.parcelas[id]?.valor || 0), 0);
  const m = abrirModal({ titulo: 'Devolver pagamento', corpo: `
    <p style="margin:0 0 12px">${ids.length > 1 ? `${ids.length} pagamentos` : '1 pagamento'} · <b>${brl(soma)}</b>. A parcela volta a ficar em aberto, a comissão é estornada e o motivo aparece para o vendedor no pedido.</p>
    <label class="campo">Motivo *<textarea id="dev-motivo" placeholder="Ex.: Pix não entrou na conta; valor diferente do extrato"></textarea></label>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn perigo" data-s>Devolver</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const motivo = $('#dev-motivo', m.el).value.trim();
    if (!motivo) return toast('Informe o motivo da devolução.', true);
    const x = await api('conferir_recebimentos', { ids, devolver: true, motivo }); m.fechar(); toast(`${x.quantidade} pagamento(s) devolvido(s).`); recarregar();
  };
}

      ${r.lancamentos.map(l => `<tr><td class="num">${data(l.pago_em || l.created_at)}</td><td>${l.pedido_id ? `<a href="#/pedido/${l.pedido_id}">${esc(l.pedido_numero)}</a>` : '—'}</td>

  if (l.estornado) return `${badge('Repassada e estornada', 'b-cinza')}<div class="small muted">${esc(l.motivo || '')}</div>`;
  return l.repasse_feito_em ? badge('Repassada em ' + data(l.repasse_feito_em), 'b-verde') : badge('A repassar em ' + data(l.repasse_previsto), 'b-ambar');
}

function modalCategoria(id, aoSalvar) {
  const c = id ? S.base.categorias.find(x => x.id === id) : { ativo: true, apelidos: [] };
  const ger = pode('gerencia_cadastros');
  const m = abrirModal({ titulo: id ? c.nome : 'Nova categoria', largo: true, corpo: `<form id="f-cat-m" class="grade g2">
      <label class="campo">Nome da categoria *<input type="text" name="nome" value="${esc(c.nome || '')}" placeholder="Ex.: Impressos publicitários"></label>
      <label class="campo" id="ncm-box">NCM * <span class="muted">(8 dígitos)</span><input type="text" name="ncm" value="${esc(c.ncm || '')}" placeholder="0000.00.00" inputmode="numeric"></label>
      <label class="check" style="grid-column:1/-1"><input type="checkbox" name="servico" value="true" ${c.servico ? 'checked' : ''}> <b>É serviço</b> <span class="muted small">(ex.: instalação — não tem NCM; a nota de serviço fica para o módulo de Nota fiscal)</span></label>
      <div class="small" id="ncm-info" style="grid-column:1/-1"></div>
      <label class="campo" style="grid-column:1/-1">Apelidos <span class="muted">(o que o vendedor pode escrever; um por linha ou separados por vírgula)</span>
        <textarea name="apelidos" rows="6">${esc((c.apelidos || []).join('\n'))}</textarea></label>
      ${id && ger ? `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="ativo" ${c.ativo ? 'checked' : ''}> Categoria ativa</label>` : ''}
    </form>`,
    rodape: `<button class="btn" data-v>Voltar</button>${!id || ger ? '<button class="btn prim" data-s>Salvar categoria</button>' : ''}` });
  const f = $('#f-cat-m', m.el); let tmr, capIncomum = '';
  // capítulos que a GVH já usa (categorias ativas, com o NCM salvo); fora deles, só avisa
  const capsUsados = new Set((S.base.categorias || []).filter(x => x.ativo && x.ncm).map(x => String(x.ncm).slice(0, 2)));
  const ajustarServico = () => { const sv = f.elements.servico.checked; $('#ncm-box', m.el).classList.toggle('hidden', sv); if (sv) { $('#ncm-info', m.el).innerHTML = ''; capIncomum = ''; } };
  const consultar = () => { clearTimeout(tmr); tmr = setTimeout(async () => {
    const d = f.elements.ncm.value.replace(/\D/g, ''); const box = $('#ncm-info', m.el); capIncomum = '';
    if (d.length !== 8) { box.innerHTML = '<span class="muted">Digite os 8 dígitos do NCM.</span>'; return; }
    const r = await api('ncm_consultar', { ncm: d }, true).catch(() => null); if (!r) return;
    f.elements.ncm.value = r.codigo;
    const outras = (r.categorias || []).filter(n => n !== c.nome);
    box.innerHTML = (!r.tabela_carregada ? '<span class="muted">A tabela oficial de NCM ainda não foi carregada; o código não pôde ser conferido.</span>'
      : r.valido ? `<span style="color:var(--verde)">✓ ${esc(r.descricao || 'Código vigente')}</span>` : '<span style="color:var(--vermelho)">Este NCM não existe na tabela oficial vigente.</span>')
      + (outras.length ? `<div class="muted">Já usado em: ${esc(outras.join(', '))}</div>` : '');
    if (capsUsados.size && !capsUsados.has(d.slice(0, 2)) && (!r.tabela_carregada || r.valido)) {
      capIncomum = (r.descricao || '').split(' › ')[0] || `capítulo ${d.slice(0, 2)}`;
      box.innerHTML += `<div class="alerta small" style="margin-top:6px">Este NCM é de um capítulo que a gráfica não costuma usar: <b>${esc(capIncomum)}</b>. Confira se o código não foi digitado trocado.</div>`;
    }
  }, 400); };
  f.elements.ncm.oninput = consultar; if (c.ncm) consultar();
  f.elements.servico.onchange = () => { ajustarServico(); if (!f.elements.servico.checked && f.elements.ncm.value) consultar(); }; ajustarServico();
  m.el.querySelector('[data-v]').onclick = m.fechar;
  const bs = m.el.querySelector('[data-s]');
  if (bs) bs.onclick = async () => {
    if (capIncomum && !confirm(`O NCM é do capítulo "${capIncomum}", que a gráfica não costuma usar. Salvar mesmo assim?`)) return;
    const d = formDados(f); if (id) d.id = id;
    d.servico = f.elements.servico.checked; if (d.servico) d.ncm = '';
    if (id && ger) d.ativo = !!f.elements.ativo?.checked; else delete d.ativo;
    const r = await api('salvar_categoria', d); await carregarBase(); m.fechar(); toast('Categoria salva.');
    if (aoSalvar) aoSalvar(r.id); else recarregar();
  };
}

const CAT_FORN = { offset: 'Offset', digital: 'Digital', digital_cv: 'Digital e comunicação visual', comunicacao_visual: 'Comunicação visual' };
const podeCadastrarFornecedor = () => pode('gerencia_cadastros') || podeStatus('em_producao');
function opcoesFornecedor(sel) {
  const lista = (S.base.fornecedores || []).filter(f => f.ativo || f.id === sel);
  const grupo = cat => lista.filter(f => (f.categoria || '') === cat);
  const ops = l => l.map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
  const sem = grupo('');
  return `<option value="">Selecione</option>`
    + Object.entries(CAT_FORN).map(([k, n]) => grupo(k).length ? `<optgroup label="${n}">${ops(grupo(k))}</optgroup>` : '').join('')
    + (sem.length ? `<optgroup label="Sem categoria">${ops(sem)}</optgroup>` : '');
}
function linkAcessoFornecedor(id) {
  const f = id && (S.base.fornecedores || []).find(x => x.id === id);

}
async function modalAcessoFornecedor(id) {

  const r = f.tem_senha ? await api('fornecedor_senha', { id }) : { senha: null };

// Lista de materiais e gabaritos (o banco é a fonte). Guardada por 5 minutos; salvar força recarregar.
async function carregarGabaritos(forcar) {
  const c = S.cache.gabaritos;
  if (!forcar && c && Date.now() - c.em < 5 * 60 * 1000) return c.dados;
  const r = await api('gabaritos', {}, true);
  S.cache.gabaritos = { em: Date.now(), dados: r };
  return r;
}
const gruposGabarito = () => (S.cache.gabaritos?.dados?.grupos || []);

  branco_verso: 'Branco do verso', hot_stamping: 'Hot stamping', metalizado: 'Metalizado', calco_branco: 'Calço branco', faca: 'Faca', extra: 'Outra página' };

// Texto curto da conta, para o "title" e para a linha de detalhe
function textoUrgencia(u) {
  if (!u || u.dias_producao == null) return 'Sem previsão de entrega: o sistema não consegue calcular a urgência.';
  const d = Number(u.dias_producao);
  const base = d < 0 ? `Previsão já passou (${-d} ${-d === 1 ? 'dia útil' : 'dias úteis'} a menos que o necessário)`
             : `${d} ${d === 1 ? 'dia útil' : 'dias úteis'} de produção`;
  return `${base}, já descontado${Number(u.dias_entrega) === 1 ? '' : 's'} ${u.dias_entrega} ${Number(u.dias_entrega) === 1 ? 'dia' : 'dias'} de entrega · `

}

function seloDigital(dg) {
  if (!dg || !dg.digital) return '';
  const tit = dg.manual === true ? `Marcado pelo vendedor${dg.manual_por_nome ? ' (' + dg.manual_por_nome + ')' : ''}` : (dg.motivo || 'Pela regra do sistema');

// AR3b: selo da conferência do arquivo para impressão (clicar abre o detalhe)
function seloConferencia(c, itemStatus) {
  if (!c) return '';
  S.confs = S.confs || {}; S.confs[c.id] = { ...c, item_status: itemStatus || (S.confs[c.id] || {}).item_status };
  const sel = (txt, cls, tit) => ` <span class="badge ${cls}" style="cursor:pointer" title="${esc(tit)}" onclick="event.stopPropagation();verConferencia('${c.id}')">${esc(txt)}</span>`;
  let h = '';
  if (c.resultado === 'erro') h += sel('Enviada com alerta', 'b-vermelho', 'O arquivo para impressão foi enviado mesmo com problemas: ' + (c.motivo || ''));
  else if (c.checklist) h += sel('Enviada sem gabarito', 'b-cinza', 'Conferido pelo checklist (sem gabarito com medidas ou arquivo que o sistema não lê).');
  else if (c.resultado === 'alerta') h += sel('Conferência com alerta', 'b-ambar', 'A conferência do arquivo deu alertas. Clique para ver.');
  if (c.devolvida) h += sel('Devolvida à designer', 'b-ambar', 'A arte voltou para a designer refazer o arquivo para impressão.');
  else {
    if (c.digital_mudou) h += sel(c.digital_atual ? 'Mudou para digital' : 'Saiu da digital', 'b-vermelho', c.digital_atual ? 'O arquivo foi fechado para o offset, mas agora o item vai para a impressão digital.' : 'O arquivo foi fechado para a digital (folha), mas agora o item vai para o offset.');
    if (c.gabarito_mudou) h += sel('Gabarito mudou', 'b-vermelho', `Conferido com "${c.gabarito_nome}"; agora vale "${c.gabarito_atual_nome}".`);
  }

    ${c.gabarito_mudou && !c.devolvida ? `<div class="alerta erro"><b>O gabarito mudou.</b> O arquivo foi conferido com "${esc(c.gabarito_nome)}", mas com a urgência de agora o gabarito é <b>"${esc(c.gabarito_atual_nome)}"</b>. Devolva para a designer ou combine com o cliente antes de produzir.</div>` : ''}
    ${c.resultado === 'erro' ? `<div class="alerta erro"><b>Enviado mesmo assim.</b> Motivo: ${esc(c.motivo || '')}</div>` : ''}
    ${c.checklist ? `<div class="alerta">Conferido pelo checklist: ${Object.keys(c.checklist).map(k => ({ tamanho: 'tamanho', sangria: 'sangria', seguranca: 'segurança' })[k] || k).join(', ')}.</div>` : ''}
    ${(c.itens || []).length ? (c.itens || []).map(i => `<div class="alerta ${cor[i.nivel] || ''}" style="margin-top:6px;${i.nivel === 'info' ? 'background:var(--verde-bg);color:#007a61' : ''}">${esc(i.texto)}</div>`).join('')

// Botão da linha da pré-impressão: devolve a arte de qualquer item (arquivo errado), com ou sem selo
function devolverItemPre(itemId) {

// Pré-impressão devolve a arte para a designer refazer o arquivo (gabarito mudou, mudou para digital ou saiu dela)
function devolverArtePreImpressao(c) {
  const sug = c.digital_mudou ? (c.digital_atual ? 'O item passou para a impressão digital: monte a cartela na folha SRA3 (ou A4) e feche o arquivo para impressão de novo.'
                                                 : 'O item saiu da digital e vai para o offset: feche o arquivo no gabarito do offset.')
            : c.gabarito_mudou ? `O gabarito mudou de "${c.gabarito_nome}" para "${c.gabarito_atual_nome}": ajuste o arquivo e feche de novo.` : '';
  const m = abrirModal({ titulo: 'Devolver a arte para a designer', corpo: `
    <p class="small" style="margin:0 0 8px">O item volta para a etapa de arte (<b>Aprovado pelo cliente · falta fechar o arquivo</b>). A designer recebe o aviso e envia o arquivo para impressão de novo; o arquivo antigo fica marcado como "Antigo". Se o pedido tem pagamento, o item volta sozinho para a pré-impressão quando ela fechar.</p>
    <label class="campo">O que a designer precisa fazer *<textarea data-mot rows="3" maxlength="400">${esc(sug)}</textarea></label>`,
    rodape: '<button class="btn" data-v>Voltar</button><button class="btn perigo" data-s>Devolver</button>' });

  m.el.querySelector('[data-s]').onclick = async () => {

  };

function badgeUrgencia(u, sempre) {
  if (!u || !u.nivel) return '';
  const prazo = u.aviso_prazo ? ` <span class="badge b-vermelho" title="${esc(u.aviso_prazo)}" style="cursor:help" onclick="event.stopPropagation();toast(this.title, true)">${esc(u.aviso_prazo_curto || 'Só prazo normal')}</span>` : '';
  if (u.nivel === 'normal' && !sempre) return (badgeEntregaQuando(u) + seloDigital(u.digital) + prazo).trim();
  const cls = u.nivel === 'muito_urgente' ? 'b-vermelho' : u.nivel === 'urgente' ? 'b-ambar' : 'b-cinza';
  const txt = (URG_NOME[u.nivel] || u.nivel) + (u.nivel === 'normal' ? '' : ' · produção') + (u.definitiva ? '' : ' (provável)');
  const tit = textoUrgencia(u) + (u.manual ? ` · Marcado à mão por ${u.manual_por_nome || '—'}: ${u.manual_motivo || ''}` : '');
  return `<span class="badge ${cls}" title="${esc(tit)}">${esc(txt)}${u.manual ? ' ✋' : ''}</span>${badgeEntregaQuando(u)}${seloDigital(u.digital)}${prazo}`;
}
// "Entrega hoje / amanhã / atrasada" pela previsão para o cliente (dias corridos)
function badgeEntregaQuando(u) {
  if (!u || u.dias_para_entrega == null) return '';
  const d = Number(u.dias_para_entrega);
  if (d < 0) return ' ' + badge('Entrega atrasada', 'b-vermelho');
  if (d === 0) return ' ' + badge('Entrega hoje', 'b-vermelho');
  if (d === 1) return ' ' + badge('Entrega amanhã', 'b-ambar');

}

// Material cujos gabaritos ativos ainda estão todos com medidas pendentes (devolve o material)
function gabaritoSoPendente(grupoId) {
  const g = gruposGabarito().find(x => x.id === grupoId);
  if (!g) return null;
  const ativos = (g.gabaritos || []).filter(x => x.ativo);
  return ativos.length && ativos.every(x => x.medidas_pendentes) ? g : null;

function textoCondicao(g) {
  const urg = g.cond_urgencias && g.cond_urgencias.length ? g.cond_urgencias.map(u => URG_NOME[u] ? URG_NOME[u].toLowerCase() : u).join(' ou ') : '';
  const q = g.cond_qtd_min != null && g.cond_qtd_max != null ? `de ${num(g.cond_qtd_min)} a ${num(g.cond_qtd_max)} un`
          : g.cond_qtd_min != null ? `a partir de ${num(g.cond_qtd_min)} un` : g.cond_qtd_max != null ? `até ${num(g.cond_qtd_max)} un` : '';
  if (!urg && !q) return 'Sempre';

}

  const marc = (lista, v) => (lista || []).includes(v) ? 'checked' : '';
  const m = abrirModal({ titulo: `${gr.nome || 'Material'} · ${id ? 'gabarito' : 'novo gabarito'}`, largo: true, corpo: `<form id="f-gb">
    <div class="grade g3">
      <label class="campo" style="grid-column:span 2">Nome * <span class="muted">(ex.: Prazo normal acima de 250 un)</span><input type="text" name="nome" maxlength="80" value="${esc(g.nome || '')}"></label>
      <label class="campo">Ordem de teste <span class="muted">(menor primeiro)</span><input type="number" name="prioridade" value="${esc(g.prioridade ?? 100)}"></label>
    </div>
    <h3 style="margin:14px 0 6px">Quando usar</h3>
    <p class="small muted" style="margin:0 0 8px">Deixe tudo em branco para valer sempre. O sistema testa os gabaritos do material pela ordem e usa o primeiro que servir.</p>
    <div class="grade g3">
      <div class="campo">Urgência da produção
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">${['normal', 'urgente', 'muito_urgente'].map(u => `<label class="check" style="margin:0"><input type="checkbox" name="cond_urgencias" value="${u}" ${marc(g.cond_urgencias, u)}> ${URG_NOME[u]}</label>`).join('')}</div></div>
      <label class="campo">Quantidade de (un)<input type="number" min="0" name="cond_qtd_min" value="${esc(g.cond_qtd_min ?? '')}"></label>
      <label class="campo">até (un)<input type="number" min="0" name="cond_qtd_max" value="${esc(g.cond_qtd_max ?? '')}"></label>
      <label class="campo" style="grid-column:1/-1">Quando tiver urgência e quantidade
        <select name="cond_modo"><option value="e" ${g.cond_modo !== 'ou' ? 'selected' : ''}>As duas precisam valer (urgência E quantidade)</option>
          <option value="ou" ${g.cond_modo === 'ou' ? 'selected' : ''}>Basta uma valer (urgência OU quantidade)</option></select></label>
    </div>
    <h3 style="margin:14px 0 6px">Medidas (mm)</h3>
    ${g.medidas_pendentes ? `<div class="alerta" style="margin-bottom:8px">Este gabarito veio da pasta do Drive e ainda está com <b>medidas pendentes</b>: o sistema não sugere ele até alguém salvar as medidas. Ao salvar, ele deixa de ser pendente.</div>` : ''}
    <div class="grade g4">
      <label class="check" style="grid-column:1/-1"><input type="checkbox" name="tamanho_livre" ${g.tamanho_livre && !g.medidas_pendentes ? 'checked' : ''}> Tamanho livre (a medida vem do pedido, como adesivo de recorte e lona)</label>
      <label class="campo">Largura final<input type="text" inputmode="decimal" name="corte_largura_mm" value="${esc(fmtMm(g.corte_largura_mm))}"></label>
      <label class="campo">Altura final<input type="text" inputmode="decimal" name="corte_altura_mm" value="${esc(fmtMm(g.corte_altura_mm))}"></label>
      <label class="campo">Sangria (cada lado)<input type="text" inputmode="decimal" name="sangria_mm" value="${esc(fmtMm(g.sangria_mm))}"></label>
      <label class="campo">Segurança <span class="muted">(para dentro do corte)</span><input type="text" inputmode="decimal" name="seguranca_mm" value="${esc(fmtMm(g.seguranca_mm))}"></label>
    </div>
    <p class="small muted" id="gb-arq" style="margin:4px 0 0"></p>
    <h3 style="margin:14px 0 6px">Arte final</h3>
    <div class="grade g3">
      <div class="campo">Formatos aceitos *
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">${FORMATOS_ARQ.map(([v, n]) => `<label class="check" style="margin:0"><input type="checkbox" name="formatos" value="${v}" ${marc(g.formatos, v)}> ${n}</label>`).join('')}</div></div>
      <label class="campo">Páginas <span class="muted">(vazio = qualquer)</span><input type="number" min="1" max="50" name="paginas" value="${esc(g.paginas ?? '')}"></label>
      <label class="campo">Resolução mínima (dpi)<input type="number" min="30" max="2400" name="dpi_min" value="${esc(g.dpi_min ?? '')}"></label>
      <label class="check" style="grid-column:1/-1"><input type="checkbox" name="ultima_pagina_faca" ${g.ultima_pagina_faca ? 'checked' : ''}> A última página é a faca (contorno de corte)</label>
      <div class="campo" id="gb-faca">Cor da faca
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">${FACA_CORES.map(([v, n]) => `<label class="check" style="margin:0"><input type="checkbox" name="faca_cores" value="${v}" ${marc(g.faca_cores, v)}> ${n}</label>`).join('')}</div></div>
      <div class="campo" style="grid-column:1/-1">Ordem das páginas <span class="muted">(o que é cada página do arquivo, na ordem; vazio = frente e verso). A conferência e o montador usam esta ordem.</span>
        <div data-ordem style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px"></div></div>
    </div>
    <div class="grade g2" style="margin-top:10px">
      ${campoArquivoGabarito(g.arquivo_url)}
      <label class="campo" style="grid-column:1/-1">Instruções para a designer<textarea name="instrucoes" rows="3">${esc(g.instrucoes || '')}</textarea></label>
      ${id ? `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="ativo" ${g.ativo ? 'checked' : ''}> Ativo</label>` : ''}
    </div>
    ${id && g.cliente_nome ? `<p class="small" style="margin:10px 0 0">Gabarito do cliente <b>${esc(g.cliente_nome)}</b>: vale só nos pedidos dele e vem antes dos gerais (o item pede confirmação).</p>` : ''}
    ${id && textoOrigemGabarito(g) ? `<p class="small muted" style="margin:10px 0 0">${textoOrigemGabarito(g)}.</p>` : ''}
    ${id && g.alteracoes ? `<div style="margin-top:8px">${blocoExp('gb-hist-' + id, `Alterações anteriores (${g.alteracoes})`, '<div data-gb-hist class="small muted">Carregando…</div>', false, 'leve')}</div>` : ''}
    </form>`,
    rodape: `${id ? '<button class="btn perigo" data-x style="margin-right:auto">Excluir gabarito</button>' : ''}<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar gabarito</button>` });
  const f = $('#f-gb', m.el), el = f.elements;
  const arqGab = ligarArquivoGabarito(m.el, () => gr.pasta_url || null);
  if (opts.abrirEnvio) setTimeout(() => { const b = m.el.querySelector('[data-env-gab]'); if (b) b.click(); }, 50);
  const bx = m.el.querySelector('[data-x]');
  if (bx) bx.onclick = async () => {
    if (!await confirmar(`Excluir o gabarito "${esc(g.nome)}" de ${esc(gr.nome || 'este material')}? Não dá para desfazer. O arquivo no Drive não é apagado.`, 'Excluir', true)) return;
    try { await api('excluir_gabarito', { id }); await carregarGabaritos(true); m.fechar(); toast('Gabarito excluído.'); recarregar(); } catch (e) {}
  };
  const lista = n => [...f.querySelectorAll(`[name="${n}"]:checked`)].map(c => c.value);
  const sinc = () => {
    const livre = el.tamanho_livre.checked;
    el.corte_largura_mm.disabled = livre; el.corte_altura_mm.disabled = livre;
    $('#gb-faca', m.el).style.display = el.ultima_pagina_faca.checked ? '' : 'none';
    const n = s => Number(String(s || '').replace(',', '.')) || 0;
    const w = n(el.corte_largura_mm.value), h = n(el.corte_altura_mm.value), s = n(el.sangria_mm.value);
    $('#gb-arq', m.el).textContent = !livre && w && h ? `Tamanho do arquivo (com sangria): ${fmtMm(+(w + 2 * s).toFixed(2))} × ${fmtMm(+(h + 2 * s).toFixed(2))} mm` : '';
  };
  ['tamanho_livre', 'ultima_pagina_faca'].forEach(k => el[k].onchange = sinc);
  // ordem das páginas: lista em chips, com "+ página"
  let ordem = Array.isArray(g.paginas_ordem) ? [...g.paginas_ordem] : [];
  const boxOrd = m.el.querySelector('[data-ordem]');
  const desenharOrdem = () => {
    const usados = new Set(ordem.filter(x => x !== 'extra'));
    boxOrd.innerHTML = ordem.map((x, k) => `<span class="badge b-cinza" style="display:inline-flex;gap:6px;align-items:center;font-size:12px">${k + 1}. ${esc(PAGINA_NOME[x] || x)}
        <a href="#" data-rm="${k}" title="Tirar" style="color:inherit;text-decoration:none">×</a></span>`).join('')
      + `<select data-add style="width:auto;padding:3px 6px;font-size:12px"><option value="">+ página</option>${Object.entries(PAGINA_NOME).filter(([v]) => v === 'extra' || !usados.has(v)).map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join('')}</select>`
      + (ordem.length ? ' <a href="#" data-limpa class="small">limpar</a>' : '');
    boxOrd.querySelectorAll('[data-rm]').forEach(a => a.onclick = e => { e.preventDefault(); ordem.splice(+a.dataset.rm, 1); aplicarOrdem(); });
    boxOrd.querySelector('[data-add]').onchange = e => { if (e.target.value) { ordem.push(e.target.value); aplicarOrdem(); } };
    const lp = boxOrd.querySelector('[data-limpa]'); if (lp) lp.onclick = e => { e.preventDefault(); ordem = []; aplicarOrdem(); };
  };
  const aplicarOrdem = () => {
    if (ordem.length) { el.paginas.value = ordem.length; el.ultima_pagina_faca.checked = ordem[ordem.length - 1] === 'faca'; sinc(); }
    desenharOrdem();
  };
  desenharOrdem();
  const dh = m.el.querySelector('details[data-exp^="gb-hist-"]');
  const carregarHist = async () => {
    const box = m.el.querySelector('[data-gb-hist]'); if (!box || box.dataset.ok) return; box.dataset.ok = 1;
    try {
      const r = await api('gabarito_historico', { id }, true);
      box.innerHTML = (r.historico || []).map(h => `<div style="padding:6px 0;border-top:1px solid var(--linha-2)">
          <b>${dataHora(h.em)}</b>${h.por_nome ? ' · ' + esc(h.por_nome) : ''}${h.motivo ? ' — ' + esc(h.motivo) : ''}
          <div>Antes: ${esc(h.dados.nome)} · ${esc(textoCondicao(h.dados))} · ${textoMedidas(h.dados)}${h.dados.medidas_pendentes ? '' : ` · sangria ${fmtMm(h.dados.sangria_mm)} · segurança ${fmtMm(h.dados.seguranca_mm)} mm`}</div></div>`).join('') || 'Nenhuma alteração.';
    } catch (e) { box.textContent = 'Não foi possível carregar.'; }
  };
  if (dh) { dh.addEventListener('toggle', () => { if (dh.open) carregarHist(); }); if (dh.open) carregarHist(); }
  ['corte_largura_mm', 'corte_altura_mm', 'sangria_mm'].forEach(k => el[k].oninput = sinc);
  sinc();
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = {
      grupo_id: grupoId, nome: el.nome.value, prioridade: el.prioridade.value,
      cond_urgencias: lista('cond_urgencias'), cond_qtd_min: el.cond_qtd_min.value, cond_qtd_max: el.cond_qtd_max.value, cond_modo: el.cond_modo.value,
      tamanho_livre: el.tamanho_livre.checked, corte_largura_mm: el.corte_largura_mm.value, corte_altura_mm: el.corte_altura_mm.value,
      sangria_mm: el.sangria_mm.value, seguranca_mm: el.seguranca_mm.value,
      formatos: lista('formatos'), paginas: el.paginas.value, dpi_min: el.dpi_min.value,
      ultima_pagina_faca: el.ultima_pagina_faca.checked, faca_cores: el.ultima_pagina_faca.checked ? lista('faca_cores') : [],
      arquivo_url: el.arquivo_url.value, instrucoes: el.instrucoes.value, paginas_ordem: ordem
    };
    if (id) { d.id = id; d.ativo = el.ativo.checked; }
    try { await api('salvar_gabarito', d); await arqGab.depoisDeSalvar(); arqGab.enviado = null; await carregarGabaritos(true); m.fechar(); toast('Gabarito salvo.'); recarregar(); } catch (e) {}
  };
  m.el.querySelector('[data-v]').addEventListener('click', () => arqGab.cancelar && arqGab.cancelar());
}

rota('feriados', async (_p, el) => {
  definirTopoEm(el, 'Feriados', '');
  const r = await api('feriados');
  r.feriados.forEach(f => S.feriados[f.data] = f);
  const TIPO = { nacional:'Nacional', estadual:'Estadual', municipal:'Municipal (Osasco)', facultativo:'Ponto facultativo', emenda:'Emenda' };
  el.innerHTML = `<div class="painel"><p class="small muted" style="margin-top:0">Usado para calcular o 5º dia útil do repasse de comissões. Marque "conta como feriado" nos dias em que a GVH não abre.</p>
    <form id="f-fer" class="linha-form" style="margin-bottom:16px">
      <label class="campo">Data<input type="date" name="data" required></label><label class="campo" style="flex:2">Nome<input type="text" name="nome" required></label>
      <label class="campo">Tipo<select name="tipo">${Object.entries(TIPO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="check" style="flex:0;min-width:auto;padding-bottom:9px"><input type="checkbox" name="conta_como_feriado" value="true" checked> Conta como feriado</label>
      <button class="btn prim" style="flex:0">Salvar</button></form>
    <div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Conta como feriado</th><th></th></tr></thead><tbody>
    ${r.feriados.map(f => `<tr><td class="num">${data(f.data)}</td><td>${esc(f.nome)}</td><td>${esc(TIPO[f.tipo] || f.tipo)}</td>
      <td><button class="btn link peq" onclick="alternarFeriado('${f.data}')">${f.conta_como_feriado ? 'Sim' : 'Não'}</button></td>
      <td class="dir"><button class="btn link peq" onclick="excluirFeriado('${f.data}')">Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $('#f-fer').onsubmit = async e => { e.preventDefault(); const d = formDados(e.target); d.conta_como_feriado = !!d.conta_como_feriado; await api('feriados', { salvar: d }); toast('Feriado salvo.'); recarregar(); };
});
async function alternarFeriado(dt) { const f = S.feriados[dt]; await api('feriados', { salvar: { ...f, conta_como_feriado: !f.conta_como_feriado } }); recarregar(); }
async function excluirFeriado(d) { if (!await confirmar('Excluir este feriado?', 'Excluir', true)) return; await api('feriados', { excluir: d }); recarregar(); }

/* ---------- USUÁRIOS (diretor) ---------- */
rota('usuarios', async (_p, el) => {
  definirTopoEm(el, 'Usuários', `<button class="btn prim" onclick="modalUsuario(null)">Novo usuário</button>`);
  const r = await api('listar_usuarios'); vistaDoEl(el).dados = r;
  el.innerHTML = `<div class="painel"><div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Comissão</th><th>Gabaritos</th><th></th></tr></thead><tbody>
    ${r.usuarios.map(u => `<tr class="clicavel" onclick="modalUsuario('${u.id}')"><td>${tagPessoa(u.nome, u.cor)}</td><td>${esc(u.email)}</td><td>${esc(u.perfil_nome)}</td>
      <td>${u.recebe_comissao ? num(u.percentual_comissao) + '%' : 'Não recebe (economizada)'}</td><td>${u.pode_gabaritos ? 'Pode alterar' : '<span class="muted">Só consulta</span>'}</td><td>${u.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}
    </tbody></table></div></div>`;
});
function modalUsuario(id) {
  const u = id ? S.vistaAtual.dados.usuarios.find(x => x.id === id) : { ativo: true, recebe_comissao: true, percentual_comissao: 5, perfil: 'vendedor' };
  const m = abrirModal({ titulo: id ? u.nome : 'Novo usuário', corpo: `<form id="f-usu" class="grade g2">
    <label class="campo">Nome<input type="text" name="nome" value="${esc(u.nome || '')}"></label>
    <label class="campo">E-mail<input type="email" name="email" value="${esc(u.email || '')}"></label>
    <label class="campo">Perfil<select name="perfil">${S.vistaAtual.dados.perfis.map(p => `<option value="${p.codigo}" ${p.codigo === u.perfil ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label class="campo">${id ? 'Nova senha (deixe em branco para manter)' : 'Senha'}<input type="text" name="senha" autocomplete="off"></label>
    <label class="campo">Comissão (%)<input type="number" step="0.01" name="percentual_comissao" value="${esc(u.percentual_comissao)}"></label>
    <div class="campo" style="grid-column:1/-1">
      <span>Cor nas etiquetas <span class="muted">(aparece nas telas de arte)</span></span>
      <input type="hidden" name="cor" id="u-cor" value="${esc(u.cor || '')}">
      <div class="cores" id="u-cores"></div>
      <div id="u-cor-previa" style="margin-top:8px"></div>
    </div>
    <label class="check"><input type="checkbox" name="recebe_comissao" value="true" ${u.recebe_comissao ? 'checked' : ''}> Recebe comissão</label>
    <label class="check"><input type="checkbox" name="ativo" value="true" ${u.ativo ? 'checked' : ''}> Ativo</label>
    <label class="check" style="grid-column:1/-1"><input type="checkbox" name="pode_gabaritos" value="true" ${u.pode_gabaritos ? 'checked' : ''}> Pode incluir, editar e excluir gabaritos</label></form>
    <p class="small muted" style="margin:0">Quem não recebe comissão tem o valor registrado como "comissão economizada". Trocar a senha encerra as sessões abertas desse usuário.</p>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar usuário</button>` });
  // paleta: as cinco primeiras são as cores combinadas da equipe; as demais ficam para quem entrar depois
  const paleta = S.vistaAtual.dados.paleta || [];
  const usadas = new Map((S.vistaAtual.dados.usuarios || []).filter(x => x.cor && x.id !== id).map(x => [x.cor.toUpperCase(), x.nome]));
  const hCor = $('#u-cor', m.el);
  const desenharCores = () => {
    $('#u-cores', m.el).innerHTML = paleta.map(c => {
      const dono = usadas.get(c.toUpperCase());
      return `<button type="button" data-cor="${c}" class="${(hCor.value || '').toUpperCase() === c.toUpperCase() ? 'ativo' : ''}"
        style="background:${c}" title="${dono ? 'Já é a cor de ' + esc(dono) : 'Cor livre'}"></button>`;
    }).join('');
    const nome = $('#f-usu', m.el).elements.nome.value || 'Nome da pessoa';
    const dono = usadas.get((hCor.value || '').toUpperCase());
    $('#u-cor-previa', m.el).innerHTML = (hCor.value ? tagPessoa(nome, hCor.value) : '<span class="small muted">Sem cor escolhida: o sistema escolhe uma ao salvar.</span>')
      + (dono ? `<div class="small" style="color:var(--ambar, #9a6410);margin-top:6px">Atenção: essa cor já é de ${esc(dono)}.</div>` : '');
    $('#u-cores', m.el).querySelectorAll('[data-cor]').forEach(b => b.onclick = () => {
      hCor.value = (hCor.value || '').toUpperCase() === b.dataset.cor.toUpperCase() ? '' : b.dataset.cor;
      desenharCores();
    });
  };
  desenharCores();
  $('#f-usu', m.el).elements.nome.addEventListener('input', desenharCores);
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-usu', m.el)); d.ativo = !!d.ativo; d.recebe_comissao = !!d.recebe_comissao; d.pode_gabaritos = !!d.pode_gabaritos; if (id) d.id = id;
    await api('salvar_usuario', d); m.fechar(); toast('Usuário salvo.'); await carregarBase(); recarregar();
  };
}

</script>
