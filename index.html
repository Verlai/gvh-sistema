/* ---------- ORÇAMENTOS ---------- */
const ORC_NOMES = { aberto:['Em elaboração','b-cinza'], enviado:['Enviado','b-azul'], aceito:['Aprovado pelo cliente','b-verde'], aprovado:['Virou pedido','b-azul'], recusado:['Recusado','b-vermelho'], expirado:['Expirado','b-ambar'] };
const podeExcluirOrc = o => o && o.criado_por === S.usuario.id && !o.pedido_id;

// ações usadas na lista e na tela do orçamento (sempre com os dados salvos no banco)
async function linkOrcamento(id) { const o = (await api('obter_orcamento', { id })).orcamento; if (!o) return toast('Orçamento não encontrado.', true); modalLinkOrcamento(o, o.cliente); }
async function imprimirOrcamentoId(id) { const o = (await api('obter_orcamento', { id })).orcamento; if (!o) return toast('Orçamento não encontrado.', true); imprimirOrcamento(o); }
async function excluirOrcamento(id, numero) {
  if (!await confirmar(`Excluir o orçamento ${numero}? Ele some das listas e o link do cliente deixa de funcionar. O número não é reaproveitado.`, 'Excluir orçamento', true)) return false;
  await api('excluir_orcamento', { id }); toast(`Orçamento ${numero} excluído.`);
  descartarVista('orcamento/' + id);
  return true;
}
async function converterOrcamento(id) {
  const o = (await api('obter_orcamento', { id })).orcamento;
  if (!o) return toast('Orçamento não encontrado.', true);
  if (o.pedido_id) return toast('Este orçamento já virou pedido.', true);
  if (o.cliente_id) return modalConversao(o, o.cliente);
  if (!pode('cadastra_clientes')) return toast('Pedido exige cliente cadastrado. Peça a quem cadastra clientes.', true);
  if (!await confirmar('Pedido exige cliente cadastrado. Vamos cadastrar este cliente agora e depois criar o pedido.', 'Cadastrar cliente')) return;
  modalCliente(null, c => modalConversao(o, c), o.cliente_nome || '');
}
function modalConversao(o, cliente) {
  const itens = o.itens || [];
  let coletar, ent;
  const prev0 = o.prazo_dias_uteis ? somaDiasUteis(hoje(), Number(o.prazo_dias_uteis)) : '';
  const m = abrirModal({ titulo: `Transformar o orçamento ${o.numero} em pedido`, largo: true, corpo: `
    <p style="margin:0 0 12px">Cliente: <b>${esc(cliente.nome_fantasia || cliente.nome)}</b> · Total: <b>${brl(o.valor_total)}</b></p>
    <h3 style="margin:0 0 8px">Status inicial de cada item</h3>
    <div class="tabela-wrap"><table><thead><tr><th>Produto</th><th class="dir">Qtd.</th><th class="dir">Total</th><th style="min-width:170px">Status inicial</th></tr></thead><tbody>
      ${itens.map((i, k) => `<tr><td><b>${esc(i.descricao || '')}</b>${i.observacao ? `<div class="small muted">${esc(i.observacao)}</div>` : ''}</td><td class="dir num">${num(i.quantidade)}</td><td class="dir num">${brl(i.valor_total)}</td>
        <td><select data-st="${k}">${opcoesStatusInicial('arte_a_fazer')}</select></td></tr>`).join('')}</tbody></table></div>
    <div class="small muted" style="margin-top:4px">Item que já começa na Pré-impressão precisa de pagamento, de forma Boleto / Paga na retirada ou da autorização "produzir sem pagamento".</div>
    <div class="grade g2" style="margin-top:14px">
      <label class="campo">Previsão de entrega *<input type="date" id="conv-prev" required value="${prev0}">
        ${o.prazo_dias_uteis ? `<span class="small muted">Prazo do orçamento: ${esc(textoPrazo(o.prazo_dias_uteis))}. Confira a data.</span>` : ''}</label>
    </div>
    <div class="grade g2" style="margin-top:8px" id="conv-ent">${htmlEntrega({ forma_entrega: o.forma_entrega, endereco_entrega: o.endereco_entrega })}</div>
    ${o.observacoes_entrega ? `<div class="small" style="margin-top:6px"><span class="muted">Observações da entrega:</span> ${esc(o.observacoes_entrega)}</div>` : ''}
    ${o.observacoes ? `<div class="small" style="margin-top:4px"><span class="muted">Observação geral:</span> ${esc(o.observacoes)}</div>` : ''}
    <h3 style="margin:16px 0 8px">Forma de Pagamento *</h3><div id="conv-pag">${htmlFormaPagamento({ autorizar: true })}</div>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn escuro" data-s>Criar pedido</button>`,
    aoAbrir: el => {
      const inicial = o.forma_pagamento ? { forma: o.forma_pagamento, obs: o.forma_pagamento_obs, detalhe: o.pagamento_detalhe } : null;
      coletar = ligarFormaPagamento(el.querySelector('#conv-pag'), () => Number(o.valor_total || 0), () => el.querySelector('#conv-prev').value, inicial);
      el.querySelector('#conv-prev').onchange = () => coletar.atualizar();
      ent = ligarEntrega(el.querySelector('#conv-ent'));
      if (!o.forma_entrega) ent.definirCliente(cliente);
    } });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  const bt = m.el.querySelector('[data-s]');
  bt.onclick = async () => {
    const prev = $('#conv-prev', m.el).value; if (!prev) return toast('Informe a previsão de entrega.', true);
    let pag; try { pag = await coletar(); } catch (e) { if (e.message !== 'upload' && e.message !== 'tamanho') toast(e.message, true); return; }
    const status_itens = itens.map((_, k) => m.el.querySelector(`[data-st="${k}"]`).value);
    bt.disabled = true;
    try {
      const r = await api('converter_orcamento', { id: o.id, cliente_id: o.cliente_id ? undefined : cliente.id, status_itens,
        data_prevista_entrega: prev, forma_entrega: ent.forma(), endereco_entrega: ent.endereco(), recebimentos: pag.recebimentos,
        forma_pagamento: pag.forma_pagamento, forma_pagamento_obs: pag.forma_pagamento_obs,
        autoriza_sem_pagamento: pag.autoriza_sem_pagamento, condicoes_pagamento: pag.resumo });
      m.fechar(); toast(`Pedido ${r.numero} criado.`); descartarVista('orcamento/' + o.id); location.hash = '#/pedido/' + r.id;
    } finally { bt.disabled = false; }
  };
}

rota('orcamentos', async (_p, el) => {
  definirTopoEm(el, 'Orçamentos', `<a class="btn prim" href="#/orcamento/novo">Novo orçamento</a>`);
  el.innerHTML = `<div class="painel filtros"><div class="linha-form">
      <label class="campo" style="flex:2">Buscar<input type="search" id="o-busca" placeholder="Número ou cliente"></label>
      <label class="campo">Situação<select id="o-status"><option value="">Em andamento</option><option value="todos">Todas</option><option value="aberto">Em elaboração</option><option value="enviado">Enviado</option><option value="aceito">Aprovado pelo cliente</option><option value="aprovado">Virou pedido</option><option value="recusado">Recusado</option><option value="expirado">Expirado</option></select></label>
      <label class="campo">Vendedor<select id="o-vend"><option value="">Todos</option>${S.base.vendedores.map(v => `<option value="${v.id}">${esc(v.nome)}</option>`).join('')}</select></label>
    </div><div class="small muted" style="margin-top:6px">Em andamento = em elaboração, enviados e aprovados pelo cliente. A busca procura em todos.</div></div><div class="painel" id="o-lista"></div>`;
  const lista = {};
  const botoes = o => o.pedido_id
    ? `<a class="btn peq" href="#/pedido/${o.pedido_id}">Ver pedido${o.pedido_numero ? ' ' + esc(o.pedido_numero) : ''}</a> <button class="btn peq" data-acao="imprimir" data-id="${o.id}">Imprimir</button>`
    : `<button class="btn peq" data-acao="link" data-id="${o.id}">Link para o cliente</button>
       <button class="btn peq" data-acao="imprimir" data-id="${o.id}">Imprimir</button>
       <button class="btn peq escuro" data-acao="converter" data-id="${o.id}">Transformar em pedido</button>
       ${podeExcluirOrc(o) ? `<button class="btn peq perigo" data-acao="excluir" data-id="${o.id}">Excluir</button>` : ''}`;
  const buscar = async () => {
    const r = await api('listar_orcamentos', { busca: $('#o-busca', el).value, status: $('#o-status', el).value, vendedor_id: $('#o-vend', el).value, limite: limLista('orcamentos') });
    r.orcamentos.forEach(o => lista[o.id] = o);
    $('#o-lista', el).innerHTML = r.orcamentos.length ? `<div class="tabela-wrap"><table><thead><tr><th>Orçamento</th><th>Cliente</th><th>Vendedor</th><th>Validade</th><th>Situação</th><th class="dir">Total</th><th>Ações</th></tr></thead><tbody>
      ${r.orcamentos.map(o => `<tr class="clicavel" data-abrir="${o.id}"><td><b>${esc(o.numero)}</b><div class="small muted">${data(o.created_at)}</div></td>
        <td>${esc(o.cliente_nome || '—')}${o.cliente_generico ? ' ' + badge('Sem cadastro', 'b-ambar') : ''}</td><td>${esc(o.vendedor_nome || '')}</td><td>${data(o.validade)}${o.vencido ? ' ' + badge('Vencido', 'b-vermelho') : o.validade === hoje() && ['aberto','enviado'].includes(o.status) ? ' ' + badge('Vence hoje', 'b-ambar') : ''}</td>
        <td>${badge(...(ORC_NOMES[o.status] || [o.status, 'b-cinza']))}</td><td class="dir num">${brl(o.valor_total)}</td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap;min-width:230px">${botoes(o)}</div></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="vazio">Nenhum orçamento encontrado.</div>';
    $('#o-lista', el).insertAdjacentHTML('beforeend', rodapeLista('orcamentos', r.orcamentos.length, r.total, 'orçamento(s)'));
    ligarMais($('#o-lista', el), 'orcamentos', buscar);
    $('#o-lista', el).querySelectorAll('[data-abrir]').forEach(tr => tr.onclick = e => { if (!e.target.closest('button,a')) location.hash = '#/orcamento/' + tr.dataset.abrir; });
    $('#o-lista', el).querySelectorAll('[data-acao]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const o = lista[b.dataset.id];
      b.disabled = true;
      try {
        if (b.dataset.acao === 'link') await linkOrcamento(o.id);
        else if (b.dataset.acao === 'imprimir') await imprimirOrcamentoId(o.id);
        else if (b.dataset.acao === 'converter') await converterOrcamento(o.id);
        else if (b.dataset.acao === 'excluir' && await excluirOrcamento(o.id, o.numero)) buscar();
      } catch {} finally { b.disabled = false; }
    });
  };
  const filtrar = () => { zerarLista('orcamentos'); buscar(); };
  let t; $('#o-busca', el).oninput = () => { clearTimeout(t); t = setTimeout(filtrar, 350); }; $('#o-status', el).onchange = $('#o-vend', el).onchange = filtrar;
  await buscar();
});

rota('orcamento', async (id, el) => {
  const novo = id === 'novo';
  const o = novo ? { itens: [], desconto: 0, frete: 0, status: 'aberto', validade: somaDias(hoje(), 7) } : (await api('obter_orcamento', { id })).orcamento;
  if (!o) throw new Error('Orçamento não encontrado (pode ter sido excluído).');
  const convertido = o.status === 'aprovado';
  const aceito = o.status === 'aceito';
  const liberado = aceito && (S.cache.editarAceito || {})[o.id];
  const travado = convertido || (aceito && !liberado);
  definirTopoEm(el, novo ? 'Novo orçamento' : `Orçamento ${o.numero}`, `<a class="btn" href="#/orcamentos">Voltar</a>
    ${!novo && !convertido ? `<button class="btn" id="o-link">Link para o cliente</button>` : ''}
    ${!novo ? `<button class="btn" id="o-imprimir">Imprimir orçamento</button>` : ''}
    ${!novo && podeExcluirOrc(o) ? `<button class="btn perigo" id="o-excluir">Excluir orçamento</button>` : ''}
    ${!novo && !convertido ? `<button class="btn escuro" id="o-converter">Transformar em pedido</button>` : ''}
    ${o.pedido_id ? `<a class="btn" href="#/pedido/${o.pedido_id}">Ver pedido</a>` : ''}`);
  let cliente = o.cliente || null, pegarItens;
  el.innerHTML = `
    ${convertido ? '<div class="alerta" style="margin-bottom:16px">Este orçamento já virou pedido e não pode mais ser alterado.</div>' : ''}
    ${aceito ? `<div class="alerta" style="margin-bottom:16px;background:var(--verde-bg);color:var(--grafite)">
        <b>Aprovado pelo cliente</b> · ${esc(o.aprovado_cliente_nome || '')} em ${dataHoraLonga(o.aprovado_cliente_em)}
        ${o.aprovado_cliente_comentario ? `<div style="margin-top:4px"><span class="muted">Comentário do cliente:</span> ${esc(o.aprovado_cliente_comentario)}</div>` : ''}
        ${!liberado ? `<div style="margin-top:8px"><button type="button" class="btn peq" id="o-editar-aceito">Editar orçamento</button> <span class="small muted">Se for alterado, o cliente precisa aprovar de novo.</span></div>` : '<div class="small" style="margin-top:6px"><b>Ao salvar, a aprovação do cliente será desfeita.</b></div>'}</div>` : ''}
    <div class="painel"><div class="painel-cab"><h2>Cliente</h2></div>
      <label class="campo busca-box">Buscar cliente<input type="search" id="o-cli" placeholder="Nome, fantasia, CPF/CNPJ" autocomplete="off" ${travado ? 'disabled' : ''}></label>
      <label class="campo" id="o-cli-nome-box" style="margin-top:10px">Ou apenas o nome do cliente (sem cadastro)<input type="text" id="o-cli-nome" value="${esc(o.cliente_nome || '')}" ${travado ? 'disabled' : ''}></label>
      <div id="o-cli-esc" style="margin-top:10px"></div></div>
    <div class="painel"><div class="painel-cab"><h2>Itens</h2></div><div id="o-itens"></div>
      <div class="grade g4" style="margin-top:14px">
        <label class="campo">Desconto (R$)<input type="number" step="0.01" id="o-desc" value="${esc(o.desconto)}"></label>
        <label class="campo">Frete (R$)<input type="number" step="0.01" id="o-frete" value="${esc(o.frete)}"></label>
        <div></div><div class="totais" style="margin:0"><span class="muted small">Total</span><b class="num" id="o-total"></b></div></div></div>
    <div class="painel"><form id="f-orc" class="grade g3">
      <label class="campo">Validade<input type="date" name="validade" value="${esc(o.validade || '')}"></label>
      <label class="campo">Situação<select name="status" ${travado ? 'disabled' : ''}>${[['aberto','Em elaboração'],['enviado','Enviado ao cliente'],['recusado','Recusado'],['expirado','Expirado']].map(([v, n]) => `<option value="${v}" ${o.status === v ? 'selected' : ''}>${n}</option>`).join('')}${convertido ? '<option value="aprovado" selected>Virou pedido</option>' : ''}${aceito && !liberado ? '<option value="aceito" selected>Aprovado pelo cliente</option>' : ''}</select></label>
      <label class="campo">Prazo (dias úteis) <span class="muted small">— opcional</span><input type="number" min="1" max="365" name="prazo_dias_uteis" value="${esc(o.prazo_dias_uteis || '')}" placeholder="Ex.: 5"></label>
      <div class="small muted" style="grid-column:1/-1;margin-top:4px"><b>Entrega</b></div>
      ${htmlEntrega(o)}
      <label class="campo" style="grid-column:1/-1">Observações da entrega <span class="muted">(aparecem no orçamento do cliente)</span><textarea name="observacoes_entrega">${esc(o.observacoes_entrega || '')}</textarea></label>
    </form></div>
    <div class="painel"><div class="painel-cab"><h2>Forma de Pagamento</h2><span class="small muted">Opcional no orçamento${o.condicoes_pagamento && !o.forma_pagamento ? ` · antes: ${esc(o.condicoes_pagamento)}` : ''}</span></div>
      <div id="o-pag">${htmlFormaPagamento({ orcamento: true })}</div></div>
    <div class="painel"><label class="campo">Observação geral <span class="muted small">(aparece para o cliente)</span><textarea id="o-obs-geral" ${travado ? 'disabled' : ''}>${esc(o.observacoes || '')}</textarea></label></div>
    ${!travado ? `<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn prim" id="o-salvar">Salvar orçamento</button></div>` : ''}`;
  const entOrc = ligarEntrega($('#f-orc', el));
  const mostrarCli = c => { cliente = c; if (c && !travado) entOrc.definirCliente(c); $('#o-cli-esc', el).innerHTML = c ? `<b>${esc(c.nome_fantasia || c.nome)}</b> <span class="muted">${esc(fmtDoc(c.cpf_cnpj))}</span>${!travado ? ' <button type="button" class="btn link peq" id="o-cli-limpar">Trocar</button>' : ''}${c.observacoes ? `<div class="alerta" style="margin-top:6px"><b>Observação do cliente:</b> ${esc(c.observacoes)}</div>` : ''}` : '<span class="muted small">Nenhum cliente cadastrado escolhido.</span>'; $('#o-cli', el).value = '';
    $('#o-cli-nome-box', el).classList.toggle('hidden', !!c); if (c) $('#o-cli-nome', el).value = '';
    const lp = $('#o-cli-limpar', el); if (lp) lp.onclick = () => mostrarCli(null); };
  mostrarCli(cliente); ligarBuscaCliente($('#o-cli', el), mostrarCli);
  const totOrc = () => (pegarItens ? pegarItens() : o.itens).reduce((s, i) => s + Number(i.valor_total || 0), 0) - Number($('#o-desc', el).value || 0) + Number($('#o-frete', el).value || 0);
  const tot = () => { $('#o-total', el).textContent = brl(totOrc()); };
  pegarItens = editorItens($('#o-itens', el), o.itens, { aoMudar: tot });
  const pagOrc = ligarFormaPagamento($('#o-pag', el), totOrc, () => '', { forma: o.forma_pagamento, obs: o.forma_pagamento_obs, detalhe: o.pagamento_detalhe });
  if (travado) $$('#o-itens input, #o-itens select, #o-itens button, #f-orc input, #f-orc textarea, #f-orc button, #o-pag input, #o-pag button, #o-desc, #o-frete, #o-cli, #o-cli-nome', el).forEach(e => e.disabled = true);
  if ($('#o-editar-aceito', el)) $('#o-editar-aceito', el).onclick = () => { (S.cache.editarAceito ||= {})[o.id] = true; renderVista(S.vistaAtual); };
  $('#o-desc', el).oninput = $('#o-frete', el).oninput = tot; tot();
  const salvar = async () => {
    if (pegarItens.incompletos()) { toast('Há item sem categoria, produto, quantidade ou total. Complete ou remova a linha.', true); throw new Error('itens'); }
    let pag; try { pag = await pagOrc(); } catch (e) { toast(e.message, true); throw e; }
    const d = { ...formDados($('#f-orc', el)), observacoes: $('#o-obs-geral', el).value, cliente_id: cliente?.id || '', cliente_nome: cliente ? '' : $('#o-cli-nome', el).value.trim(), itens: pegarItens(), desconto: $('#o-desc', el).value, frete: $('#o-frete', el).value,
      forma_pagamento: pag?.forma_pagamento || '', forma_pagamento_obs: pag?.forma_pagamento_obs || '', pagamento_detalhe: pag?.pagamento_detalhe || null,
      condicoes_pagamento: pag ? pag.resumo : '' };
    if (!d.cliente_id && !d.cliente_nome) { toast('Escolha um cliente ou informe o nome dele.', true); throw new Error('cliente'); }
    if (!novo) d.id = o.id;
    if (d.status === 'aceito') d.status = 'aberto';
    const r = await api('salvar_orcamento', d); toast(`Orçamento ${r.numero} salvo.`);
    if (S.cache.editarAceito) delete S.cache.editarAceito[o.id];
    return r;
  };
  // botão do topo: liga pelo próprio elemento guardado no topo (funciona mesmo depois de sair e voltar para a tela)
  const noTopo = sel => (vistaDoEl(el).topo?.nos || []).find(n => n.matches && n.matches(sel));
  const acao = (sel, fn) => { const b = noTopo(sel); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch {} finally { b.disabled = false; } }; };
  const salvarSeEditavel = async () => { if (!travado) await salvar(); };
  if ($('#o-salvar', el)) $('#o-salvar', el).onclick = async () => {
    const b = $('#o-salvar', el); b.disabled = true;
    try { await salvar(); descartarVista(chaveDe(vistaDoEl(el)) || chaveRota()); location.hash = '#/orcamentos'; } catch {} finally { b.disabled = false; }
  };
  acao('#o-link', async () => { await salvarSeEditavel(); await linkOrcamento(o.id); });
  acao('#o-imprimir', async () => { await salvarSeEditavel(); await imprimirOrcamentoId(o.id); });
  acao('#o-converter', async () => { await salvarSeEditavel(); await converterOrcamento(o.id); });
  acao('#o-excluir', async () => { if (await excluirOrcamento(o.id, o.numero)) location.hash = '#/orcamentos'; });
});

const dataHoraLonga = v => v ? new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }).replace(',', ' às') : '—';
const linkPublicoOrc = chave => location.origin + location.pathname + '#/o/' + chave;
function modalLinkOrcamento(o, cliente) {
  const link = linkPublicoOrc(o.chave);
  const tel = cliente ? String(cliente.whatsapp || (cliente.telefone_whatsapp ? cliente.telefone : '') || '').replace(/\D/g, '') : '';
  const nome = cliente ? (cliente.nome_fantasia || cliente.nome) : (o.cliente_nome || '');
  const texto = `Olá${nome ? ', ' + nome.split(' ')[0] : ''}! Segue o orçamento nº ${o.numero} da Gráfica Venda Hoje. Você pode conferir e aprovar por este link: ${link}`;
  const m = abrirModal({ titulo: `Link do orçamento ${o.numero}`, corpo: `
    <p style="margin:0 0 10px">O cliente abre o orçamento sem precisar de login e aprova informando o nome. A aprovação (quem, data e hora) aparece aqui no orçamento e no Início.</p>
    <div style="display:flex;gap:6px"><input type="text" readonly value="${esc(link)}" id="lk-url" style="flex:1"><button class="btn" id="lk-copiar">Copiar</button></div>
    ${o.validade ? `<p class="small muted" style="margin:8px 0 0">Válido até ${data(o.validade)}. Depois disso o cliente não consegue mais aprovar.</p>` : ''}`,
    rodape: `<button class="btn" data-v>Fechar</button><a class="btn prim" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent(texto)}">Enviar pelo WhatsApp</a>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('#lk-copiar').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link copiado.'); } catch { $('#lk-url', m.el).select(); } };
}

/* validação de CPF / CNPJ (inclusive CNPJ alfanumérico) no navegador — o banco valida de novo */
function docValido(v) {
  const d = String(v || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  const dv = (base, pesos) => { const s = base.split('').reduce((t, ch, k) => t + (ch.charCodeAt(0) - 48) * pesos[k], 0); const r = s % 11; return r < 2 ? 0 : 11 - r; };
  if (/^\d{11}$/.test(d)) {
    if (/^(\d)\1{10}$/.test(d)) return null;
    const c = (n) => { let s = 0; for (let k = 0; k < n; k++) s += Number(d[k]) * (n + 1 - k); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
    return c(9) === Number(d[9]) && c(10) === Number(d[10]) ? 'PF' : null;
  }
  if (/^[0-9A-Z]{12}\d{2}$/.test(d)) {
    if (/^(\d)\1{13}$/.test(d)) return null;
    const p1 = [5,4,3,2,9,8,7,6,5,4,3,2], p2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
    return dv(d.slice(0, 12), p1) === Number(d[12]) && dv(d.slice(0, 13), p2) === Number(d[13]) ? 'PJ' : null;
  }
  return null;
}

async function salvarLinhaProd(id, enviar) {
  const tr = $(`tr[data-item="${id}"]`); const d = { id };
  $$('[data-c]', tr).forEach(el => d[el.dataset.c] = el.value);
  if (d.custo === '') delete d.custo;
  if (enviar && (!d.fornecedor_id || !d.prazo_producao || !d.codigo_producao.trim())) return toast('Preencha fornecedor, previsão de produção e código do fornecedor.', true);
  await api('salvar_item', d);
  if (enviar) await api('mudar_status_itens', { itens: [id], status: 'em_producao' });
  toast(enviar ? 'Item enviado para produção.' : 'Dados salvos.'); recarregar();
}
function modalItemProd(id) {

rota('expedicao', async (_p, el) => {
  definirTopoEm(el, 'Expedição e entrega', `<button class="btn" onclick="recarregar()">Atualizar</button>`);
  const r = await api('listar_itens', { status: ['despachado','expedicao','em_transporte','aguardando_retirada'] });
  const peds = {};
  r.itens.forEach(i => (peds[i.pedido_id] ||= { id: i.pedido_id, numero: i.pedido_numero, cliente: i.cliente_nome, obs: i.cliente_obs, forma: i.forma_entrega, itens: [] }).itens.push(i));
  const colunas = [
    ['despachado', 'Despachados', 'Saiu do fornecedor e está vindo para o balcão.'],
    ['expedicao', 'No balcão', 'Material chegou da produção.'],
    ['em_transporte', 'Em transporte', 'Saiu para o endereço do cliente.'],
    ['aguardando_retirada', 'Aguardando retirada', 'Cliente vem buscar no balcão.']
  ];
  const cartaoDespachado = p => {
    const its = p.itens.filter(i => i.status === 'despachado');
    const pode = podeStatus('expedicao');
    const acabPendente = i => i.precisa_acabamento && !i.acabamento_iniciado_em;
    const normais = its.filter(i => !acabPendente(i));
    return `<div class="painel" style="padding:14px;margin:0 0 10px">
      <div style="display:flex;justify-content:space-between;gap:8px"><a href="#/pedido/${p.id}"><b>${esc(p.numero)}</b></a>${badge(p.forma === 'entrega' ? 'Entrega' : 'Retirada', p.forma === 'entrega' ? 'b-azul' : 'b-cinza')}</div>
      <div>${esc(p.cliente)}</div>
      <ul style="margin:8px 0;padding-left:18px" class="small">${its.map(i => `<li style="margin-bottom:6px">${esc(i.descricao)} · ${num(i.quantidade)} un
        ${acabPendente(i) ? `<div>${badge('Precisa de acabamento', 'b-azul')} ${esc(i.acabamento_por || '')}</div>
          ${pode ? `<button class="btn prim peq" style="margin-top:4px" onclick="moverItensPedido('${i.id}','em_producao')">Chegou · vai para acabamento</button>` : ''}` : ''}</li>`).join('')}</ul>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${pode && normais.length ? `<button class="btn prim peq" onclick="moverItensPedido('${normais.map(i => i.id).join(',')}','expedicao')">Chegou no balcão${its.length > normais.length ? ` (${normais.length})` : ''}</button>` : ''}
      ${podeStatus('despachado') ? `<button class="btn peq" onclick="naoChegou('${its.map(i => i.id).join(',')}')">Não chegou</button>` : ''}</div>
    </div>`;
  };
  const cartao = (p, etapa) => {
    if (etapa === 'despachado') return cartaoDespachado(p);
    const its = p.itens.filter(i => i.status === etapa);
    const prox = etapa === 'expedicao' ? (p.forma === 'entrega' ? ['em_transporte', 'Saiu para entrega'] : ['aguardando_retirada', 'Avisar retirada']) : ['entregue', 'Marcar como entregue'];
    return `<div class="painel" style="padding:14px;margin:0 0 10px">
      <div style="display:flex;justify-content:space-between;gap:8px"><a href="#/pedido/${p.id}"><b>${esc(p.numero)}</b></a>${badge(p.forma === 'entrega' ? 'Entrega' : 'Retirada', p.forma === 'entrega' ? 'b-azul' : 'b-cinza')}</div>
      <div>${esc(p.cliente)}</div>
      ${p.obs ? `<div class="alerta small" style="margin-top:6px;padding:6px 10px">${esc(p.obs)}</div>` : ''}
      <ul style="margin:8px 0;padding-left:18px" class="small">${its.map(i => `<li>${esc(i.descricao)} · ${num(i.quantidade)} un</li>`).join('')}</ul>
      ${podeStatus(prox[0]) ? `<button class="btn ${prox[0] === 'entregue' ? 'prim' : ''} peq" onclick="moverItensPedido('${its.map(i => i.id).join(',')}','${prox[0]}')">${prox[1]}</button>` : ''}
    </div>`;
  };
  el.innerHTML = `<div class="grade g4">${colunas.map(([k, t, d]) => {
    const lista = Object.values(peds).filter(p => p.itens.some(i => i.status === k));
    return `<div><h2 style="margin-bottom:2px">${t} <span class="badge b-cinza">${lista.length}</span></h2><p class="small muted" style="margin:0 0 10px">${d}</p>
      ${lista.map(p => cartao(p, k)).join('') || '<div class="vazio painel">Nada aqui.</div>'}</div>`;
  }).join('')}</div>`;
});
async function naoChegou(ids) {
  if (!confirm('Voltar estes itens para "Em produção"? Use quando o material não chegou no dia.')) return;
  await api('mudar_status_itens', { itens: ids.split(','), status: 'em_producao', nao_chegou: true });
  toast('Itens voltaram para Em produção.'); recarregar();
}
async function moverItensPedido(ids, status) { await api('mudar_status_itens', { itens: ids.split(','), status }); toast(`${nomeStatusItem(status)}.`); recarregar(); }

    <p style="margin:0 0 12px">${ids.length > 1 ? `${ids.length} pagamentos` : '1 pagamento'} · <b>${brl(soma)}</b>. A parcela volta a ficar em aberto, a comissão é estornada e o motivo aparece para o vendedor no pedido.</p>

    rodape: `<button class="btn" data-v>Voltar</button><button class="btn perigo" data-s>Devolver</button>` });

}

rota('comissoes', async (_p, el) => {
  definirTopoEm(el, 'Comissões', `<button class="btn" onclick="recarregar()">Atualizar</button>`);
  const visao = S.cache.visaoComissao || 'mes';
  const abasVisao = `<div class="chips" style="margin-bottom:14px"><button class="chip ${visao === 'mes' ? 'ativo' : ''}" data-visao="mes">Por mês</button><button class="chip ${visao === 'pedidos' ? 'ativo' : ''}" data-visao="pedidos">Por pedido</button></div>`;
  const ligarVisao = () => $$('[data-visao]').forEach(b => b.onclick = () => { S.cache.visaoComissao = b.dataset.visao; recarregar(); });
  if (visao === 'pedidos') { await comissoesPorPedido(el, abasVisao); ligarVisao(); return; }
  const comp = S.cache.compComissao || hoje().slice(0, 7);
  const r = await api('listar_comissoes', { competencia: comp + '-01' });
  const nomeMes = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const doMes = r.fechamentos.filter(x => x.competencia === r.competencia);

function modalCategoria(id, aoSalvar) {
  const c = id ? S.base.categorias.find(x => x.id === id) : { ativo: true, apelidos: [] };
  const ger = pode('gerencia_cadastros');
  const m = abrirModal({ titulo: id ? c.nome : 'Nova categoria', largo: true, corpo: `<form id="f-cat-m" class="grade g2">
      <label class="campo">Nome da categoria *<input type="text" name="nome" value="${esc(c.nome || '')}" placeholder="Ex.: Impressos publicitários"></label>
      <label class="campo" id="ncm-box">NCM * <span class="muted">(8 dígitos)</span><input type="text" name="ncm" value="${esc(c.ncm || '')}" placeholder="0000.00.00" inputmode="numeric"></label>
      <label class="check" style="grid-column:1/-1"><input type="checkbox" name="servico" value="true" ${c.servico ? 'checked' : ''}> <b>É serviço</b> <span class="muted small">(ex.: instalação — não tem NCM; a nota de serviço fica para o módulo de Nota fiscal)</span></label>
      <div class="small" id="ncm-info" style="grid-column:1/-1"></div>
      <label class="campo" style="grid-column:1/-1">Apelidos <span class="muted">(o que o vendedor pode escrever; um por linha ou separados por vírgula)</span>
        <textarea name="apelidos" rows="6">${esc((c.apelidos || []).join('\n'))}</textarea></label>
      ${id && ger ? `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="ativo" ${c.ativo ? 'checked' : ''}> Categoria ativa</label>` : ''}
    </form>`,
    rodape: `<button class="btn" data-v>Voltar</button>${!id || ger ? '<button class="btn prim" data-s>Salvar categoria</button>' : ''}` });
  const f = $('#f-cat-m', m.el); let tmr, capIncomum = '';
  // capítulos que a GVH já usa (categorias ativas, com o NCM salvo); fora deles, só avisa
  const capsUsados = new Set((S.base.categorias || []).filter(x => x.ativo && x.ncm).map(x => String(x.ncm).slice(0, 2)));
  const ajustarServico = () => { const sv = f.elements.servico.checked; $('#ncm-box', m.el).classList.toggle('hidden', sv); if (sv) { $('#ncm-info', m.el).innerHTML = ''; capIncomum = ''; } };
  const consultar = () => { clearTimeout(tmr); tmr = setTimeout(async () => {
    const d = f.elements.ncm.value.replace(/\D/g, ''); const box = $('#ncm-info', m.el); capIncomum = '';
    if (d.length !== 8) { box.innerHTML = '<span class="muted">Digite os 8 dígitos do NCM.</span>'; return; }
    const r = await api('ncm_consultar', { ncm: d }, true).catch(() => null); if (!r) return;
    f.elements.ncm.value = r.codigo;
    const outras = (r.categorias || []).filter(n => n !== c.nome);
    box.innerHTML = (!r.tabela_carregada ? '<span class="muted">A tabela oficial de NCM ainda não foi carregada; o código não pôde ser conferido.</span>'
      : r.valido ? `<span style="color:var(--verde)">✓ ${esc(r.descricao || 'Código vigente')}</span>` : '<span style="color:var(--vermelho)">Este NCM não existe na tabela oficial vigente.</span>')
      + (outras.length ? `<div class="muted">Já usado em: ${esc(outras.join(', '))}</div>` : '');
    if (capsUsados.size && !capsUsados.has(d.slice(0, 2)) && (!r.tabela_carregada || r.valido)) {
      capIncomum = (r.descricao || '').split(' › ')[0] || `capítulo ${d.slice(0, 2)}`;
      box.innerHTML += `<div class="alerta small" style="margin-top:6px">Este NCM é de um capítulo que a gráfica não costuma usar: <b>${esc(capIncomum)}</b>. Confira se o código não foi digitado trocado.</div>`;
    }
  }, 400); };
  f.elements.ncm.oninput = consultar; if (c.ncm) consultar();
  f.elements.servico.onchange = () => { ajustarServico(); if (!f.elements.servico.checked && f.elements.ncm.value) consultar(); }; ajustarServico();
  m.el.querySelector('[data-v]').onclick = m.fechar;
  const bs = m.el.querySelector('[data-s]');
  if (bs) bs.onclick = async () => {
    if (capIncomum && !confirm(`O NCM é do capítulo "${capIncomum}", que a gráfica não costuma usar. Salvar mesmo assim?`)) return;
    const d = formDados(f); if (id) d.id = id;
    d.servico = f.elements.servico.checked; if (d.servico) d.ncm = '';

    const r = await api('salvar_categoria', d); await carregarBase(); m.fechar(); toast('Categoria salva.');
    if (aoSalvar) aoSalvar(r.id); else recarregar();
  };
}

  const m = abrirModal({ titulo: id ? f.nome : 'Novo fornecedor', corpo: `<form id="f-forn" class="grade g2">
    <label class="campo" style="grid-column:1/-1">Nome *<input type="text" name="nome" value="${esc(f.nome || '')}" required></label>
    <label class="campo" style="grid-column:1/-1">Categoria *<select name="categoria"><option value="">Selecione</option>${Object.entries(CAT_FORN).map(([k, n]) => `<option value="${k}" ${f.categoria === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label class="campo" style="grid-column:1/-1">Site<input type="text" name="site" value="${esc(f.site || '')}" placeholder="Ex.: www.fornecedor.com.br"></label>
    <label class="campo">Login do site<input type="text" name="login_site" value="${esc(f.login_site || '')}" autocomplete="off"></label>
    <label class="campo">Senha do site<input type="password" name="senha_site" autocomplete="new-password" placeholder="${f.tem_senha ? 'Deixe em branco para manter' : ''}"></label>
    ${id ? `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="ativo" value="true" ${f.ativo ? 'checked' : ''}> Ativo</label>` : ''}
    <p class="small muted" style="grid-column:1/-1;margin:0">A senha fica criptografada no banco e só aparece para quem cuida da pré-impressão e da produção.</p></form>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar fornecedor</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-forn', m.el));
    if (!d.nome.trim()) return toast('Informe o nome do fornecedor.', true);
    if (!d.categoria) return toast('Escolha a categoria: Offset ou Comunicação visual.', true);
    if (!d.senha_site) delete d.senha_site;
    if (id) { d.id = id; d.ativo = !!d.ativo; } else d.ativo = true;
    const r = await api('salvar_fornecedor', d); m.fechar(); toast('Fornecedor salvo.');
    await carregarBase();
    if (aoSalvar) aoSalvar(r.id);
  };
}
/* cadastra o fornecedor sem sair da pré-impressão e já escolhe na linha (não recarrega a tela, para não perder o que foi digitado) */
function novoFornecedorNaLinha(itemId) {
  modalFornecedor(null, novoId => {
    $$('select[data-c="fornecedor_id"]').forEach(sel => { const atual = sel.value; sel.innerHTML = opcoesFornecedor(atual); });
    const tr = $(`tr[data-item="${itemId}"]`); const sel = tr && tr.querySelector('select[data-c="fornecedor_id"]');
    if (sel) { sel.value = novoId; sel.dispatchEvent(new Event('change')); }
  });
}

/* ---------- PRODUTOS ---------- */
rota('produtos', async (_p, el) => {
  definirTopoEm(el, 'Produtos', `<button class="btn prim" onclick="modalProduto(null)">Novo produto</button>`);
  await carregarBase();
  const l = S.base.produtos; const forn = id => S.base.fornecedores.find(f => f.id === id)?.nome || '—';
  el.innerHTML = `<div class="painel">${l.length ? `<div class="tabela-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Fornecedor padrão</th><th>Faixas de preço</th><th></th></tr></thead><tbody>
    ${l.map(p => `<tr class="clicavel" onclick="modalProduto('${p.id}')"><td><b>${esc(p.nome)}</b><div class="small muted">${esc(p.descricao || '')}</div></td><td>${esc(p.categoria || '')}</td>
      <td>${esc(forn(p.fornecedor_padrao_id))}</td><td class="small">${(p.faixas || []).map(f => `${num(f.qtd_min)}${f.qtd_max ? '–' + num(f.qtd_max) : '+'}: ${brl(f.preco_unitario)}`).join('<br>') || (p.preco_base ? brl(p.preco_base) : '—')}</td>
      <td>${p.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Nenhum produto no catálogo ainda. Todo item de pedido ou orçamento precisa de um produto cadastrado.</div>'}</div>`;
});
function modalProduto(id) {
  const p = id ? S.base.produtos.find(x => x.id === id) : { ativo: true, unidade: 'un', faixas: [] };
  let faixas = (p.faixas || []).map(f => ({ ...f }));
  const m = abrirModal({ titulo: id ? p.nome : 'Novo produto', largo: true, corpo: `<form id="f-prod" class="grade g3">
    <label class="campo" style="grid-column:span 2">Nome<input type="text" name="nome" value="${esc(p.nome || '')}"></label>
    <label class="campo">Categoria<input type="text" name="categoria" value="${esc(p.categoria || '')}"></label>
    <label class="campo" style="grid-column:1/-1">Descrição<input type="text" name="descricao" value="${esc(p.descricao || '')}"></label>
    <label class="campo">Fornecedor padrão<select name="fornecedor_padrao_id"><option value="">Nenhum</option>${S.base.fornecedores.map(f => `<option value="${f.id}" ${f.id === p.fornecedor_padrao_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>
    <label class="campo">Prazo padrão (dias)<input type="number" name="prazo_padrao_dias" value="${esc(p.prazo_padrao_dias ?? '')}"></label>
    <label class="campo">Preço base (R$/un)<input type="number" step="0.0001" name="preco_base" value="${esc(p.preco_base ?? '')}"></label>
    <label class="campo">Unidade<input type="text" name="unidade" value="${esc(p.unidade || 'un')}"></label>
    <label class="campo" style="grid-column:span 2">Link do gabarito<input type="text" name="gabarito_url" value="${esc(p.gabarito_url || '')}"></label>
    <label class="campo">CNAE<input type="text" name="cnae" value="${esc(p.cnae || '')}"></label>
    <label class="campo">Código de serviço municipal<input type="text" name="codigo_servico" value="${esc(p.codigo_servico || '')}"></label>
    <label class="campo">NCM<input type="text" name="ncm" value="${esc(p.ncm || '')}"></label>
    <label class="check"><input type="checkbox" name="ativo" value="true" ${p.ativo ? 'checked' : ''}> Ativo</label></form>
    <div><div class="painel-cab" style="margin-bottom:6px"><h3>Faixas de preço por quantidade</h3><button type="button" class="btn peq" id="add-fx">Adicionar faixa</button></div><div id="fx"></div></div>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar produto</button>` });
  const desenhar = () => {
    $('#fx', m.el).innerHTML = faixas.length ? faixas.map((f, k) => `<div class="linha-form" style="margin-bottom:6px">
      <input type="number" placeholder="De (qtd)" value="${esc(f.qtd_min ?? '')}" data-k="${k}" data-f="qtd_min">
      <input type="number" placeholder="Até (vazio = sem limite)" value="${esc(f.qtd_max ?? '')}" data-k="${k}" data-f="qtd_max">
      <input type="number" step="0.0001" placeholder="Preço unitário" value="${esc(f.preco_unitario ?? '')}" data-k="${k}" data-f="preco_unitario">
      <button type="button" class="btn link peq" data-rm="${k}" style="flex:0">Remover</button></div>`).join('') : '<p class="small muted" style="margin:0">Sem faixas: vale o preço base.</p>';
    $$('#fx [data-f]', m.el).forEach(i => i.oninput = () => faixas[i.dataset.k][i.dataset.f] = i.value);
    $$('#fx [data-rm]', m.el).forEach(b => b.onclick = () => { faixas.splice(b.dataset.rm, 1); desenhar(); });
  };
  desenhar();
  $('#add-fx', m.el).onclick = () => { faixas.push({}); desenhar(); };
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-prod', m.el)); d.ativo = !!d.ativo; d.faixas = faixas.filter(f => f.qtd_min !== '' && f.qtd_min != null && f.preco_unitario !== '' && f.preco_unitario != null); if (id) d.id = id;
    await api('salvar_produto', d); m.fechar(); toast('Produto salvo.'); recarregar();
  };
}

/* ---------- FERIADOS ---------- */
rota('sugestoes', async (_p, el) => {
  definirTopoEm(el, 'Produtos sugeridos', `<button class="btn prim" onclick="modalSugestao(null)">Novo produto sugerido</button>`);
  await carregarBase();
  const cat = id => S.base.categorias.find(c => c.id === id)?.nome || '—';
  const lista = S.base.sugestoes || [];
  el.innerHTML = `<div class="painel">
    <p class="small muted" style="margin-top:0">Ao digitar no Produto (Novo pedido e orçamento), estes textos aparecem como sugestão e a categoria vem junto. <b>Quantidade e total continuam digitados à mão.</b> Use "…" no lugar da medida para modelos (ex.: "Painel em lona …cm"): o vendedor completa e o sistema não deixa salvar com o "…".</p>
    <div class="tabela-wrap"><table><thead><tr><th style="width:70px">Ordem</th><th>Produto</th><th>Categoria</th><th></th></tr></thead><tbody>
    ${lista.map(x => `<tr class="clicavel" data-sg="${x.id}"><td class="num">${x.ordem}</td><td><b>${esc(x.texto)}</b></td><td class="small">${esc(cat(x.categoria_id))}</td><td>${x.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('') || '<tr><td colspan="4" class="vazio">Nenhum produto sugerido.</td></tr>'}
    </tbody></table></div></div>`;
  el.querySelectorAll('[data-sg]').forEach(tr => tr.onclick = () => modalSugestao(tr.dataset.sg));
});
function modalSugestao(id) {
  const x = id ? S.base.sugestoes.find(s => s.id === id) : { ativo: true, ordem: 100 };
  const m = abrirModal({ titulo: id ? 'Produto sugerido' : 'Novo produto sugerido', largo: true, corpo: `<form id="f-sg" class="grade g2">
      <label class="campo" style="grid-column:1/-1">Produto * <span class="muted">(texto que vai para o pedido; use "…" no lugar da medida em modelos)</span><input type="text" name="texto" value="${esc(x.texto || '')}" placeholder="Ex.: Folheto 10x14cm couchê 90g 4x0"></label>
      <label class="campo">Categoria *<select name="categoria_id">${opcoesCategoria(x.categoria_id, false)}</select></label>
      <label class="campo">Ordem <span class="muted">(menor aparece primeiro)</span><input type="number" name="ordem" value="${esc(x.ordem)}"></label>
      ${id ? `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="ativo" ${x.ativo ? 'checked' : ''}> Ativo (aparece como sugestão)</label>` : ''}
    </form>`,
    rodape: `${id ? '<button class="btn perigo" data-x style="margin-right:auto">Excluir</button>' : ''}<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar</button>` });
  const f = $('#f-sg', m.el).elements;
  m.el.querySelector('[data-v]').onclick = m.fechar;
  const bx = m.el.querySelector('[data-x]');
  if (bx) bx.onclick = async () => { if (!await confirmar(`Excluir "${x.texto}" das sugestões? Pedidos já feitos não mudam.`, 'Excluir', true)) return;
    await api('salvar_sugestao', { id, excluir: true }); await carregarBase(); m.fechar(); toast('Produto sugerido excluído.'); recarregar(); };
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = { texto: f.texto.value, categoria_id: f.categoria_id.value, ordem: f.ordem.value }; if (id) { d.id = id; d.ativo = f.ativo.checked; }
    await api('salvar_sugestao', d); await carregarBase(); m.fechar(); toast('Produto sugerido salvo.'); recarregar();
  };
}

rota('feriados', async (_p, el) => {
  definirTopoEm(el, 'Feriados', '');
  const r = await api('feriados');
  r.feriados.forEach(f => S.feriados[f.data] = f);
  const TIPO = { nacional:'Nacional', estadual:'Estadual', municipal:'Municipal (Osasco)', facultativo:'Ponto facultativo', emenda:'Emenda' };
  el.innerHTML = `<div class="painel"><p class="small muted" style="margin-top:0">Usado para calcular o 5º dia útil do repasse de comissões. Marque "conta como feriado" nos dias em que a GVH não abre.</p>
    <form id="f-fer" class="linha-form" style="margin-bottom:16px">
      <label class="campo">Data<input type="date" name="data" required></label><label class="campo" style="flex:2">Nome<input type="text" name="nome" required></label>
      <label class="campo">Tipo<select name="tipo">${Object.entries(TIPO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="check" style="flex:0;min-width:auto;padding-bottom:9px"><input type="checkbox" name="conta_como_feriado" value="true" checked> Conta como feriado</label>
      <button class="btn prim" style="flex:0">Salvar</button></form>
    <div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Conta como feriado</th><th></th></tr></thead><tbody>
    ${r.feriados.map(f => `<tr><td class="num">${data(f.data)}</td><td>${esc(f.nome)}</td><td>${esc(TIPO[f.tipo] || f.tipo)}</td>
      <td><button class="btn link peq" onclick="alternarFeriado('${f.data}')">${f.conta_como_feriado ? 'Sim' : 'Não'}</button></td>
      <td class="dir"><button class="btn link peq" onclick="excluirFeriado('${f.data}')">Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $('#f-fer').onsubmit = async e => { e.preventDefault(); const d = formDados(e.target); d.conta_como_feriado = !!d.conta_como_feriado; await api('feriados', { salvar: d }); toast('Feriado salvo.'); recarregar(); };
});
async function alternarFeriado(dt) { const f = S.feriados[dt]; await api('feriados', { salvar: { ...f, conta_como_feriado: !f.conta_como_feriado } }); recarregar(); }
async function excluirFeriado(d) { if (!await confirmar('Excluir este feriado?', 'Excluir', true)) return; await api('feriados', { excluir: d }); recarregar(); }

/* ---------- USUÁRIOS (diretor) ---------- */
rota('usuarios', async (_p, el) => {
  definirTopoEm(el, 'Usuários', `<button class="btn prim" onclick="modalUsuario(null)">Novo usuário</button>`);
  const r = await api('listar_usuarios'); vistaDoEl(el).dados = r;
  el.innerHTML = `<div class="painel"><div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Comissão</th><th></th></tr></thead><tbody>
    ${r.usuarios.map(u => `<tr class="clicavel" onclick="modalUsuario('${u.id}')"><td><b>${esc(u.nome)}</b></td><td>${esc(u.email)}</td><td>${esc(u.perfil_nome)}</td>
      <td>${u.recebe_comissao ? num(u.percentual_comissao) + '%' : 'Não recebe (economizada)'}</td><td>${u.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}
    </tbody></table></div></div>`;
});
function modalUsuario(id) {
  const u = id ? S.vistaAtual.dados.usuarios.find(x => x.id === id) : { ativo: true, recebe_comissao: true, percentual_comissao: 5, perfil: 'vendedor' };
  const m = abrirModal({ titulo: id ? u.nome : 'Novo usuário', corpo: `<form id="f-usu" class="grade g2">
    <label class="campo">Nome<input type="text" name="nome" value="${esc(u.nome || '')}"></label>
    <label class="campo">E-mail<input type="email" name="email" value="${esc(u.email || '')}"></label>
    <label class="campo">Perfil<select name="perfil">${S.vistaAtual.dados.perfis.map(p => `<option value="${p.codigo}" ${p.codigo === u.perfil ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label class="campo">${id ? 'Nova senha (deixe em branco para manter)' : 'Senha'}<input type="text" name="senha" autocomplete="off"></label>
    <label class="campo">Comissão (%)<input type="number" step="0.01" name="percentual_comissao" value="${esc(u.percentual_comissao)}"></label>
    <div></div>
    <label class="check"><input type="checkbox" name="recebe_comissao" value="true" ${u.recebe_comissao ? 'checked' : ''}> Recebe comissão</label>
    <label class="check"><input type="checkbox" name="ativo" value="true" ${u.ativo ? 'checked' : ''}> Ativo</label></form>
    <p class="small muted" style="margin:0">Quem não recebe comissão tem o valor registrado como "comissão economizada". Trocar a senha encerra as sessões abertas desse usuário.</p>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar usuário</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-usu', m.el)); d.ativo = !!d.ativo; d.recebe_comissao = !!d.recebe_comissao; if (id) d.id = id;
    await api('salvar_usuario', d); m.fechar(); toast('Usuário salvo.'); recarregar();
  };
}

/* ---------- inicialização ---------- */
(async () => {
  if (/^#\/cadastro\/?$/.test(location.hash)) { window.removeEventListener('hashchange', rotear); return paginaPublicaCadastro(); }
  const mPub = location.hash.match(/^#\/o\/([0-9a-fA-F]{32})$/);
  if (mPub) { window.removeEventListener('hashchange', rotear); return paginaPublicaOrcamento(mPub[1].toLowerCase()); }
  let t = null; try { t = localStorage.getItem('gvh_token'); } catch {}
  if (!t) { $('#tela-login').classList.remove('hidden'); return; }
  S.token = t;
  try { const r = await api('sessao', {}, true); salvarSessao({ ...r, token: t }); await iniciarApp(); }
  catch { sairLocal(); }
})();
</script>
