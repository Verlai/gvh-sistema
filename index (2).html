<style>
:root{
  --verde:#00a986; --verde-2:#58cada4; --grafite:#1d262d; --claro:#f6f6f6; --branco:#fff;
  --linha:#e2e6e8; --linha-2:#eef1f2; --texto-2:#5a6770; --texto-3:#8a959c;
  --ambar:#c9861a; --ambar-bg:#fdf3e1; --vermelho:#c0453b; --vermelho-bg:#fbeceb;
  --verde-bg:#e6f6f2; --azul:#2f6f9f; --azul-bg:#e8f1f8;
  --raio:10px; --raio-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Sora',system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--grafite);background:var(--claro)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde)}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:500}
.muted{color:var(--texto-2)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ===== Login ===== */
#tela-login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-marca{background:var(--verde);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-marca img{height:64px;filter:brightness(0) invert(1);align-self:flex-start}
.login-marca .faixa{position:absolute;right:-80px;bottom:-80px;width:360px;height:360px;border-radius:50%;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 10px,rgba(255,255,255,0) 10px 20px)}
.login-marca h1{font-size:34px;font-weight:300;max-width:420px;color:#fff}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.login-form form{width:100%;max-width:340px;display:grid;gap:16px}
.login-form h2{font-size:22px}

/* ===== Layout ===== */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.lateral{background:var(--grafite);color:#cfd6da;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.lateral .logo{padding:28px 24px 22px}
.lateral .logo img{height:40px;filter:brightness(0) invert(1)}
.menu{flex:1;overflow:auto;padding:6px 10px}
.menu .grupo{font-size:11px;color:#7f8b92;padding:14px 12px 6px}
.menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:var(--raio-s);color:#dde3e6;text-decoration:none;font-weight:400}
.menu a:hover{background:rgba(255,255,255,.06)}
.menu a.ativo{background:var(--verde);color:#fff;font-weight:500}
.menu a .cont{font-size:11px;background:rgba(255,255,255,.14);border-radius:20px;padding:1px 8px}
.lateral .usuario{padding:16px 22px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.lateral .usuario b{display:block;color:#fff;font-weight:500}
.lateral .usuario button{background:none;border:0;color:var(--verde-2);padding:0;margin-top:6px;cursor:pointer}
.principal{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 32px 6px;flex-wrap:wrap}
.topo .acoes{display:flex;gap:8px;flex-wrap:wrap}
#conteudo{padding:16px 32px 48px}
.btn.btn-menu{display:none}

/* ===== Componentes ===== */
.painel{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:20px}
.painel + .painel{margin-top:16px}
.painel-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grade{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha);background:#fff;border-radius:var(--raio-s);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c9d0d4}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.prim:hover{background:#009675}
.btn.escuro{background:var(--grafite);border-color:var(--grafite);color:#fff}
.btn.perigo{color:var(--vermelho);border-color:#ecc9c6}
.btn.link{border:0;background:none;color:var(--verde);padding:4px 6px}
.btn.peq{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
label.campo{display:grid;gap:5px;font-size:12px;color:var(--texto-2);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{
  width:100%;border:1px solid var(--linha);border-radius:var(--raio-s);padding:8px 10px;background:#fff;font-size:14px;color:var(--grafite)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--verde);outline:none}
.check{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.linha-form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.linha-form > *{flex:1;min-width:150px}

table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--texto-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--linha-2);vertical-align:top}
tr.clicavel{cursor:pointer} tr.clicavel:hover td{background:#fafbfb}
.tabela-wrap{overflow-x:auto}
.dir{text-align:right}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:20px;padding:3px 10px;white-space:nowrap;background:var(--linha-2);color:var(--grafite)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.b-cinza{background:#eef1f2;color:#56626a}
.b-azul{background:var(--azul-bg);color:var(--azul)}
.b-ambar{background:var(--ambar-bg);color:#9a6410}
.b-verde{background:var(--verde-bg);color:#007a61}
.b-escuro{background:var(--grafite);color:#fff}
.b-vermelho{background:var(--vermelho-bg);color:var(--vermelho)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.ativo{background:var(--grafite);color:#fff;border-color:var(--grafite)}

.vazio{text-align:center;padding:40px 16px;color:var(--texto-2)}
.alerta{border-radius:var(--raio-s);padding:10px 14px;font-size:13px;background:var(--ambar-bg);color:#7d520d}
.alerta.erro{background:var(--vermelho-bg);color:var(--vermelho)}

/* ===== Trilho de produção (elemento central) ===== */
.trilho{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-width:180px}
.trilho span{height:8px;border-radius:2px;background:#e3e8ea;position:relative}
.trilho span.feito{background:var(--verde)}
.trilho span.atual{background:var(--grafite)}
.trilho span i{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--texto-2);font-weight:500}
.trilho.cancelado span{background:#f1d4d1}
.trilho-grande{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.trilho-grande div{border-top:5px solid #e3e8ea;padding-top:8px;font-size:12px;color:var(--texto-3)}
.trilho-grande div.feito{border-color:var(--verde);color:var(--grafite)}
.trilho-grande div.atual{border-color:var(--grafite);color:var(--grafite);font-weight:700}
.trilho-grande small{display:block;color:var(--texto-2);font-weight:400}

/* ===== Início ===== */
.etapas{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:1px solid var(--linha);border-radius:var(--raio);background:#fff;overflow:hidden}
.etapas button{border:0;border-right:1px solid var(--linha);background:#fff;padding:18px 14px;text-align:left;cursor:pointer}
.etapas button:last-child{border-right:0}
.etapas button:hover{background:#fafbfb}
.etapas .n{font-size:32px;font-weight:300;display:block;line-height:1.1}
.etapas .t{font-size:12px;color:var(--texto-2)}
.etapas button.tem .n{color:var(--verde);font-weight:500}
.cartao-num{border:1px solid var(--linha);border-radius:var(--raio);background:#fff;padding:16px}
.cartao-num .n{font-size:24px;font-weight:500;display:block}
.cartao-num.alerta-num .n{color:var(--vermelho)}

/* ===== Modal / toast ===== */
.fundo-modal{position:fixed;inset:0;background:rgba(29,38,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:var(--raio);width:100%;max-width:640px;box-shadow:0 20px 60px rgba(29,38,45,.25)}
.modal.largo{max-width:920px}
.modal-cab{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--linha)}
.modal-corpo{padding:20px 22px;display:grid;gap:14px}
.modal-rodape{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--linha)}
.fechar{border:0;background:none;font-size:22px;cursor:pointer;color:var(--texto-2);line-height:1}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:60}
.toast{background:var(--grafite);color:#fff;padding:10px 16px;border-radius:var(--raio-s);font-size:13px;max-width:360px}
.toast.erro{background:var(--vermelho)}
.carregando{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--verde),var(--verde-2));z-index:70;animation:carr 1s linear infinite;background-size:200% 100%}
@keyframes carr{from{background-position:0 0}to{background-position:200% 0}}

/* ===== Busca de cliente ===== */
.busca-box{position:relative}
.busca-res{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--linha);border-radius:var(--raio-s);margin-top:4px;z-index:20;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(29,38,45,.12)}
.busca-res div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--linha-2)}
.busca-res div:hover{background:var(--verde-bg)}

/* ===== Linha do tempo ===== */
.tempo{display:grid;gap:12px}
.tempo div{border-left:2px solid var(--linha);padding-left:12px;font-size:13px}
.tempo div.obs{border-color:var(--verde-2)}
.tempo small{display:block;color:var(--texto-3);font-size:11px}

.barra-acao{position:sticky;bottom:0;background:var(--grafite);color:#fff;border-radius:var(--raio);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.barra-acao select{width:auto;min-width:220px}
.grupo-forn{margin-top:18px}
.grupo-forn:first-child{margin-top:0}
.grupo-forn h3{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.itens-editor td{padding:6px}
.itens-editor input,.itens-editor select{padding:6px 8px;font-size:13px}
.totais{display:grid;gap:4px;justify-content:end;text-align:right;margin-top:10px}
.totais b{font-size:18px}

#aviso-novidades{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--grafite);color:#fff;border-radius:30px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;z-index:45;box-shadow:0 8px 24px rgba(29,38,45,.25);font-size:13px}
#aviso-novidades[hidden]{display:none}
@media (max-width:960px){
  #app{grid-template-columns:1fr}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .lateral.aberta{transform:none}
  .btn.btn-menu{display:inline-flex}
  .topo,#conteudo{padding-left:16px;padding-right:16px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .etapas{grid-template-columns:repeat(4,1fr)}
  .etapas button{border-bottom:1px solid var(--linha)}
  #tela-login{grid-template-columns:1fr}
  .login-marca{padding:32px;min-height:200px}
  .login-marca h1{font-size:24px}
}
@media (max-width:560px){ .g2,.g3,.g4{grid-template-columns:1fr} .trilho-grande small{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
@media print{ .lateral,.topo .acoes,.btn,.barra-acao{display:none!important} #app{display:block} body{background:#fff} .painel{border:0;padding:0} }
</style>
</head>
<body>

<script>
/* ============================================================
   GVH · Sistema de Pedidos  —  frontend
   Comunicação: POST {token, acao, dados} → n8n → Supabase (função api)
   ============================================================ */
const API_URL = 'https://gvh-n8n.kjb64n.easypanel.host/webhook/gvh-sistema';
// Chave pública (feita para ficar no navegador). Ela só consegue OUVIR o canal de avisos
// "gvh-mudancas" — não lê nenhuma tabela. Os dados sempre vêm pelo n8n.
const SUPABASE_URL = 'https://zvcvdfkumjlvwqjdbiiw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_B8Rn0FkmxWafKLo4pog7qA_s3evDks4';
const INTERVALO_SEGURANCA_MS = 300000; // 5 min: só cobre queda do Realtime
const S = { token: null, usuario: null, perm: {}, base: null, cache: {}, parcelas: {}, feriados: {} };

/* ---------- utilitários ---------- */
// Sem "el", procura primeiro dentro da tela aberta (as telas ficam guardadas lado a lado)
const $ = (s, el) => el ? el.querySelector(s) : ((S.vistaAtual && S.vistaAtual.el.querySelector(s)) || document.querySelector(s));
const $$ = (s, el) => { if (el) return [...el.querySelectorAll(s)]; const r = S.vistaAtual ? [...S.vistaAtual.el.querySelectorAll(s)] : []; return r.length ? r : [...document.querySelectorAll(s)]; };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => Number(v || 0).toLocaleString('pt-BR', {maximumFractionDigits: 3});
const data = v => { if (!v) return '—'; const [a,m,d] = String(v).slice(0,10).split('-'); return `${d}/${m}/${a}`; };
const dataHora = v => v ? new Date(v).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const somaMeses = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0,10); };
const pode = chave => !!S.perm[chave];
const podeStatus = st => (S.perm.status_item_permitidos || []).includes(st);
const formDados = form => Object.fromEntries(new FormData(form).entries());

function toast(msg, erro = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), erro ? 6000 : 3000);
}

let carregando = 0;
function setCarregando(d) { carregando += d; $('#carregando').classList.toggle('hidden', carregando <= 0); }

async function api(acao, dados = {}, silencioso = false) {
  setCarregando(1);
  try {
    const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json'},
                                     body: JSON.stringify({ token: S.token, acao, dados }) });
    let j; try { j = await r.json(); } catch { throw new Error('Resposta inválida do servidor.'); }
    if (Array.isArray(j)) j = j[0];
    if (!j || j.ok !== true) {
      if (j && j.codigo === 'SESSAO' && acao !== 'login') { sairLocal(); throw new Error('Sua sessão expirou. Entre novamente.'); }
      throw new Error((j && (j.erro || j.message)) || 'Não foi possível concluir a ação.');
    }
    if (!/^(login|sessao|base|resumo|listar_|obter_|buscar_|arte_arquivo)/.test(acao) && !(acao === 'feriados' && !dados.salvar && !dados.excluir)) marcarTelasDesatualizadas();
    return j;
  } catch (e) {
    if (!silencioso) toast(e.message === 'Failed to fetch' ? 'Sem conexão com o servidor.' : e.message, true);
    throw e;
  } finally { setCarregando(-1); }
}

/* ---------- modal ---------- */
function abrirModal({ titulo, corpo, rodape = '', largo = false, aoAbrir }) {
  const f = document.createElement('div');
  f.className = 'fundo-modal';
  f.innerHTML = `<div class="modal ${largo ? 'largo' : ''}" role="dialog" aria-modal="true">
      <div class="modal-cab"><h2>${esc(titulo)}</h2><button class="fechar" aria-label="Fechar">×</button></div>
      <div class="modal-corpo">${corpo}</div>
      ${rodape ? `<div class="modal-rodape">${rodape}</div>` : ''}</div>`;
  const fechar = () => f.remove();
  f.querySelector('.fechar').onclick = fechar;
  f.addEventListener('mousedown', e => { if (e.target === f) fechar(); });
  f.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  $('#modais').appendChild(f);
  const primeiro = f.querySelector('input,select,textarea'); if (primeiro) primeiro.focus();
  if (aoAbrir) aoAbrir(f, fechar);
  return { el: f, fechar };
}
function confirmar(texto, rotulo = 'Confirmar', perigo = false) {
  return new Promise(res => {
    const m = abrirModal({ titulo: 'Confirmação', corpo: `<p style="margin:0">${texto}</p>`,
      rodape: `<button class="btn" data-n>Voltar</button><button class="btn ${perigo ? 'perigo' : 'prim'}" data-s>${esc(rotulo)}</button>` });
    m.el.querySelector('[data-n]').onclick = () => { m.fechar(); res(false); };
    m.el.querySelector('[data-s]').onclick = () => { m.fechar(); res(true); };
  });
}

/* ---------- status ---------- */
const ETAPAS = [
  ['recebido','Recebido'], ['criacao_arte','Criação de Arte'], ['pre_impressao','Pré-Impressão'],
  ['em_producao','Em produção'], ['expedicao','Expedição'], ['saida','Transporte / Retirada'], ['entregue','Entregue']
];
const ORDEM_PED = { recebido:0, criacao_arte:1, pre_impressao:2, em_producao:3, expedicao:4, em_transporte:5, aguardando_retirada:5, entregue:6, concluido:7, cancelado:-1 };
const ORDEM_ITEM = { recebido:0, arte_a_fazer:1, arte_em_alteracao:1, arte_em_aprovacao:1, pre_impressao:2, em_producao:3, expedicao:4, em_transporte:5, aguardando_retirada:5, entregue:6, cancelado:-1 };
const COR_STATUS = {
  recebido:'b-cinza', criacao_arte:'b-azul', arte_a_fazer:'b-azul', arte_em_alteracao:'b-ambar', arte_em_aprovacao:'b-azul',
  pre_impressao:'b-ambar', em_producao:'b-ambar', expedicao:'b-verde', em_transporte:'b-verde', aguardando_retirada:'b-verde',
  entregue:'b-verde', concluido:'b-escuro', cancelado:'b-vermelho'
};
const COR_FIN = { pago:'b-verde', atrasado:'b-vermelho', boleto:'b-azul', sinal_pago:'b-ambar', aguardando_pagamento:'b-cinza' };
const nomeStatusItem = c => (S.base?.status_item || []).find(s => s.codigo === c)?.nome || c;
const nomeStatusPed = c => (S.base?.status_pedido || []).find(s => s.codigo === c)?.nome || c;
const badge = (txt, cls) => `<span class="badge ${cls || 'b-cinza'}">${esc(txt)}</span>`;
const badgeItem = c => badge(nomeStatusItem(c), COR_STATUS[c]);
const badgePed = (c, nome) => badge(nome || nomeStatusPed(c), COR_STATUS[c]);
const badgeFin = (c, nome) => c ? badge(nome, COR_FIN[c]) : '';

function trilho(pedido) {
  const at = ORDEM_PED[pedido.status];
  if (at === -1) return `<div class="trilho cancelado">${'<span></span>'.repeat(7)}</div>`;
  const cont = [0,0,0,0,0,0,0];
  (pedido.itens || []).forEach(i => { const o = ORDEM_ITEM[i.status]; if (o >= 0) cont[o]++; });
  return `<div class="trilho" title="${esc(pedido.status_nome || '')}">` + ETAPAS.map((e, k) => {
    const cls = at === 7 || k < at ? 'feito' : (k === at ? 'atual' : '');
    return `<span class="${cls}">${cont[k] && at !== 7 ? `<i>${cont[k]}</i>` : ''}</span>`;
  }).join('') + '</div>';
}
function trilhoGrande(pedido) {
  const at = ORDEM_PED[pedido.status];
  const cont = [0,0,0,0,0,0,0];
  (pedido.itens || []).forEach(i => { const o = ORDEM_ITEM[i.status]; if (o >= 0) cont[o]++; });
  return `<div class="trilho-grande">` + ETAPAS.map((e, k) => {
    const cls = at === 7 || (at >= 0 && k < at) ? 'feito' : (k === at ? 'atual' : '');
    return `<div class="${cls}">${esc(e[1])}<small>${cont[k] ? cont[k] + (cont[k] > 1 ? ' itens' : ' item') : ''}</small></div>`;
  }).join('') + '</div>';
}

function salvarSessao(j) {

const ROTAS = {};
function rota(nome, fn) { ROTAS[nome] = fn; }
// Telas de formulário nunca se atualizam sozinhas: o que foi digitado fica guardado até salvar ou descartar.
const ROTAS_FORM = new Set(['novo', 'orcamento']);
const VISTAS = new Map();   // chave da rota -> { el, nome, param, form, sujo, editando, topo, dados }
const MAX_VISTAS = 12;

function chaveRota() { return (location.hash || '#/inicio').replace(/^#\/?/, '') || 'inicio'; }
function definirTopo(titulo, acoes = '') {
  const v = S.vistaEmRender || S.vistaAtual;
  if (v) v.topo = { titulo, acoes };
  if (!v || v === S.vistaAtual) aplicarTopo({ titulo, acoes });
}
function aplicarTopo(t) { $('#titulo', document).textContent = t.titulo; $('#topo-acoes', document).innerHTML = t.acoes; document.title = (t.titulo || 'Sistema') + ' · GVH'; }

async function renderVista(v) {
  S.vistaEmRender = v;
  v.sujo = false; v.editando = false; v.el.innerHTML = '';
  esconderAvisoNovidades();
  const fn = ROTAS[v.nome] || ROTAS.inicio;
  try { await fn(v.param, v.el); }
  catch (e) { v.el.innerHTML = `<div class="alerta erro">${esc(e.message)}</div>`; }
  finally { if (S.vistaEmRender === v) S.vistaEmRender = null; }
}
function limparVistasAntigas() {
  if (VISTAS.size <= MAX_VISTAS) return;
  for (const [k, v] of VISTAS) {
    if (VISTAS.size <= MAX_VISTAS) break;
    if (v !== S.vistaAtual && !v.form) { v.el.remove(); VISTAS.delete(k); }
  }
}
function descartarVista(chave) { const v = VISTAS.get(chave); if (v) { v.el.remove(); VISTAS.delete(chave); } }

async function rotear() {
  if (!S.token) return;
  $('#lateral', document).classList.remove('aberta');
  const chave = chaveRota();
  const [nome, ...resto] = chave.split('/');
  const param = resto.length ? decodeURIComponent(resto.join('/')) : null;
  const nomeMenu = nome === 'novo' || nome === 'pedido' ? 'pedidos' : nome === 'orcamento' ? 'orcamentos' : nome;
  $$('#menu a', document).forEach(a => a.classList.toggle('ativo', a.dataset.rota === '#/' + nomeMenu));
  VISTAS.forEach(v => v.el.hidden = true);
  let v = VISTAS.get(chave);
  if (!v) {
    const el = document.createElement('div'); el.className = 'vista';
    $('#conteudo', document).appendChild(el);
    v = { el, nome, param, form: ROTAS_FORM.has(nome), sujo: true };
    // qualquer digitação dentro da tela trava a atualização automática dela
    el.addEventListener('input', e => { if (!e.target.closest('.filtros')) v.editando = true; });
    el.addEventListener('change', e => { if (e.target.matches('input,select,textarea') && !e.target.closest('.filtros')) v.editando = true; });
    VISTAS.set(chave, v);
  } else {
    // devolve para o fim da fila (mais recente)
    VISTAS.delete(chave); VISTAS.set(chave, v);
  }
  S.vistaAtual = v; v.el.hidden = false;
  if (v.topo) aplicarTopo(v.topo); else aplicarTopo({ titulo: '', acoes: '' });
  if (v.sujo && !v.form) await renderVista(v);
  else if (v.sujo && v.form && !v.el.innerHTML) await renderVista(v);
  else if (v.sujo) mostrarAvisoNovidades();
  limparVistasAntigas();
}
window.addEventListener('hashchange', rotear);
// "Atualizar": refaz a tela atual na hora
function recarregar() { const v = S.vistaAtual; if (v) renderVista(v); }

/* ---------- atualização automática (Realtime + rede de segurança) ---------- */
function marcarTelasDesatualizadas() {
  VISTAS.forEach(v => { if (!v.form) v.sujo = true; });
}
function podeAtualizarSozinha(v) {
  if (!v || v.form) return false;
  if ($('.fundo-modal', document)) return false;
  if (v.editando) return false;
  const ativo = document.activeElement;
  if (ativo && v.el.contains(ativo) && ativo.matches('input,select,textarea')) return false;
  if (v.el.querySelector('.sel-item:checked')) return false;
  return true;
}
function tentarAtualizarTelaAtual() {
  const v = S.vistaAtual; if (!v || !v.sujo) return;
  if (podeAtualizarSozinha(v)) renderVista(v);
  else if (!v.form || v.nome !== 'novo') mostrarAvisoNovidades();
}
function mostrarAvisoNovidades() {
  let a = $('#aviso-novidades', document);
  if (!a) {
    a = document.createElement('div'); a.id = 'aviso-novidades';
    a.innerHTML = `<span>Há alterações novas nesta tela.</span><button class="btn peq prim" type="button">Atualizar agora</button>`;
    a.querySelector('button').onclick = () => { esconderAvisoNovidades(); recarregar(); };
    document.body.appendChild(a);
  }
  a.hidden = false;
}
function esconderAvisoNovidades() { const a = $('#aviso-novidades', document); if (a) a.hidden = true; }

let canalRealtime = null, timerRealtime = null, timerSeguranca = null;
function iniciarAtualizacaoAutomatica() {
  if (!canalRealtime && window.supabase) {
    try {
      const cli = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const aviso = () => { clearTimeout(timerRealtime); timerRealtime = setTimeout(() => { marcarTelasDesatualizadas(); tentarAtualizarTelaAtual(); }, 800); };
      canalRealtime = cli.channel('gvh-mudancas', { config: { private: true } })
        .on('broadcast', { event: 'INSERT' }, aviso)
        .on('broadcast', { event: 'UPDATE' }, aviso)
        .on('broadcast', { event: 'DELETE' }, aviso)
        .subscribe();
    } catch (e) { console.warn('Realtime indisponível', e); }
  }
  clearInterval(timerSeguranca);
  timerSeguranca = setInterval(() => { if (document.visibilityState === 'visible') { marcarTelasDesatualizadas(); tentarAtualizarTelaAtual(); } }, INTERVALO_SEGURANCA_MS);
}

      ${tabelaParcelas(p.recebimentos || [], false)}

    <div class="grade g2" style="margin-top:16px">
      <div class="painel" style="margin:0">
        <div class="painel-cab"><h2>Observações</h2></div>
        <form id="form-obs" class="linha-form" style="margin-bottom:14px">
          <input type="text" name="texto" placeholder="Escreva uma observação para a equipe" required style="flex:3">
          <button class="btn" style="flex:0">Adicionar</button>
        </form>
        <div class="tempo">${(p.observacoes_lista || []).map(o => `<div class="obs">${esc(o.texto)}<small>${esc(o.usuario_nome || '')} · ${dataHora(o.created_at)}</small></div>`).join('') || '<span class="muted small">Nenhuma observação.</span>'}</div>
      </div>
      <div class="painel" style="margin:0">
        <div class="painel-cab"><h2>Histórico</h2></div>
        <div class="tempo" style="max-height:380px;overflow:auto">${(p.historico || []).map(h => `<div>${descHistorico(h)}<small>${esc(h.usuario_nome || 'Automático')} · ${dataHora(h.created_at)}</small></div>`).join('')}</div>

  $$('.sel-item').forEach(c => c.onchange = atualizarSel);
  $('#sel-todos').onchange = e => { $$('.sel-item:not(:disabled)').forEach(c => c.checked = e.target.checked); atualizarSel(); };
  $('#form-obs').onsubmit = async e => { e.preventDefault(); await api('adicionar_observacao', { pedido_id: p.id, texto: e.target.texto.value }); toast('Observação adicionada.'); recarregar(); };
});

function descHistorico(h) {
  if (h.tipo === 'status_item') return h.de ? `${esc(h.descricao)}: ${esc(nomeStatusItem(h.de))} → <b>${esc(nomeStatusItem(h.para))}</b>` : `${esc(h.descricao)} (${esc(nomeStatusItem(h.para))})`;
  if (h.tipo === 'status_pedido') return `Pedido passou para <b>${esc(nomeStatusPed(h.para))}</b>`;
  return esc(h.descricao);
}

async function moverSelecionados() {
  const itens = $$('.sel-item:checked').map(c => c.value);
  if (!itens.length) return toast('Selecione os itens que deseja mover.', true);
  const status = $('#novo-status').value;
  if (!status) return toast('Escolha para qual status mover.', true);
  if (status === 'cancelado' && !await confirmar(`Cancelar ${itens.length > 1 ? 'os itens selecionados' : 'o item selecionado'}?`, 'Cancelar itens', true)) return;
  await api('mudar_status_itens', { itens, status });
  toast('Itens atualizados.'); recarregar();
}

/* item: novo ou edição (campos conforme perfil) */
function modalItem(itemId) {
  const p = S.vistaAtual.dados; const i = itemId ? p.itens.find(x => x.id === itemId) : {};
  const cria = pode('cria_pedidos'); const prod = podeStatus('em_producao') || cria; const arte = podeStatus('arte_em_aprovacao') || cria;
  const opcoesForn = `<option value="">Selecione</option>` + S.base.fornecedores.filter(f => f.ativo || f.id === i.fornecedor_id)
     .map(f => `<option value="${f.id}" ${f.id === i.fornecedor_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');
  const m = abrirModal({ titulo: itemId ? 'Editar item' : 'Adicionar item', largo: true, corpo: `
    <form id="f-item" class="grade g3">
      ${cria ? `
        <label class="campo" style="grid-column:span 2">Descrição<input type="text" name="descricao" value="${esc(i.descricao || '')}" required></label>
        <label class="campo">Produto do catálogo<select name="produto_id"><option value="">Nenhum</option>${S.base.produtos.filter(x => x.ativo || x.id === i.produto_id).map(x => `<option value="${x.id}" ${x.id === i.produto_id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>
        <label class="campo" style="grid-column:1/-1">Especificação<input type="text" name="especificacao" value="${esc(i.especificacao || '')}" placeholder="Formato, papel, cores, acabamento"></label>
        <label class="campo">Quantidade<input type="number" step="any" min="0" name="quantidade" value="${esc(i.quantidade ?? 1)}"></label>
        <label class="campo">Valor unitário (R$)<input type="number" step="0.0001" min="0" name="valor_unitario" value="${esc(i.valor_unitario ?? 0)}"></label>
        <label class="campo">Valor total (R$)<input type="number" step="0.01" min="0" name="valor_total" value="${esc(i.valor_total ?? 0)}"></label>
        ${!itemId ? `<label class="campo">Status inicial<select name="status">${opcoesStatusInicial()}</select></label>` : ''}
      ` : `<div style="grid-column:1/-1"><b>${esc(i.descricao)}</b> <span class="muted">· ${num(i.quantidade)} un</span></div>`}
      ${prod ? `
        <label class="campo">Fornecedor<select name="fornecedor_id">${opcoesForn}</select></label>
        <label class="campo">Prazo de produção<input type="date" name="prazo_producao" value="${esc(i.prazo_producao || '')}"></label>
        <label class="campo">Código de produção<input type="text" name="codigo_producao" value="${esc(i.codigo_producao || '')}"></label>` : ''}
      ${pode('ve_custo') ? `<label class="campo">Custo de produção (R$)<input type="number" step="0.01" min="0" name="custo" value="${esc(i.custo ?? '')}"></label>` : ''}
      ${arte ? `
        <label class="campo" style="grid-column:span 2">Link da prova / aprovação<input type="text" name="arte_url" value="${esc(i.arte_url || '')}"></label>
        <label class="campo" style="grid-column:1/-1">Link da arte no Drive<input type="text" name="arte_drive_url" value="${esc(i.arte_drive_url || '')}"></label>` : ''}
      <label class="campo" style="grid-column:1/-1">Observação do item<input type="text" name="observacao" value="${esc(i.observacao || '')}"></label>
      ${arte && itemId ? `<div style="grid-column:1/-1" class="linha-form"><label class="campo">Enviar arquivo de arte<input type="file" id="arq-arte"></label>
        <span class="small muted" style="flex:2">${i.arte_storage_path ? 'Já existe um arquivo enviado. Um novo envio substitui o link.' : 'PDF, imagem ou arquivo compactado, até 100 MB.'}</span></div>` : ''}
    </form>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>${itemId ? 'Salvar item' : 'Adicionar item'}</button>`,
    aoAbrir: el => {
      const f = $('#f-item', el); if (!f.quantidade) return;
      const recalc = () => { f.valor_total.value = (Number(f.quantidade.value || 0) * Number(f.valor_unitario.value || 0)).toFixed(2); };
      f.quantidade.oninput = () => { aplicarFaixa(f); recalc(); };
      f.valor_unitario.oninput = recalc;
      f.produto_id.onchange = () => {
        const pr = S.base.produtos.find(x => x.id === f.produto_id.value); if (!pr) return;
        if (!f.descricao.value) f.descricao.value = pr.nome;
        if (f.fornecedor_id && pr.fornecedor_padrao_id && !f.fornecedor_id.value) f.fornecedor_id.value = pr.fornecedor_padrao_id;
        aplicarFaixa(f); recalc();
      };
    } });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-item', m.el));
    if (!pode('ve_custo')) delete d.custo; else if (d.custo === '' && i.custo == null) delete d.custo;
    const arq = $('#arq-arte', m.el)?.files?.[0];
    if (itemId) d.id = itemId; else d.pedido_id = p.id;
    await api('salvar_item', d);
    if (arq) await enviarArte(itemId, arq);
    m.fechar(); toast(itemId ? 'Item atualizado.' : 'Item adicionado.'); recarregar();
  };
}
function opcoesStatusInicial(sel = 'recebido') {
  const lista = ['recebido', ...(S.perm.status_item_permitidos || []).filter(s => ['arte_a_fazer','arte_em_aprovacao','pre_impressao'].includes(s))];
  return [...new Set(lista)].map(s => `<option value="${s}" ${s === sel ? 'selected' : ''}>${esc(nomeStatusItem(s))}</option>`).join('');
}
function aplicarFaixa(f) {
  const pr = S.base.produtos.find(x => x.id === f.produto_id?.value); if (!pr) return;
  const q = Number(f.quantidade.value || 0);
  const fx = (pr.faixas || []).find(x => q >= Number(x.qtd_min) && (x.qtd_max == null || q <= Number(x.qtd_max)));
  if (fx) f.valor_unitario.value = Number(fx.preco_unitario);
  else if (pr.preco_base != null && !Number(f.valor_unitario.value)) f.valor_unitario.value = Number(pr.preco_base);
}

/* arte no Storage */
async function enviarArte(itemId, arquivo) {
  const r = await api('arte_arquivo', { item_id: itemId, op: 'upload', nome_arquivo: arquivo.name });
  const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', arquivo);
  const up = await fetch(r.url, { method: 'PUT', body: fd, headers: { 'x-upsert': 'true' } });
  if (!up.ok) { toast('Falha ao enviar o arquivo de arte.', true); throw new Error('upload'); }
  await api('salvar_item', { id: itemId, arte_storage_path: r.path });
  toast('Arquivo de arte enviado.');
}
async function baixarArte(itemId) {
  const r = await api('arte_arquivo', { item_id: itemId, op: 'download' });
  window.open(r.url, '_blank', 'noopener');
}

/* ---------- PARCELAS ---------- */
const TIPOS_PARC = { sinal:'Sinal', restante:'Restante', boleto:'Boleto', a_vista:'À vista', parcela:'Parcela' };
const FORMAS = { pix:'Pix', dinheiro:'Dinheiro', cartao_credito:'Cartão de crédito', cartao_debito:'Cartão de débito', boleto:'Boleto', transferencia:'Transferência', outro:'Outro' };
const opcoesForma = (sel = '') => `<option value="">—</option>` + Object.entries(FORMAS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');
function badgeParcela(r) {
  if (r.situacao === 'pago') return badge('Pago em ' + data(r.pago_em), 'b-verde');
  if (r.situacao === 'cancelado') return badge('Cancelada', 'b-cinza');
  if (r.atrasado) return badge('Atrasada', 'b-vermelho');
  if (r.dias_para_vencer === 0) return badge('Vence hoje', 'b-ambar');
  return badge('Em aberto', 'b-cinza');
}
function tabelaParcelas(lista, comPedido) {
  lista.forEach(r => S.parcelas[r.id] = r);
  if (!lista.length) return `<div class="vazio">Nenhuma parcela lançada.</div>`;
  const edita = pode('edita_financeiro');
  return `<div class="tabela-wrap"><table>
    <thead><tr>${comPedido ? '<th>Pedido</th><th>Cliente</th>' : ''}<th>Parcela</th><th>Vencimento</th><th class="dir">Valor</th><th>Forma</th><th>Situação</th>${edita ? '<th></th>' : ''}</tr></thead>
    <tbody>${lista.map(r => `<tr>
      ${comPedido ? `<td><a href="#/pedido/${r.pedido_id}"><b>${esc(r.pedido_numero)}</b></a></td><td>${esc(r.cliente_nome)}</td>` : ''}
      <td>${esc(TIPOS_PARC[r.tipo] || r.tipo)}${r.parcela_num ? ` ${r.parcela_num}${r.parcelas_total ? '/' + r.parcelas_total : ''}` : ''}${r.observacao ? `<div class="small muted">${esc(r.observacao)}</div>` : ''}</td>
      <td class="num">${data(r.vencimento)}</td>
      <td class="dir num">${brl(r.valor)}</td>
      <td>${esc(FORMAS[r.forma_pagamento] || '—')}</td>
      <td>${badgeParcela(r)}</td>
      ${edita ? `<td class="dir" style="white-space:nowrap">
        ${r.situacao === 'aberto' ? `<button class="btn prim peq" onclick="modalBaixa('${r.id}')">Dar baixa</button>
             <button class="btn link peq" onclick="excluirParcela('${r.id}')">Excluir</button>` : ''}
        ${r.situacao === 'pago' ? `<button class="btn link peq" onclick="desfazerBaixa('${r.id}')">Desfazer baixa</button>` : ''}
      </td>` : ''}
    </tr>`).join('')}</tbody></table></div>`;
}
function modalBaixa(id) {
  const p0 = S.parcelas[id]; const r = { id, valor: p0.valor, forma: p0.forma_pagamento || '' };
  const m = abrirModal({ titulo: 'Registrar pagamento', corpo: `
    <form id="f-baixa" class="grade g3">

async function desfazerBaixa(id) {

function ligarGerador(el, onChange) {
  let parcelas = [];
  const g = k => el.querySelector(`[data-g="${k}"]`).value;
  const desenhar = () => {
    const alvo = el.querySelector('#preview-parcelas');
    alvo.innerHTML = parcelas.length ? `<table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="dir">Valor</th><th>Forma</th><th></th></tr></thead><tbody>
      ${parcelas.map((p, k) => `<tr><td>${esc(TIPOS_PARC[p.tipo])}${p.parcela_num ? ' ' + p.parcela_num + '/' + p.parcelas_total : ''}</td>
        <td><input type="date" value="${p.vencimento}" data-k="${k}" data-c="vencimento"></td>
        <td class="dir"><input type="number" step="0.01" value="${p.valor}" data-k="${k}" data-c="valor" style="max-width:130px;text-align:right"></td>
        <td>${esc(FORMAS[p.forma_pagamento] || '—')}</td>
        <td><button type="button" class="btn link peq" data-rm="${k}">Remover</button></td></tr>`).join('')}</tbody></table>
      <p class="small muted">Soma: <b>${brl(parcelas.reduce((s, p) => s + Number(p.valor), 0))}</b></p>` : '<p class="small muted">Nenhuma parcela gerada. Preencha acima e clique em "Gerar parcelas".</p>';
    alvo.querySelectorAll('[data-c]').forEach(inp => inp.onchange = () => { parcelas[inp.dataset.k][inp.dataset.c] = inp.value; desenhar(); });
    alvo.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { parcelas.splice(b.dataset.rm, 1); desenhar(); });
    onChange && onChange(parcelas);
  };
  el.querySelector('[data-g-gerar]').onclick = () => {
    parcelas = [];
    const sinal = Number(g('sinal') || 0), total = Number(g('total') || 0), qtd = Math.max(1, Number(g('qtd') || 1)), modo = g('modo');
    if (sinal > 0) parcelas.push({ tipo: 'sinal', valor: sinal.toFixed(2), vencimento: g('venc_sinal'), forma_pagamento: 'pix' });
    const resto = Math.round((total - sinal) * 100);
    if (resto > 0) {
      const n = modo === 'restante' ? 1 : qtd; const base = Math.floor(resto / n);
      for (let k = 0; k < n; k++) {
        const cent = k === n - 1 ? resto - base * (n - 1) : base;
        parcelas.push({ tipo: modo === 'restante' ? 'restante' : modo, parcela_num: n > 1 ? k + 1 : null, parcelas_total: n > 1 ? n : null,
          valor: (cent / 100).toFixed(2), vencimento: somaMeses(g('venc1'), k), forma_pagamento: g('forma') || null });
      }
    }
    desenhar();
  };
  desenhar();
  return () => parcelas;
}

function ligarBuscaCliente(input, aoEscolher) {
  const box = input.parentElement; let t;
  const res = document.createElement('div'); res.className = 'busca-res hidden'; box.appendChild(res);
  input.addEventListener('input', () => {
    clearTimeout(t); const q = input.value.trim();
    if (q.length < 2) { res.classList.add('hidden'); return; }
    t = setTimeout(async () => {
      const r = await api('buscar_clientes', { busca: q, limite: 12 }, true).catch(() => ({ clientes: [] }));
      res.innerHTML = r.clientes.map(c => `<div data-id="${c.id}"><b>${esc(c.nome_fantasia || c.nome)}</b><div class="small muted">${esc(c.nome_fantasia ? c.nome : '')} ${esc(c.cpf_cnpj || '')} ${esc(c.whatsapp || c.telefone || '')}</div></div>`).join('')
        + (pode('cadastra_clientes') ? `<div data-novo><b style="color:var(--verde)">Cadastrar novo cliente</b></div>` : '');
      res.classList.remove('hidden');
      res.querySelectorAll('[data-id]').forEach(d => d.onclick = () => { const c = r.clientes.find(x => x.id === d.dataset.id); res.classList.add('hidden'); aoEscolher(c); });
      const nv = res.querySelector('[data-novo]'); if (nv) nv.onclick = () => { res.classList.add('hidden'); modalCliente(null, c => aoEscolher(c), q); };
    }, 300);
  });
  document.addEventListener('click', e => { if (!box.contains(e.target)) res.classList.add('hidden'); });
}
function enderecoCliente(c) {
  return [c.logradouro && `${c.logradouro}${c.numero ? ', ' + c.numero : ''}`, c.complemento, c.bairro, c.cidade && `${c.cidade}${c.uf ? '/' + c.uf : ''}`, c.cep].filter(Boolean).join(' · ');
}

/* ---------- EDITOR DE ITENS (novo pedido / orçamento) ---------- */
function editorItens(alvo, itensIniciais, { comStatus = false, aoMudar } = {}) {
  let itens = itensIniciais.length ? itensIniciais.map(x => ({ ...x })) : [{ quantidade: 1, valor_unitario: 0, valor_total: 0, status: 'recebido' }];
  const produtos = S.base.produtos.filter(p => p.ativo);
  const desenhar = () => {
    alvo.innerHTML = `<div class="tabela-wrap"><table class="itens-editor"><thead><tr>
        <th style="min-width:160px">Produto</th><th style="min-width:200px">Descrição e especificação</th><th style="width:90px">Qtd.</th>
        <th style="width:120px">Unitário</th><th style="width:120px">Total</th>${comStatus ? '<th style="min-width:160px">Status inicial</th>' : ''}<th></th></tr></thead>
      <tbody>${itens.map((it, k) => `<tr>
        <td><select data-k="${k}" data-f="produto_id"><option value="">Avulso</option>${produtos.map(p => `<option value="${p.id}" ${p.id === it.produto_id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></td>
        <td><input type="text" placeholder="Descrição" value="${esc(it.descricao || '')}" data-k="${k}" data-f="descricao">
            <input type="text" placeholder="Especificação (formato, papel, acabamento)" value="${esc(it.especificacao || '')}" data-k="${k}" data-f="especificacao" style="margin-top:4px"></td>
        <td><input type="number" step="any" min="0" value="${it.quantidade}" data-k="${k}" data-f="quantidade"></td>
        <td><input type="number" step="0.0001" min="0" value="${it.valor_unitario}" data-k="${k}" data-f="valor_unitario"></td>
        <td><input type="number" step="0.01" min="0" value="${it.valor_total}" data-k="${k}" data-f="valor_total"></td>
        ${comStatus ? `<td><select data-k="${k}" data-f="status">${opcoesStatusInicial(it.status)}</select></td>` : ''}
        <td>${itens.length > 1 ? `<button type="button" class="btn link peq" data-rm="${k}">Remover</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <button type="button" class="btn peq" id="add-item" style="margin-top:8px">Adicionar outro item</button>`;
    $$('[data-f]', alvo).forEach(el => el.onchange = el.oninput = () => {
      const it = itens[el.dataset.k]; const f = el.dataset.f; it[f] = el.value;
      if (f === 'produto_id') {
        const p = produtos.find(x => x.id === el.value);
        if (p) { if (!it.descricao) it.descricao = p.nome; precoFaixa(p, it); }
        it.valor_total = (Number(it.quantidade || 0) * Number(it.valor_unitario || 0)).toFixed(2); desenhar(); return;
      }
      if (f === 'quantidade') { const p = produtos.find(x => x.id === it.produto_id); if (p) precoFaixa(p, it); }
      if (f === 'quantidade' || f === 'valor_unitario') {
        it.valor_total = (Number(it.quantidade || 0) * Number(it.valor_unitario || 0)).toFixed(2);
        const linha = el.closest('tr'); linha.querySelector('[data-f=valor_total]').value = it.valor_total;
        if (f === 'quantidade') linha.querySelector('[data-f=valor_unitario]').value = it.valor_unitario;
      }
      aoMudar && aoMudar(itens);
    });
    $$('[data-rm]', alvo).forEach(b => b.onclick = () => { itens.splice(b.dataset.rm, 1); desenhar(); });
    $('#add-item', alvo).onclick = () => { itens.push({ quantidade: 1, valor_unitario: 0, valor_total: 0, status: itens[itens.length - 1]?.status || 'recebido' }); desenhar(); };
    aoMudar && aoMudar(itens);
  };
  const precoFaixa = (p, it) => {
    const q = Number(it.quantidade || 0);
    const fx = (p.faixas || []).find(x => q >= Number(x.qtd_min) && (x.qtd_max == null || q <= Number(x.qtd_max)));
    if (fx) it.valor_unitario = Number(fx.preco_unitario); else if (p.preco_base != null) it.valor_unitario = Number(p.preco_base);
  };
  desenhar();
  return () => itens.filter(i => (i.descricao || '').trim());
}

    <div class="painel"><div class="painel-cab"><h2>Itens</h2></div><div id="o-itens"></div>
      <div class="grade g4" style="margin-top:14px">
        <label class="campo">Desconto (R$)<input type="number" step="0.01" id="o-desc" value="${esc(o.desconto)}"></label>
        <label class="campo">Frete (R$)<input type="number" step="0.01" id="o-frete" value="${esc(o.frete)}"></label>
        <div></div><div class="totais" style="margin:0"><span class="muted small">Total</span><b class="num" id="o-total"></b></div></div></div>
    <div class="painel"><form id="f-orc" class="grade g3">
      <label class="campo">Validade<input type="date" name="validade" value="${esc(o.validade || '')}"></label>
      <label class="campo">Situação<select name="status">${[['aberto','Em elaboração'],['enviado','Enviado ao cliente'],['recusado','Recusado'],['expirado','Expirado']].map(([v, n]) => `<option value="${v}" ${o.status === v ? 'selected' : ''}>${n}</option>`).join('')}${travado ? '<option value="aprovado" selected>Aprovado</option>' : ''}</select></label>
      <div></div>
      <label class="campo" style="grid-column:1/-1">Condições de pagamento<input type="text" name="condicoes_pagamento" value="${esc(o.condicoes_pagamento || '')}"></label>
      <label class="campo" style="grid-column:1/-1">Observações<textarea name="observacoes">${esc(o.observacoes || '')}</textarea></label>
    </form></div>
    ${!travado ? `<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn prim" id="o-salvar">Salvar orçamento</button></div>` : ''}`;
  const mostrarCli = c => { cliente = c; $('#o-cli-esc').innerHTML = c ? `<b>${esc(c.nome_fantasia || c.nome)}</b> <span class="muted">${esc(c.cpf_cnpj || '')}</span>` : '<span class="muted small">Nenhum cliente escolhido.</span>'; $('#o-cli').value = ''; };
  mostrarCli(cliente); ligarBuscaCliente($('#o-cli'), mostrarCli);
  const tot = () => { const its = pegarItens ? pegarItens() : o.itens; $('#o-total').textContent = brl(its.reduce((s, i) => s + Number(i.valor_total || 0), 0) - Number($('#o-desc').value || 0) + Number($('#o-frete').value || 0)); };
  pegarItens = editorItens($('#o-itens'), o.itens, { aoMudar: tot });
  $('#o-desc').oninput = $('#o-frete').oninput = tot; tot();
  const salvar = async () => {
    const d = { ...formDados($('#f-orc')), cliente_id: cliente?.id || '', itens: pegarItens(), desconto: $('#o-desc').value, frete: $('#o-frete').value };
    if (!novo) d.id = o.id;
    const r = await api('salvar_orcamento', d); toast(`Orçamento ${r.numero} salvo.`); return r;
  };
  if ($('#o-salvar')) $('#o-salvar').onclick = async () => { const r = await salvar(); if (novo) { descartarVista('orcamento/novo'); location.hash = '#/orcamento/' + r.id; } else renderVista(S.vistaAtual); };
  if ($('#o-converter')) $('#o-converter').onclick = async () => {
    const m = abrirModal({ titulo: 'Transformar em pedido', corpo: `<p style="margin:0">Os itens entram no pedido como "Recebido".</p>
      <label class="campo">Previsão de entrega *<input type="date" id="conv-prev" required></label>
      <label class="campo">Forma de entrega<select id="conv-forma"><option value="retirada">Cliente retira no balcão</option><option value="entrega">Entregar no cliente</option></select></label>`,
      rodape: `<button class="btn" data-v>Voltar</button><button class="btn escuro" data-s>Criar pedido</button>` });
    m.el.querySelector('[data-v]').onclick = m.fechar;
    m.el.querySelector('[data-s]').onclick = async () => {
      const prev = $('#conv-prev', m.el).value; if (!prev) return toast('Informe a previsão de entrega.', true);
      await salvar();
      const r = await api('converter_orcamento', { id: o.id, data_prevista_entrega: prev, forma_entrega: $('#conv-forma', m.el).value,
        endereco_entrega: cliente ? enderecoCliente(cliente) : '' });
      m.fechar(); toast(`Pedido ${r.numero} criado.`); descartarVista(chaveRota()); location.hash = '#/pedido/' + r.id;
    };
  };
});

rota('producao', async (_p, el) => {
  definirTopo('Pré-impressão e produção', `<button class="btn" onclick="recarregar()">Atualizar</button>`);
  const aba = S.cache.abaProd || (S.cache.abaProd = 'pre_impressao');
  const fForn = S.cache.fornProd || '';
  const r = await api('listar_itens', { status: ['pre_impressao','em_producao'] });
  S.vistaEmRender.dados = r.itens;
  const pre = r.itens.filter(i => i.status === 'pre_impressao');
  let prod = r.itens.filter(i => i.status === 'em_producao');
  const atrasados = prod.filter(i => i.producao_atrasada).length;
  if (fForn) prod = prod.filter(i => i.fornecedor_id === fForn);
  const opForn = sel => `<option value="">Selecione</option>` + S.base.fornecedores.filter(f => f.ativo).map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(f.nome)}</option>`).join('');

  let corpo;
  if (aba === 'pre_impressao') {
    corpo = pre.length ? `<p class="small muted" style="margin-top:0">Defina fornecedor, prazo e código de produção. O item só vai para produção com os três preenchidos, e o pedido só muda de etapa quando todos os itens estiverem em produção.</p>
      <div class="tabela-wrap"><table>
      <thead><tr><th>Pedido</th><th>Item</th><th style="min-width:170px">Fornecedor</th><th>Prazo</th><th>Código</th>${pode('ve_custo') ? '<th>Custo (R$)</th>' : ''}<th></th></tr></thead>
      <tbody>${pre.map(i => `<tr data-item="${i.id}">
        <td><a href="#/pedido/${i.pedido_id}"><b>${esc(i.pedido_numero)}</b></a><div class="small muted">${esc(i.cliente_nome)}</div></td>
        <td><b>${esc(i.descricao)}</b><div class="small muted">${num(i.quantidade)} un${i.especificacao ? ' · ' + esc(i.especificacao) : ''}</div>
            ${i.arte_storage_path ? `<button class="btn link peq" onclick="baixarArte('${i.id}')">Baixar arte</button>` : ''}${i.arte_drive_url ? `<a class="small" href="${esc(i.arte_drive_url)}" target="_blank" rel="noopener">Arte no Drive</a>` : ''}</td>
        <td><select data-c="fornecedor_id">${opForn(i.fornecedor_id)}</select></td>
        <td><input type="date" data-c="prazo_producao" value="${esc(i.prazo_producao || '')}"></td>
        <td><input type="text" data-c="codigo_producao" value="${esc(i.codigo_producao || '')}" style="min-width:110px"></td>
        ${pode('ve_custo') ? `<td><input type="number" step="0.01" min="0" data-c="custo" value="${esc(i.custo ?? '')}" style="max-width:110px"></td>` : ''}
        <td class="dir" style="white-space:nowrap"><button class="btn peq" onclick="salvarLinhaProd('${i.id}',false)">Salvar</button>
          <button class="btn prim peq" onclick="salvarLinhaProd('${i.id}',true)">Enviar para produção</button></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Nenhum item aguardando pré-impressão.</div>';
  } else {
    const grupos = {};
    prod.forEach(i => (grupos[i.fornecedor_nome || 'Sem fornecedor'] ||= []).push(i));
    corpo = `<div class="linha-form filtros" style="margin-bottom:12px">
        <label class="campo" style="max-width:280px">Fornecedor<select id="f-forn"><option value="">Todos</option>${S.base.fornecedores.map(f => `<option value="${f.id}" ${f.id === fForn ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>
        <span class="small muted" style="padding-bottom:9px">Confira diariamente com cada fornecedor os itens abaixo. Atrasados aparecem primeiro.</span></div>`
      + (prod.length ? Object.entries(grupos).map(([nome, lista]) => `<div class="grupo-forn">
        <h3>${esc(nome)} <span class="badge b-cinza">${lista.length}</span></h3>
        <div class="tabela-wrap"><table><thead><tr><th>Pedido</th><th>Item</th><th>Código</th><th>Prazo</th><th>Em produção há</th><th></th></tr></thead><tbody>
        ${lista.sort((a, b) => (b.producao_atrasada - a.producao_atrasada) || String(a.prazo_producao).localeCompare(String(b.prazo_producao))).map(i => `<tr>
          <td><a href="#/pedido/${i.pedido_id}"><b>${esc(i.pedido_numero)}</b></a><div class="small muted">${esc(i.cliente_nome)}</div></td>
          <td>${esc(i.descricao)}<div class="small muted">${num(i.quantidade)} un</div></td>
          <td>${esc(i.codigo_producao)}</td>
          <td class="num" style="${i.producao_atrasada ? 'color:var(--vermelho);font-weight:500' : ''}">${data(i.prazo_producao)}${i.producao_atrasada ? ' · atrasado' : ''}</td>
          <td class="num">${i.dias_no_status} ${i.dias_no_status == 1 ? 'dia' : 'dias'}</td>
          <td class="dir" style="white-space:nowrap"><button class="btn peq" onclick="modalItemProd('${i.id}')">Ajustar</button>
            ${podeStatus('expedicao') ? `<button class="btn prim peq" onclick="moverItem('${i.id}','expedicao')">Chegou no balcão</button>` : ''}</td>
        </tr>`).join('')}</tbody></table></div></div>`).join('') : '<div class="vazio">Nenhum item em produção.</div>');
  }
  el.innerHTML = `
    <div class="chips" style="margin-bottom:14px">
      <button class="chip ${aba === 'pre_impressao' ? 'ativo' : ''}" onclick="S.cache.abaProd='pre_impressao';recarregar()">Pré-impressão (${pre.length})</button>
      <button class="chip ${aba === 'em_producao' ? 'ativo' : ''}" onclick="S.cache.abaProd='em_producao';recarregar()">Em produção (${r.itens.filter(i => i.status === 'em_producao').length}${atrasados ? ` · ${atrasados} atrasado${atrasados > 1 ? 's' : ''}` : ''})</button>
    </div>
    <div class="painel">${corpo}</div>`;
  if ($('#f-forn')) $('#f-forn').onchange = e => { S.cache.fornProd = e.target.value; recarregar(); };
});
async function salvarLinhaProd(id, enviar) {
  const tr = $(`tr[data-item="${id}"]`); const d = { id };
  $$('[data-c]', tr).forEach(el => d[el.dataset.c] = el.value);
  if (d.custo === '') delete d.custo;
  if (enviar && (!d.fornecedor_id || !d.prazo_producao || !d.codigo_producao.trim())) return toast('Preencha fornecedor, prazo e código de produção.', true);
  await api('salvar_item', d);
  if (enviar) await api('mudar_status_itens', { itens: [id], status: 'em_producao' });
  toast(enviar ? 'Item enviado para produção.' : 'Dados salvos.'); recarregar();
}
function modalItemProd(id) {
  const i = S.vistaAtual.dados.find(x => x.id === id);
  const m = abrirModal({ titulo: `${i.pedido_numero} · ${i.descricao}`, corpo: `<form id="f-ip" class="grade g2">
    <label class="campo">Fornecedor<select name="fornecedor_id">${S.base.fornecedores.map(f => `<option value="${f.id}" ${f.id === i.fornecedor_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>
    <label class="campo">Prazo de produção<input type="date" name="prazo_producao" value="${esc(i.prazo_producao || '')}"></label>
    <label class="campo">Código de produção<input type="text" name="codigo_producao" value="${esc(i.codigo_producao || '')}"></label>
    ${pode('ve_custo') ? `<label class="campo">Custo (R$)<input type="number" step="0.01" name="custo" value="${esc(i.custo ?? '')}"></label>` : ''}
    <label class="campo" style="grid-column:1/-1">Observação<input type="text" name="observacao" value="${esc(i.observacao || '')}"></label></form>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => { const d = formDados($('#f-ip', m.el)); if (d.custo === '') delete d.custo; await api('salvar_item', { id, ...d }); m.fechar(); toast('Item atualizado.'); recarregar(); };
}

rota('expedicao', async (_p, el) => {
  definirTopo('Expedição e entrega', `<button class="btn" onclick="recarregar()">Atualizar</button>`);
  const r = await api('listar_itens', { status: ['expedicao','em_transporte','aguardando_retirada'] });
  const peds = {};
  r.itens.forEach(i => (peds[i.pedido_id] ||= { id: i.pedido_id, numero: i.pedido_numero, cliente: i.cliente_nome, forma: i.forma_entrega, itens: [] }).itens.push(i));
  const colunas = [
    ['expedicao', 'No balcão', 'Material chegou da produção.'],
    ['em_transporte', 'Em transporte', 'Saiu para o endereço do cliente.'],
    ['aguardando_retirada', 'Aguardando retirada', 'Cliente vem buscar no balcão.']
  ];
  const cartao = (p, etapa) => {
    const its = p.itens.filter(i => i.status === etapa);
    const prox = etapa === 'expedicao' ? (p.forma === 'entrega' ? ['em_transporte', 'Saiu para entrega'] : ['aguardando_retirada', 'Avisar retirada']) : ['entregue', 'Marcar como entregue'];
    return `<div class="painel" style="padding:14px;margin:0 0 10px">
      <div style="display:flex;justify-content:space-between;gap:8px"><a href="#/pedido/${p.id}"><b>${esc(p.numero)}</b></a>${badge(p.forma === 'entrega' ? 'Entrega' : 'Retirada', p.forma === 'entrega' ? 'b-azul' : 'b-cinza')}</div>
      <div>${esc(p.cliente)}</div>
      <ul style="margin:8px 0;padding-left:18px" class="small">${its.map(i => `<li>${esc(i.descricao)} · ${num(i.quantidade)} un</li>`).join('')}</ul>
      ${podeStatus(prox[0]) ? `<button class="btn ${prox[0] === 'entregue' ? 'prim' : ''} peq" onclick="moverItensPedido('${its.map(i => i.id).join(',')}','${prox[0]}')">${prox[1]}</button>` : ''}
    </div>`;
  };
  el.innerHTML = `<div class="grade g3">${colunas.map(([k, t, d]) => {
    const lista = Object.values(peds).filter(p => p.itens.some(i => i.status === k));
    return `<div><h2 style="margin-bottom:2px">${t} <span class="badge b-cinza">${lista.length}</span></h2><p class="small muted" style="margin:0 0 10px">${d}</p>
      ${lista.map(p => cartao(p, k)).join('') || '<div class="vazio painel">Nada aqui.</div>'}</div>`;
  }).join('')}</div>`;
});
async function moverItensPedido(ids, status) { await api('mudar_status_itens', { itens: ids.split(','), status }); toast(`${nomeStatusItem(status)}.`); recarregar(); }

  const abas = [['hoje','Vencem hoje'],['atrasados','Atrasadas'],['abertos','Em aberto'],['pagos','Pagas'],['todos','Todas']];

  $$('[data-f]').forEach(b => b.onclick = () => { f.filtro = b.dataset.f; recarregar(); });
  let t; $('#fin-busca').oninput = e => { f.busca = e.target.value; clearTimeout(t); t = setTimeout(recarregar, 450); };
  $('#fin-de').onchange = e => { f.de = e.target.value; recarregar(); };
  $('#fin-ate').onchange = e => { f.ate = e.target.value; recarregar(); };
});

/* ---------- COMISSÕES ---------- */
rota('comissoes', async (_p, el) => {
  definirTopo('Comissões', `<button class="btn" onclick="recarregar()">Atualizar</button>`);
  const comp = S.cache.compComissao || hoje().slice(0, 7);
  const r = await api('listar_comissoes', { competencia: comp + '-01' });
  const nomeMes = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const doMes = r.fechamentos.filter(x => x.competencia === r.competencia);
  const devidos = doMes.filter(x => x.recebe_comissao);
  const economizado = doMes.reduce((s, x) => s + Number(x.valor_economizado || 0), 0);
  const SIT = { aberto: ['Mês em andamento', 'b-cinza'], fechado: ['Aguardando repasse', 'b-ambar'], pago: ['Repassado', 'b-verde'] };
  el.innerHTML = `
    <div class="painel filtros"><div class="linha-form">
      <label class="campo" style="max-width:220px">Mês dos pagamentos<input type="month" id="c-mes" value="${comp}"></label>
      <p class="small muted" style="flex:3;margin:0 0 9px">A comissão é de 5% sobre cada valor pago pelo cliente, contada no mês em que o pagamento entrou. O repasse acontece no 5º dia útil do mês seguinte.</p>
    </div></div>
    <div class="grade g3" style="margin-top:16px">
      ${devidos.map(x => `<div class="cartao-num"><span class="n num">${brl(x.valor_devido)}</span><span class="muted small">${esc(x.vendedor_nome)} · repasse ${data(x.data_repasse_prevista)}</span>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${badge(...SIT[x.situacao])}
        ${pode('gerencia_comissoes') && x.situacao === 'fechado' ? `<button class="btn prim peq" onclick="pagarComissao('${x.id}')">Marcar repasse feito</button>` : ''}
        ${pode('gerencia_comissoes') && x.situacao === 'pago' ? `<button class="btn link peq" onclick="pagarComissao('${x.id}',true)">Desfazer</button>` : ''}</div></div>`).join('')}
      ${economizado > 0 ? `<div class="cartao-num" style="border-color:var(--verde)"><span class="n num" style="color:var(--verde)">${brl(economizado)}</span><span class="muted small">Comissão economizada em vendas da diretoria</span></div>` : ''}
      ${!doMes.length ? `<div class="vazio painel" style="grid-column:1/-1">Nenhum pagamento de cliente gerou comissão em ${nomeMes(r.competencia)}.</div>` : ''}
    </div>
    ${r.lancamentos.length ? `<div class="painel" style="margin-top:16px"><div class="painel-cab"><h2>Pagamentos que geraram comissão em ${nomeMes(r.competencia)}</h2></div>
      <div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Vendedor</th><th class="dir">Valor pago</th><th class="dir">Comissão</th><th></th></tr></thead><tbody>
      ${r.lancamentos.map(l => `<tr><td class="num">${data(l.pago_em || l.created_at)}</td><td>${l.pedido_id ? `<a href="#/pedido/${l.pedido_id}">${esc(l.pedido_numero)}</a>` : '—'}</td>
        <td>${esc(l.cliente_nome || '')}</td><td>${esc(l.vendedor_nome)}</td><td class="dir num">${brl(l.valor_base)}</td>
        <td class="dir num" style="${l.valor_comissao < 0 ? 'color:var(--vermelho)' : ''}">${brl(l.valor_comissao)}</td>
        <td>${l.tipo === 'estorno' ? badge('Estorno', 'b-vermelho') : !l.devida ? badge('Economizada', 'b-verde') : l.estornado ? badge('Estornada', 'b-cinza') : ''}</td></tr>`).join('')}
      </tbody></table></div></div>` : ''}
    ${r.fechamentos.length ? `<div class="painel" style="margin-top:16px"><div class="painel-cab"><h2>Últimos 12 meses</h2></div>
      <div class="tabela-wrap"><table><thead><tr><th>Mês</th><th>Vendedor</th><th class="dir">Devido</th><th class="dir">Economizado</th><th>Repasse</th><th>Situação</th></tr></thead><tbody>
      ${r.fechamentos.map(x => `<tr><td>${nomeMes(x.competencia)}</td><td>${esc(x.vendedor_nome)}</td><td class="dir num">${brl(x.valor_devido)}</td>
        <td class="dir num">${Number(x.valor_economizado) ? brl(x.valor_economizado) : '—'}</td><td class="num">${x.pago_em ? 'Feito em ' + data(x.pago_em) : data(x.data_repasse_prevista)}</td><td>${badge(...SIT[x.situacao])}</td></tr>`).join('')}
      </tbody></table></div></div>` : ''}`;
  $('#c-mes').onchange = e => { S.cache.compComissao = e.target.value; recarregar(); };
});
async function pagarComissao(id, desfazer = false) {
  if (!await confirmar(desfazer ? 'Desfazer o registro deste repasse?' : 'Confirmar que o repasse desta comissão foi feito hoje?', desfazer ? 'Desfazer' : 'Confirmar repasse')) return;
  await api('pagar_comissao', { id, desfazer }); toast(desfazer ? 'Registro desfeito.' : 'Repasse registrado.'); recarregar();
}

/* ---------- CLIENTES ---------- */
rota('clientes', async (_p, el) => {
  definirTopo('Clientes', pode('cadastra_clientes') ? `<button class="btn prim" onclick="modalCliente(null, recarregar)">Novo cliente</button>` : '');
  el.innerHTML = `<div class="painel filtros"><label class="campo">Buscar<input type="search" id="cl-busca" placeholder="Nome, fantasia, CPF/CNPJ ou WhatsApp"></label></div><div class="painel" id="cl-lista"></div>`;
  const buscar = async () => {
    const r = await api('buscar_clientes', { busca: $('#cl-busca').value, limite: 200, incluir_inativos: true });
    $('#cl-lista').innerHTML = r.clientes.length ? `<div class="tabela-wrap"><table><thead><tr><th>Cliente</th><th>CPF / CNPJ</th><th>Contato</th><th>Cidade</th><th></th></tr></thead><tbody>
      ${r.clientes.map(c => `<tr class="clicavel" onclick="modalCliente('${c.id}', recarregar)"><td><b>${esc(c.nome_fantasia || c.nome)}</b>${c.nome_fantasia ? `<div class="small muted">${esc(c.nome)}</div>` : ''}</td>
        <td class="num">${esc(c.cpf_cnpj || '—')}</td><td>${esc(c.whatsapp || c.telefone || '')}<div class="small muted">${esc(c.email || '')}</div></td><td>${esc(c.cidade || '')}</td>
        <td>${c.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Nenhum cliente encontrado.</div>';
  };
  let t; $('#cl-busca').oninput = () => { clearTimeout(t); t = setTimeout(buscar, 350); };
  await buscar();
});

/* ---------- FORNECEDORES ---------- */
rota('fornecedores', async (_p, el) => {
  definirTopo('Fornecedores', `<button class="btn prim" onclick="modalFornecedor(null)">Novo fornecedor</button>`);
  await carregarBase();
  const l = S.base.fornecedores;
  el.innerHTML = `<div class="painel">${l.length ? `<div class="tabela-wrap"><table><thead><tr><th>Fornecedor</th><th>Especialidades</th><th>Contato</th><th>Prazo padrão</th><th></th></tr></thead><tbody>
    ${l.map(f => `<tr class="clicavel" onclick="modalFornecedor('${f.id}')"><td><b>${esc(f.nome)}</b><div class="small muted">${esc(f.cnpj || '')}</div></td><td>${esc(f.especialidades || '')}</td>
      <td>${esc(f.contato_nome || '')}<div class="small muted">${esc(f.whatsapp || f.telefone || '')}</div></td><td>${f.prazo_padrao_dias ? f.prazo_padrao_dias + ' dias' : '—'}</td><td>${f.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="vazio">Cadastre as gráficas parceiras para usar na pré-impressão.</div>'}</div>`;
});
function modalFornecedor(id) {
  const f = id ? S.base.fornecedores.find(x => x.id === id) : { ativo: true };
  const c = (n, r, t = 'text') => `<label class="campo">${r}<input type="${t}" name="${n}" value="${esc(f[n] ?? '')}"></label>`;
  const m = abrirModal({ titulo: id ? f.nome : 'Novo fornecedor', largo: true, corpo: `<form id="f-forn" class="grade g3">
    ${c('nome', 'Nome')}${c('razao_social', 'Razão social')}${c('cnpj', 'CNPJ')}${c('contato_nome', 'Contato')}${c('whatsapp', 'WhatsApp')}${c('telefone', 'Telefone')}
    ${c('email', 'E-mail')}${c('site', 'Site / portal')}${c('prazo_padrao_dias', 'Prazo padrão (dias)', 'number')}
    <label class="campo" style="grid-column:1/-1">Especialidades<input type="text" name="especialidades" value="${esc(f.especialidades || '')}" placeholder="Ex.: cartões, banners, adesivos"></label>
    <label class="campo" style="grid-column:1/-1">Observações<textarea name="observacoes">${esc(f.observacoes || '')}</textarea></label>
    <label class="check"><input type="checkbox" name="ativo" value="true" ${f.ativo ? 'checked' : ''}> Ativo</label></form>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar fornecedor</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-forn', m.el)); d.ativo = !!d.ativo; if (id) d.id = id;
    await api('salvar_fornecedor', d); m.fechar(); toast('Fornecedor salvo.'); recarregar();
  };
}

/* ---------- PRODUTOS ---------- */
rota('produtos', async (_p, el) => {
  definirTopo('Produtos', `<button class="btn prim" onclick="modalProduto(null)">Novo produto</button>`);
  await carregarBase();
  const l = S.base.produtos; const forn = id => S.base.fornecedores.find(f => f.id === id)?.nome || '—';
  el.innerHTML = `<div class="painel">${l.length ? `<div class="tabela-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Fornecedor padrão</th><th>Faixas de preço</th><th></th></tr></thead><tbody>
    ${l.map(p => `<tr class="clicavel" onclick="modalProduto('${p.id}')"><td><b>${esc(p.nome)}</b><div class="small muted">${esc(p.descricao || '')}</div></td><td>${esc(p.categoria || '')}</td>
      <td>${esc(forn(p.fornecedor_padrao_id))}</td><td class="small">${(p.faixas || []).map(f => `${num(f.qtd_min)}${f.qtd_max ? '–' + num(f.qtd_max) : '+'}: ${brl(f.preco_unitario)}`).join('<br>') || (p.preco_base ? brl(p.preco_base) : '—')}</td>
      <td>${p.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Nenhum produto no catálogo ainda. Itens também podem ser lançados como avulsos.</div>'}</div>`;
});
function modalProduto(id) {
  const p = id ? S.base.produtos.find(x => x.id === id) : { ativo: true, unidade: 'un', faixas: [] };
  let faixas = (p.faixas || []).map(f => ({ ...f }));
  const m = abrirModal({ titulo: id ? p.nome : 'Novo produto', largo: true, corpo: `<form id="f-prod" class="grade g3">
    <label class="campo" style="grid-column:span 2">Nome<input type="text" name="nome" value="${esc(p.nome || '')}"></label>
    <label class="campo">Categoria<input type="text" name="categoria" value="${esc(p.categoria || '')}"></label>
    <label class="campo" style="grid-column:1/-1">Descrição<input type="text" name="descricao" value="${esc(p.descricao || '')}"></label>
    <label class="campo">Fornecedor padrão<select name="fornecedor_padrao_id"><option value="">Nenhum</option>${S.base.fornecedores.map(f => `<option value="${f.id}" ${f.id === p.fornecedor_padrao_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></label>
    <label class="campo">Prazo padrão (dias)<input type="number" name="prazo_padrao_dias" value="${esc(p.prazo_padrao_dias ?? '')}"></label>
    <label class="campo">Preço base (R$/un)<input type="number" step="0.0001" name="preco_base" value="${esc(p.preco_base ?? '')}"></label>
    <label class="campo">Unidade<input type="text" name="unidade" value="${esc(p.unidade || 'un')}"></label>
    <label class="campo" style="grid-column:span 2">Link do gabarito<input type="text" name="gabarito_url" value="${esc(p.gabarito_url || '')}"></label>
    <label class="check"><input type="checkbox" name="ativo" value="true" ${p.ativo ? 'checked' : ''}> Ativo</label></form>
    <div><div class="painel-cab" style="margin-bottom:6px"><h3>Faixas de preço por quantidade</h3><button type="button" class="btn peq" id="add-fx">Adicionar faixa</button></div><div id="fx"></div></div>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar produto</button>` });
  const desenhar = () => {
    $('#fx', m.el).innerHTML = faixas.length ? faixas.map((f, k) => `<div class="linha-form" style="margin-bottom:6px">
      <input type="number" placeholder="De (qtd)" value="${esc(f.qtd_min ?? '')}" data-k="${k}" data-f="qtd_min">
      <input type="number" placeholder="Até (vazio = sem limite)" value="${esc(f.qtd_max ?? '')}" data-k="${k}" data-f="qtd_max">
      <input type="number" step="0.0001" placeholder="Preço unitário" value="${esc(f.preco_unitario ?? '')}" data-k="${k}" data-f="preco_unitario">
      <button type="button" class="btn link peq" data-rm="${k}" style="flex:0">Remover</button></div>`).join('') : '<p class="small muted" style="margin:0">Sem faixas: vale o preço base.</p>';
    $$('#fx [data-f]', m.el).forEach(i => i.oninput = () => faixas[i.dataset.k][i.dataset.f] = i.value);
    $$('#fx [data-rm]', m.el).forEach(b => b.onclick = () => { faixas.splice(b.dataset.rm, 1); desenhar(); });
  };
  desenhar();
  $('#add-fx', m.el).onclick = () => { faixas.push({}); desenhar(); };
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-prod', m.el)); d.ativo = !!d.ativo; d.faixas = faixas.filter(f => f.qtd_min !== '' && f.qtd_min != null && f.preco_unitario !== '' && f.preco_unitario != null); if (id) d.id = id;
    await api('salvar_produto', d); m.fechar(); toast('Produto salvo.'); recarregar();
  };
}

/* ---------- FERIADOS ---------- */
rota('feriados', async (_p, el) => {
  definirTopo('Feriados', '');
  const r = await api('feriados');
  r.feriados.forEach(f => S.feriados[f.data] = f);
  const TIPO = { nacional:'Nacional', estadual:'Estadual', municipal:'Municipal (Osasco)', facultativo:'Ponto facultativo', emenda:'Emenda' };
  el.innerHTML = `<div class="painel"><p class="small muted" style="margin-top:0">Usado para calcular o 5º dia útil do repasse de comissões. Marque "conta como feriado" nos dias em que a GVH não abre.</p>
    <form id="f-fer" class="linha-form" style="margin-bottom:16px">
      <label class="campo">Data<input type="date" name="data" required></label><label class="campo" style="flex:2">Nome<input type="text" name="nome" required></label>
      <label class="campo">Tipo<select name="tipo">${Object.entries(TIPO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="check" style="flex:0;min-width:auto;padding-bottom:9px"><input type="checkbox" name="conta_como_feriado" value="true" checked> Conta como feriado</label>
      <button class="btn prim" style="flex:0">Salvar</button></form>
    <div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Nome</th><th>Tipo</th><th>Conta como feriado</th><th></th></tr></thead><tbody>
    ${r.feriados.map(f => `<tr><td class="num">${data(f.data)}</td><td>${esc(f.nome)}</td><td>${esc(TIPO[f.tipo] || f.tipo)}</td>
      <td><button class="btn link peq" onclick="alternarFeriado('${f.data}')">${f.conta_como_feriado ? 'Sim' : 'Não'}</button></td>
      <td class="dir"><button class="btn link peq" onclick="excluirFeriado('${f.data}')">Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $('#f-fer').onsubmit = async e => { e.preventDefault(); const d = formDados(e.target); d.conta_como_feriado = !!d.conta_como_feriado; await api('feriados', { salvar: d }); toast('Feriado salvo.'); recarregar(); };
});
async function alternarFeriado(dt) { const f = S.feriados[dt]; await api('feriados', { salvar: { ...f, conta_como_feriado: !f.conta_como_feriado } }); recarregar(); }
async function excluirFeriado(d) { if (!await confirmar('Excluir este feriado?', 'Excluir', true)) return; await api('feriados', { excluir: d }); recarregar(); }

/* ---------- USUÁRIOS (diretor) ---------- */
rota('usuarios', async (_p, el) => {
  definirTopo('Usuários', `<button class="btn prim" onclick="modalUsuario(null)">Novo usuário</button>`);
  const r = await api('listar_usuarios'); S.vistaEmRender.dados = r;
  el.innerHTML = `<div class="painel"><div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Comissão</th><th></th></tr></thead><tbody>
    ${r.usuarios.map(u => `<tr class="clicavel" onclick="modalUsuario('${u.id}')"><td><b>${esc(u.nome)}</b></td><td>${esc(u.email)}</td><td>${esc(u.perfil_nome)}</td>
      <td>${u.recebe_comissao ? num(u.percentual_comissao) + '%' : 'Não recebe (economizada)'}</td><td>${u.ativo ? '' : badge('Inativo', 'b-cinza')}</td></tr>`).join('')}
    </tbody></table></div></div>`;
});
function modalUsuario(id) {
  const u = id ? S.vistaAtual.dados.usuarios.find(x => x.id === id) : { ativo: true, recebe_comissao: true, percentual_comissao: 5, perfil: 'vendedor' };
  const m = abrirModal({ titulo: id ? u.nome : 'Novo usuário', corpo: `<form id="f-usu" class="grade g2">
    <label class="campo">Nome<input type="text" name="nome" value="${esc(u.nome || '')}"></label>
    <label class="campo">E-mail<input type="email" name="email" value="${esc(u.email || '')}"></label>
    <label class="campo">Perfil<select name="perfil">${S.vistaAtual.dados.perfis.map(p => `<option value="${p.codigo}" ${p.codigo === u.perfil ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <label class="campo">${id ? 'Nova senha (deixe em branco para manter)' : 'Senha'}<input type="text" name="senha" autocomplete="off"></label>
    <label class="campo">Comissão (%)<input type="number" step="0.01" name="percentual_comissao" value="${esc(u.percentual_comissao)}"></label>
    <div></div>
    <label class="check"><input type="checkbox" name="recebe_comissao" value="true" ${u.recebe_comissao ? 'checked' : ''}> Recebe comissão</label>
    <label class="check"><input type="checkbox" name="ativo" value="true" ${u.ativo ? 'checked' : ''}> Ativo</label></form>
    <p class="small muted" style="margin:0">Quem não recebe comissão tem o valor registrado como "comissão economizada". Trocar a senha encerra as sessões abertas desse usuário.</p>`,
    rodape: `<button class="btn" data-v>Voltar</button><button class="btn prim" data-s>Salvar usuário</button>` });
  m.el.querySelector('[data-v]').onclick = m.fechar;
  m.el.querySelector('[data-s]').onclick = async () => {
    const d = formDados($('#f-usu', m.el)); d.ativo = !!d.ativo; d.recebe_comissao = !!d.recebe_comissao; if (id) d.id = id;
    await api('salvar_usuario', d); m.fechar(); toast('Usuário salvo.'); recarregar();
  };
}

/* ---------- inicialização ---------- */
(async () => {
  let t = null; try { t = localStorage.getItem('gvh_token'); } catch {}
  if (!t) { $('#tela-login').classList.remove('hidden'); return; }
  S.token = t;
  try { const r = await api('sessao', {}, true); salvarSessao({ ...r, token: t }); await iniciarApp(); }
  catch { sairLocal(); }
})();
</script>
